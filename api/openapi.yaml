  /api/assist/sessions:
    get:
      operationId: listAssistSessions
      tags: [assist]
      summary: List assist sessions
      description: |
        Recent and active assistant chats (every kind, general ones included), newest first. `target_kind` and `target_id` narrow the list
        to the sessions of one target (for example the sensor or flow an editor is open on). Closed sessions are not listed.
      x-hal-service: api
      parameters:
        - {name: target_kind, in: query, schema: {$ref: '#/components/schemas/AssistTargetKind'}}
        - {name: target_id, in: query, description: 'Sensor, flow or tool id. Only sessions that edit that target.', schema: {$ref: '#/components/schemas/Slug'}}
      responses:
        '200':
          description: Sessions, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistSessionList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
