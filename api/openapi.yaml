      responses:
        '200':
          description: One page of items.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/inbox/{id}:
    parameters:
      - {$ref: '#/components/parameters/InboxId'}
    get:
      operationId: getInboxItem
      tags: [inbox]
      summary: Get an inbox item
      x-hal-service: api
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InboxItem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateInboxItem
      tags: [inbox]
