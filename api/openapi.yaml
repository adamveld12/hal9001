        - {name: max_priority, in: query, description: Maximum priority. `priority=low&max_priority=low` lists only low items., schema: {$ref: '#/components/schemas/Priority'}}
        - {name: read, in: query, schema: {type: boolean}}
        - {name: starred, in: query, schema: {type: boolean}}
        - name: archived
