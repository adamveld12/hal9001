        '200':
          description: Draft replaced.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistDraft'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/assist/sessions/{id}/test:
    parameters:
      - {$ref: '#/components/parameters/AssistSessionId'}
    post:
      operationId: testAssistDraft
      tags: [assist]
      summary: Run the draft once (a poll for a sensor, one input for a flow, one call for a tool)
      description: |
        Sensor sessions: runs the draft's script exactly as a poll would (`lang`, `script`/`command`, `timeout`, the `HAL_*` variables
        with a temporary `HAL_STATE_DIR` and no `HAL_LAST_SUCCESS_AT`) with the global env file overlaid by the values
        in the target sensor's `env.d` file, and returns the redacted result. Nothing is recorded: no sensor run, no
        events, no dedup keys. This is the only way the agent can execute the draft, because the agent never receives
        the secret values. 422 `validation-failed` when the draft does not parse as a sensor. The kill switch does not apply.

        The script runs with real credentials, so the caller matters. A test by the user (no `X-Hal9001-Assist-Agent`
        header: the UI's Test button, the API, the CLI outside an agent) always runs and marks the draft's script as
        approved. A test by the agent (the CLI inside an assist session sends the header) runs only while the script,
        meaning `lang`, `script`, `command`, `cwd` and the names of the env variables it references, equals the one the
        user last tested or approved, or the saved script of the target sensor; otherwise 409 `invalid-state`. The agent
        asks for that approval through its permission request for `hal9001 assist test` (a `tool_call` approval).

        Flow sessions: the draft flow runs once on one input (`AssistTestRequest`) as a `kind: test` flow run with
        `dry_run` forced, so `side_effect` command nodes are skipped. Transform and command nodes run for real and the
        run follows the edges; agent nodes are not run (`skipped`, their branch ends there); inbox nodes record the item
        they would create and create none. Command nodes run with the global env file like a real run, so an agent's
        test needs the user's approval the same way: the hash covers every command node's `lang`, `script`, `command`,
        `cwd` and the env names they reference (generated transform jq does not count), and is compared with the one
        the user last tested or approved or the saved flow's. 422 `validation-failed` when the draft does not validate
        (including `prompts/` files) or no input is available. The result is the `flow` variant of `AssistTestResult`.

        Tool sessions: calls the draft tool once with `args` (defaults filled in; 422 when they do not fit its
        parameters) with the global env file overlaid by the target tool's `env.d/tools` file, and returns the `tool`
        variant. Nothing is recorded and no approval of the call itself is asked. The same approval rule as for
        sensors applies to the agent: the hash covers `lang`, `script`, `command` and the env names the code
        references.
      x-hal-service: admin
      parameters:
        - name: X-Hal9001-Assist-Agent
          in: header
          required: false
          description: Set by the CLI when it runs inside an assist session. Any non-empty value marks the caller as the agent.
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistTestRequest'}
      responses:
        '200':
          description: The run finished (a failing script still answers 200; see `exit_code`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistTestResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/assist/sessions/{id}/samples:
    parameters:
      - {$ref: '#/components/parameters/AssistSessionId'}
    get:
      operationId: listAssistSamples
      tags: [assist]
      summary: Sample inputs of a flow session
      description: |
        Flow sessions: the recent event payloads of the known sensors (up to 5 per sensor, redacted), in the order of
        `reference/samples/` in the draft directory (sensor ids sorted, newest event first). `index` is what
        `sample_index` of the test request and `hal9001 assist test --sample N` refer to. The list is refreshed at the
        start of every turn. Empty for sensor sessions.
      x-hal-service: api
      responses:
        '200':
          description: Samples.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistSampleList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/assist/sessions/{id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/AssistSessionId'}
    post:
      operationId: cancelAssistSession
      tags: [assist]
      summary: Cancel the running turn
      description: 'Cancels the running turn (`session/cancel`, then the process if the agent does not answer). The session stays usable. Idempotent: without a running turn it returns the session unchanged.'
      x-hal-service: admin
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      description: |
        Every assistant chat (an assist session of any kind, closed ones included; `source: chat`, `id` = the session id) and
        every agent run of a flow node (`source: flow`, `id` = the run's last phase) in one list, ordered by last activity,
        newest first, then by id. The turns of a chat are not listed on their own. A propose-phase run that has an
        execute-phase run (`prev_agent_run_id`) belongs to that run's conversation and is not listed separately.

        `status` is normalised. A chat's `idle`, `running`, `awaiting_approval`, `failed` and `closed` are kept. An agent run's
        `succeeded`, `failed`, `denied`, `killed`, `interrupted`, `timeout`, `running` and `awaiting_approval` are kept and
        `queued` is `running`. So `running` and `awaiting_approval` cover both sources, and `idle` and `closed` only chats.

        `q` is a case-insensitive substring (ASCII) match on the title, ids, flow and node ids, the text of a chat's messages
        and the prompt and result text of a flow run (prompts and results over 64 KiB are stored outside the database and not
        searched). `forked_from` lists the chats forked from that agent run (or from another phase of its node run).
        `since` is inclusive and `until` exclusive, on the last activity. The cursor is opaque and stable while rows
        share a timestamp.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: source, in: query, schema: {$ref: '#/components/schemas/ConversationSource'}}
        - {name: kind, in: query, description: 'A chat''s target kind, or `agent` for flow conversations.', schema: {$ref: '#/components/schemas/ConversationKind'}}
        - {name: flow, in: query, description: 'Flow id: runs of that flow, forks of them and chats that draft that flow.', schema: {$ref: '#/components/schemas/Slug'}}
        - {name: node, in: query, description: 'Node id.', schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_run, in: query, description: 'Flow run id: its agent runs and the forks of them.', schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: runtime, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ConversationStatus'}}
        - {name: forked_from, in: query, description: 'Agent run id: only the chats forked from it.', schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: q, in: query, description: 'Text to search for (at most 200 characters).', schema: {type: string, maxLength: 200}}
        - {$ref: '#/components/parameters/ConversationSince'}
        - {$ref: '#/components/parameters/ConversationUntil'}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations/{id}:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation
      description: |
        One conversation with the chats forked from it. `id` is an assist session id or an agent run id of a flow node; a
        propose-phase run that has an execute-phase run resolves to the conversation of the execute-phase run (its `id`
        is the execute-phase run's). 404 for anything else, including an agent run that is a turn of a chat.
      x-hal-service: api
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: Get the transcript of a conversation
      description: |
        The transcript in one shape for both sources, oldest first, at most the newest 2000 entries (`truncated` says
        older ones were left out). A chat's entries are its stored messages (`id` is the message id; the same entries as
        `GET /api/assist/sessions/{id}`). For a flow conversation the server folds the agent run's events into the same
        shape, like the Agent run page: the rendered prompt is the first `user` message, adjacent chunks of the agent's text
        are one `assistant` message, a tool call and its updates are one `tool` message (with its arguments and results;
        `approval_id` is the approval that gated it), thoughts and plans are left out, a proposal approval and the way the
        run ended (finished, failed, emitted on a port) are `system` messages. Their `id` is
        `<agent_run_id>:<zero padded seq>`, stable while the run grows. A propose-phase run that has an execute-phase run
        contributes its entries first. Content is redacted as in the other endpoints.
      x-hal-service: api
      responses:
        '200':
          description: The transcript.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationMessageList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/conversations/{id}/fork:
    parameters:
      - {$ref: '#/components/parameters/ConversationId'}
    post:
      operationId: forkConversation
      tags: [conversations]
      summary: Continue an agent run in a chat
      description: |
        Creates a chat that continues the agent run of a flow node (`id` is the run, or the propose-phase run of a node
        run whose execute-phase run is then the one continued). The run is not changed. The chat is an assist session of
        kind `general` with the node's runtime and model, a divider message ("Continued from run X") and the link
        `forked_from`. No agent process starts and nothing is sent: the user's first message (`POST
        /api/assist/sessions/{id}/messages`) starts the first turn, which restores the run's context by loading the
        runtime's own session when it supports that and the run's working directory still exists (`fork_context`
        `resumed`), else by sending a compacted transcript of the run (`replayed`); the divider then says which. The chat has
        the node's custom tools, the node's sandbox tools (a sandbox the run still keeps alive is taken over), the read
        tools and, for the ports of the node that lead somewhere, `emit_<port>` tools that start a new flow run once the user
        approves. 404 for an unknown run or one that is a turn of a chat; 409 `invalid-state` while the run is running or
        waiting for an approval; 422 when the node's runtime is no longer configured.
      x-hal-service: admin
      responses:
        '201':
          description: The new conversation (source `chat`).
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/runtimes:
    get:
      operationId: listRuntimes
      tags: [runtimes]
