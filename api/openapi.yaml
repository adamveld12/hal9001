      - {$ref: '#/components/parameters/AssistSessionId'}
    post:
      operationId: sendAssistMessage
      tags: [assist]
      summary: Send a message and start a turn
      description: |
        Stores the user message and starts one agent turn; the agent's work arrives as `assist.message` events and as
        draft changes (`assist.updated`). `yaml`, when sent, first replaces the draft so the agent sees the editor's
        latest content. 409 `invalid-state` while a turn is running or the session is closed. The kill switch does not apply.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistSendRequest'}
      responses:
        '202':
          description: Turn started.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
