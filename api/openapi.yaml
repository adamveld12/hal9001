    parameters:
      - {$ref: '#/components/parameters/AssistSessionId'}
    put:
      operationId: updateAssistDraft
      tags: [assist]
      summary: Replace the draft
      description: |
        The editor's way to hand its content to the session. `expected_hash` (the draft `hash` from the last read)
        guards against overwriting a change the agent made meanwhile; 409 `conflict` on mismatch, carrying
        `current_hash`. Allowed while a turn runs. The draft is validated like a sensor file, with diagnostics
        returned in the draft; invalid YAML is accepted.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistDraftRequest'}
