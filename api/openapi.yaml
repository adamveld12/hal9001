openapi: 3.1.0
info:
  title: hal9001 API
  version: 1.0.0
  summary: REST contract for the hal9001 daemon, used by the web UI, the CLI, and tests.
  description: |
    Single interface for the hal9001 daemon (REQUIREMENTS §10.2). The web UI and the `hal9001` CLI are clients of this
    document and have no private endpoints. Change it in the same commit as the handler.

    Conventions
    - JSON bodies use snake_case names that match the trace-model columns in REQUIREMENTS §9. IDs of runs, events,
      approvals, and inbox items are ULIDs. Times are RFC 3339 with nanoseconds, in UTC.
    - Flow, sensor, prompt, and config JSON mirror the YAML formats in REQUIREMENTS §5-§7 and the `internal/spec`
      types. Durations are strings such as `60s`, `20m`, `7d`.
    - Content hashes are the lowercase hex SHA-256 of the raw file bytes. Writes that replace or delete a file carry
      `expected_hash`; a mismatch is a 409 `conflict`. An empty `expected_hash` on create means the file must not
      exist yet.
    - Lists are `{items, next_cursor}`; pass `next_cursor` back as `cursor`. Newest first unless stated.
    - Every error is `application/problem+json` with a stable `type` URI (see `ProblemType`).
    - Every request that is not GET/HEAD must send `Content-Type: application/json`, including body-less POSTs. The
      body may then be empty or `{}`. Otherwise the server answers 415.
    - Each operation declares the auth service that guards it in `x-hal-service` (`ui`, `api`, `approve`, `admin`).
      Operations with `x-hal-public: true` are reachable without a session so that clients can log in or probe
      liveness; the baseline checks (Host, Origin, content type) still apply.
    - `x-hal-paused` marks operations that behave differently while the kill switch is engaged; see each operation.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:9001
    description: Loopback listener. Remote access goes through `tailscale serve` and uses the same paths.
security:
  - {}
  - sessionCookie: []
tags:
  - {name: meta, description: 'Health, version, status, SSE stream, UI shell'}
  - {name: killswitch, description: Pause and resume the daemon}
  - {name: sensors, description: Sensor definitions and polls}
  - {name: tools, description: 'Custom tools agents can call: definitions, test runs, environment'}
  - {name: events, description: 'Events, injection, replay'}
  - {name: flows, description: 'Flow definitions, versions, validation, node test runs'}
  - {name: runs, description: Flow runs and node runs}
  - {name: queue, description: 'Runs waiting for a slot: list, remove, clear'}
  - {name: agents, description: 'Agent runs, transcripts, permission requests'}
  - {name: approvals, description: Approval queue}
  - {name: inbox, description: Inbox items}
  - {name: notifications, description: 'Notification log: what the daemon notified, over which channel'}
  - {name: prompts, description: Prompt library}
  - {name: runtimes, description: Configured ACP runtimes}
  - {name: settings, description: Settings and environment keys}
  - {name: update, description: 'macOS app self-update: state, check, install, installer reports'}
  - {name: sandboxes, description: 'Sandbox backends: config, environment, connectivity check'}
  - {name: assist, description: 'AI-assisted sensor authoring: sessions, draft, test runs'}
  - {name: conversations, description: 'Assistant chats and agent runs of flow nodes as one list of conversations, their transcripts, and forking a run into a chat'}
  - {name: auth, description: 'Login, sessions, passkeys, auth events'}
  - {name: tailscale, description: 'Share hal9001 on your tailnet: detection, `tailscale serve`, allowed_hosts'}
  - {name: mcp, description: 'hal MCP server: the remote endpoint and connection info for external clients, and the per-run backend of the stdio server hal injects into agent sessions (authorized by a capability token)'}
paths:
  /:
    get:
      operationId: getUIShell
      tags: [meta]
      summary: Web UI shell (index.html)
      description: |
        Serves the embedded single-page app. Any other GET path that does not start with `/api/` and is not an
        embedded asset also serves this document, so client-side routes work on reload. The shell and its assets
        are public: they hold no data, and the login page is part of them, so a stack that does not admit the
        request (for example password only) must still be able to load it. Every `/api/` call stays guarded.
      x-hal-service: ui
      x-hal-public: true
      security: []
      responses:
        '200':
          description: HTML document.
          content:
            text/html:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /assets/{path}:
    get:
      operationId: getUIAsset
      tags: [meta]
      summary: Embedded web UI asset
      description: Public, like the shell (see `getUIShell`).
      x-hal-service: ui
      x-hal-public: true
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: Asset path under `assets/`; may contain slashes.
          schema: {type: string}
      responses:
        '200':
          description: Asset bytes with a content type derived from the file extension.
          content:
            '*/*':
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe
      description: Minimal and public so launchd, scripts, `hal9001 service install` and the macOS app can check that the daemon is up.
      x-hal-service: api
      x-hal-public: true
      security: []
      responses:
        '200':
          description: Daemon is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/version:
    get:
      operationId: getVersion
      tags: [meta]
      summary: Build and runtime information
      x-hal-service: api
      responses:
        '200':
          description: Version details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/status:
    get:
      operationId: getStatus
      tags: [meta]
      summary: Header counters and kill-switch state
      description: One cheap call for the UI header badges. Changes are also pushed as `status.changed` on the stream.
      x-hal-service: api
      responses:
        '200':
          description: Current counters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/stream:
    get:
      operationId: streamEvents
      tags: [meta]
      summary: Server-sent events
      description: |
        Live updates as `text/event-stream`. Each message has `id: <sequence>`, `event: <type>`, and one
        `data:` line holding the JSON envelope for that type (`StreamEvent`; the per-type schema is in the
        `x-hal-sse-events` map of this operation). `: keepalive` comment lines are sent every 15 seconds.

        Filtering: `types` limits the event types (default: all). The resource filters (`sensor_id`, `flow_id`,
        `flow_run_id`, `agent_run_id`, `assist_session_id`) apply to the types that carry that resource and leave other types untouched.
        `stream.ready` and `stream.resync` are always delivered.

        Notification sinks: a client that shows notifications itself (the macOS app) opens this stream with
        `types=notification.created` and the header `X-Hal9001-Notifier: app`. While at least one such connection is open
        and `notify_via` is `auto`, the daemon does not run terminal-notifier and routes notifications to channel `app`;
        the sink renders each `notification.created` event.

        Update installer: the macOS app opens the stream with `types` including `update.install` and the header
        `X-Hal9001-Updater: app` (honoured for callers granted `admin`). It receives `update.install` orders; no other
        connection does, and they are never replayed. `update.status` goes to every subscriber.

        Resuming: send `Last-Event-ID` (the browser does this automatically). The server replays what it still
        buffers. When the gap is larger than the buffer it sends `stream.resync`; clients must then refetch the
        resources they display.
      x-hal-service: api
      x-hal-sse-events:
        stream.ready: '#/components/schemas/StreamReadyEvent'
        stream.resync: '#/components/schemas/StreamResyncEvent'
        status.changed: '#/components/schemas/StatusChangedEvent'
        killswitch.changed: '#/components/schemas/KillSwitchChangedEvent'
        sensor.changed: '#/components/schemas/SensorChangedEvent'
        config.changed: '#/components/schemas/ConfigChangedEvent'
        sensor_run.created: '#/components/schemas/SensorRunCreatedEvent'
        sensor_run.updated: '#/components/schemas/SensorRunUpdatedEvent'
        event.created: '#/components/schemas/EventCreatedEvent'
        flow_run.created: '#/components/schemas/FlowRunCreatedEvent'
        flow_run.updated: '#/components/schemas/FlowRunUpdatedEvent'
        node_run.created: '#/components/schemas/NodeRunCreatedEvent'
        node_run.updated: '#/components/schemas/NodeRunUpdatedEvent'
        agent_run.created: '#/components/schemas/AgentRunCreatedEvent'
        agent_run.updated: '#/components/schemas/AgentRunUpdatedEvent'
        agent_event.appended: '#/components/schemas/AgentEventAppendedEvent'
        sandbox_session.created: '#/components/schemas/SandboxSessionCreatedEvent'
        sandbox_session.updated: '#/components/schemas/SandboxSessionUpdatedEvent'
        sandbox_log.appended: '#/components/schemas/SandboxLogAppendedEvent'
        permission_request.created: '#/components/schemas/PermissionRequestCreatedEvent'
        permission_request.updated: '#/components/schemas/PermissionRequestUpdatedEvent'
        approval.created: '#/components/schemas/ApprovalCreatedEvent'
        approval.updated: '#/components/schemas/ApprovalUpdatedEvent'
        inbox.created: '#/components/schemas/InboxCreatedEvent'
        inbox.updated: '#/components/schemas/InboxUpdatedEvent'
        notification.created: '#/components/schemas/NotificationCreatedEvent'
        auth_event.created: '#/components/schemas/AuthEventCreatedEvent'
        assist.updated: '#/components/schemas/AssistUpdatedEvent'
        assist.message: '#/components/schemas/AssistMessageEvent'
        assist.navigate: '#/components/schemas/AssistNavigateEvent'
        assist.start_draft: '#/components/schemas/AssistStartDraftEvent'
        update.status: '#/components/schemas/UpdateStatusEvent'
        update.install: '#/components/schemas/UpdateInstallEvent'
        runtime.adapter: '#/components/schemas/RuntimeAdapterEvent'
      parameters:
        - name: types
          in: query
          description: Comma-separated event types to receive. Default is every type.
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/StreamEventType'}
        - {name: sensor_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: agent_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: assist_session_id, in: query, description: 'Applies to `assist.updated`, `assist.message`, `assist.navigate`, `assist.start_draft`, and to the agent run and approval events of that session.', schema: {$ref: '#/components/schemas/Ulid'}}
        - name: X-Hal9001-Notifier
          in: header
          description: '`app` registers this connection as a notification sink (see the description).'
          schema: {type: string, enum: [app]}
        - name: X-Hal9001-Updater
          in: header
          description: '`app` registers this connection as the update installer (see the description).'
          schema: {type: string, enum: [app]}
        - name: Last-Event-ID
          in: header
          description: Last sequence number the client saw.
          schema: {type: string}
      responses:
        '200':
          description: Event stream. Never ends on its own.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events. Each `data:` line parses as a `StreamEvent`.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/blobs/{hash}:
    get:
      operationId: getBlob
      tags: [meta]
      summary: Download a stored blob
      description: |
        Payloads over 64 KiB (stdout, stderr, stdin, transcripts) are stored as content-addressed blobs and referenced
        by `TextBlob.blob`. Returns the decompressed bytes. Secrets were already redacted when stored.
      x-hal-service: api
      parameters:
        - {name: hash, in: path, required: true, schema: {$ref: '#/components/schemas/Hash'}}
      responses:
        '200':
          description: Blob content.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/update:
    get:
      operationId: getUpdate
      tags: [update]
      summary: App update state
      description: |
        Whether the macOS app can update itself, the channel and auto-install settings, the newest release on the feed,
        and where an install stands. The daemon checks the feed shortly after start, every 3 hours, on
        `POST /api/update/check`, and when the channel changes. Changes are pushed as `update.status` on the stream.
      x-hal-service: api
      responses:
        '200':
          description: Current update state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/update/check:
    post:
      operationId: checkUpdate
      tags: [update]
      summary: Check the update feed now
      description: |
        Fetches the manifest of the configured channel and returns the resulting state. A failed fetch is not an HTTP error:
        it is reported in `error`. A check within 10 seconds of the last successful one returns the cached result.
        Does nothing when updates are disabled.
      x-hal-service: admin
      responses:
        '200':
          description: State after the check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/update/install:
    post:
      operationId: installUpdate
      tags: [update]
      summary: Install the available update
      description: |
        Asks the installer (the macOS app, connected to the stream with `X-Hal9001-Updater: app`) to download, verify and
        install the available update and relaunch. While flow runs are running a normal request is kept (`state: pending`)
        and starts when none runs; with `force: true`, or when nothing runs, the order goes out at once (`state: installing`).
        Requesting again while pending or installing is a no-op. The daemon is down for up to about two minutes after the
        app relaunches (launchd re-registers the service); running work is interrupted by that restart.

        409 `invalid-state` with `current_state`: `disabled` (updates are off), `not_available` (nothing newer is offered),
        `no_installer` (the app is not connected: open it, or download the build by hand from `release_url`).
        With auto-install (`update_auto_install`) the same order goes out by itself once no flow runs.
      x-hal-service: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateInstallRequest'}
      responses:
        '202':
          description: The install was ordered (`installing`) or is waiting for flows to finish (`pending`).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/update/report:
    post:
      operationId: reportUpdate
      tags: [update]
      summary: Report install progress (installer app)
      description: |
        The installer app reports `downloading`, `verifying` and `installing` as it goes, and `failed` with an `error`
        when it gives up. The daemon treats an install as lost after 10 minutes without a report. 409 `invalid-state`
        (`current_state: not_installing`) when no install is running.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateReportRequest'}
      responses:
        '200':
          description: State after the report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/killswitch:
    get:
      operationId: getKillSwitch
      tags: [killswitch]
      summary: Kill-switch state
      x-hal-service: api
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/killswitch/pause:
    post:
      operationId: pauseKillSwitch
      tags: [killswitch]
      summary: Pause sensors and stop starting nodes
      description: |
        Pauses all sensor polling and stops starting new nodes. With `kill_running: true` also stops running work:
        SIGTERM to process groups, SIGKILL after 10 seconds, runs marked `killed`. Idempotent; pausing an already
        paused daemon with `kill_running: true` still kills what is running. State survives restarts.
      x-hal-service: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseRequest'}
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/killswitch/resume:
    post:
      operationId: resumeKillSwitch
      tags: [killswitch]
      summary: Resume sensors and node starts
      description: Queued runs start again and sensors resume on their schedule. Idempotent.
      x-hal-service: admin
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/queue:
    get:
      operationId: getQueue
      tags: [queue]
      summary: List the queue
      description: |
        Flow runs waiting for a slot, in the order the engine will claim them (oldest wait first): `queued` runs
        waiting for a flow slot (`flow_slot`), and `running` runs whose only unfinished node runs are `queued`,
        waiting for an agent or command slot (`agent_slot`, `command_slot`). While the kill switch is engaged every
        item waits for `kill_switch`. Runs awaiting approval are not in the queue (see approvals); test runs are
        excluded. `flow_id` limits the list to one flow. Changes arrive as `flow_run.updated` stream events.
      x-hal-service: api
      parameters:
        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
      responses:
        '200':
          description: The queue with totals and the current limits.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Queue'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/queue/clear:
    post:
      operationId: clearQueue
      tags: [queue]
      summary: Remove every queued run
      description: |
        Cancels every run in the queue (of one flow with `flow_id`). Cancelled runs stay in history with status
        `cancelled`. A run that started a node while the request ran is left alone. Idempotent: an empty queue
        returns `cancelled: 0`.
      x-hal-service: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClearQueueRequest'}
      responses:
        '200':
          description: What was cancelled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClearQueueResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/queue/{flow_run_id}:
    parameters:
      - {name: flow_run_id, in: path, required: true, schema: {$ref: '#/components/schemas/Ulid'}}
    delete:
      operationId: removeFromQueue
      tags: [queue]
      summary: Remove one run from the queue
      description: |
        Ends the run as `cancelled` (reason `removed from queue`, recording who and when) and cancels its queued
        node runs. History is kept. 409 `invalid-state` when the run is not in the queue, including when it is
        already running a node: use the kill switch or wait for it to finish.
      x-hal-service: admin
      responses:
        '200':
          description: The cancelled run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/tools:
    get:
      operationId: listTools
      tags: [tools]
      summary: List custom tools
      description: Every tool file under `tools/`, including ones that fail validation.
      x-hal-service: api
      responses:
        '200':
          description: All tools, ordered by id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createTool
      tags: [tools]
      summary: Create a custom tool
      description: |
        Writes `tools/<id>.yaml`. Send either `yaml` (raw file text) or `tool` (JSON form). Rejected with 422 when
        validation reports errors and 409 `already-exists` when the id is taken. Open assist sessions that were
        authoring a new tool with this id become sessions on it (`target.id` is set).
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolCreateRequest'}
      responses:
        '201':
          description: Created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/tools/validate:
    post:
      operationId: validateTool
      tags: [tools]
      summary: Validate a custom tool without saving
      description: Always 200 when the request itself is well formed; check `valid` and `diagnostics`.
      x-hal-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolValidateRequest'}
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolValidation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/tools/{id}:
