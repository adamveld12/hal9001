openapi: 3.1.0
info:
  title: hal9001 API
  version: 1.0.0
  summary: REST contract for the hal9001 daemon, used by the web UI, the CLI, and tests.
  description: |
    Single interface for the hal9001 daemon (REQUIREMENTS §10.2). The web UI and the `hal9001` CLI are clients of this
    document and have no private endpoints. Change it in the same commit as the handler.

    Conventions
    - JSON bodies use snake_case names that match the trace-model columns in REQUIREMENTS §9. IDs of runs, events,
      approvals, and inbox items are ULIDs. Times are RFC 3339 with nanoseconds, in UTC.
    - Flow, sensor, prompt, and config JSON mirror the YAML formats in REQUIREMENTS §5-§7 and the `internal/spec`
      types. Durations are strings such as `60s`, `20m`, `7d`.
    - Content hashes are the lowercase hex SHA-256 of the raw file bytes. Writes that replace or delete a file carry
      `expected_hash`; a mismatch is a 409 `conflict`. An empty `expected_hash` on create means the file must not
      exist yet.
    - Lists are `{items, next_cursor}`; pass `next_cursor` back as `cursor`. Newest first unless stated.
    - Every error is `application/problem+json` with a stable `type` URI (see `ProblemType`).
    - Every request that is not GET/HEAD must send `Content-Type: application/json`, including body-less POSTs. The
      body may then be empty or `{}`. Otherwise the server answers 415.
    - Each operation declares the auth service that guards it in `x-hal-service` (`ui`, `api`, `approve`, `admin`).
      Operations with `x-hal-public: true` are reachable without a session so that clients can log in or probe
      liveness; the baseline checks (Host, Origin, content type) still apply.
    - `x-hal-paused` marks operations that behave differently while the kill switch is engaged; see each operation.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:9001
    description: Loopback listener. Remote access goes through `tailscale serve` and uses the same paths.
security:
  - {}
  - sessionCookie: []
tags:
  - {name: meta, description: 'Health, version, status, SSE stream, UI shell'}
  - {name: killswitch, description: Pause and resume the daemon}
  - {name: sensors, description: Sensor definitions and polls}
  - {name: events, description: 'Events, injection, replay'}
  - {name: flows, description: 'Flow definitions, versions, validation, node test runs'}
  - {name: runs, description: Flow runs and node runs}
  - {name: agents, description: 'Agent runs, transcripts, permission requests'}
  - {name: approvals, description: Approval queue}
  - {name: inbox, description: Inbox items}
  - {name: prompts, description: Prompt library}
  - {name: runtimes, description: Configured ACP runtimes}
  - {name: settings, description: Settings and environment keys}
  - {name: auth, description: 'Login, sessions, passkeys, auth events'}
paths:
  /:
    get:
      operationId: getUIShell
      tags: [meta]
      summary: Web UI shell (index.html)
      description: |
        Serves the embedded single-page app. Any other GET path that does not start with `/api/` and is not an
        embedded asset also serves this document, so client-side routes work on reload. All of these are guarded by
        the `ui` service.
      x-hal-service: ui
      responses:
        '200':
          description: HTML document.
          content:
            text/html:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /assets/{path}:
    get:
      operationId: getUIAsset
      tags: [meta]
      summary: Embedded web UI asset
      x-hal-service: ui
      parameters:
        - name: path
          in: path
          required: true
          description: Asset path under `assets/`; may contain slashes.
          schema: {type: string}
      responses:
        '200':
          description: Asset bytes with a content type derived from the file extension.
          content:
            '*/*':
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/health:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe
      description: Minimal and public so launchd, scripts, and `hal9001 install` can check that the daemon is up.
      x-hal-service: api
      x-hal-public: true
      security: []
      responses:
        '200':
          description: Daemon is up.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/version:
    get:
      operationId: getVersion
      tags: [meta]
      summary: Build and runtime information
      x-hal-service: api
      responses:
        '200':
          description: Version details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/status:
    get:
      operationId: getStatus
      tags: [meta]
      summary: Header counters and kill-switch state
      description: One cheap call for the UI header badges. Changes are also pushed as `status.changed` on the stream.
      x-hal-service: api
      responses:
        '200':
          description: Current counters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Status'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/stream:
    get:
      operationId: streamEvents
      tags: [meta]
      summary: Server-sent events
      description: |
        Live updates as `text/event-stream`. Each message has `id: <sequence>`, `event: <type>`, and one
        `data:` line holding the JSON envelope for that type (`StreamEvent`; the per-type schema is in the
        `x-hal-sse-events` map of this operation). `: keepalive` comment lines are sent every 15 seconds.

        Filtering: `types` limits the event types (default: all). The resource filters (`sensor_id`, `flow_id`,
        `flow_run_id`, `agent_run_id`) apply to the types that carry that resource and leave other types untouched.
        `stream.ready` and `stream.resync` are always delivered.

        Resuming: send `Last-Event-ID` (the browser does this automatically). The server replays what it still
        buffers. When the gap is larger than the buffer it sends `stream.resync`; clients must then refetch the
        resources they display.
      x-hal-service: api
      x-hal-sse-events:
        stream.ready: '#/components/schemas/StreamReadyEvent'
        stream.resync: '#/components/schemas/StreamResyncEvent'
        status.changed: '#/components/schemas/StatusChangedEvent'
        killswitch.changed: '#/components/schemas/KillSwitchChangedEvent'
        config.changed: '#/components/schemas/ConfigChangedEvent'
        sensor_run.created: '#/components/schemas/SensorRunCreatedEvent'
        sensor_run.updated: '#/components/schemas/SensorRunUpdatedEvent'
        event.created: '#/components/schemas/EventCreatedEvent'
        flow_run.created: '#/components/schemas/FlowRunCreatedEvent'
        flow_run.updated: '#/components/schemas/FlowRunUpdatedEvent'
        node_run.created: '#/components/schemas/NodeRunCreatedEvent'
        node_run.updated: '#/components/schemas/NodeRunUpdatedEvent'
        agent_run.created: '#/components/schemas/AgentRunCreatedEvent'
        agent_run.updated: '#/components/schemas/AgentRunUpdatedEvent'
        agent_event.appended: '#/components/schemas/AgentEventAppendedEvent'
        permission_request.created: '#/components/schemas/PermissionRequestCreatedEvent'
        permission_request.updated: '#/components/schemas/PermissionRequestUpdatedEvent'
        approval.created: '#/components/schemas/ApprovalCreatedEvent'
        approval.updated: '#/components/schemas/ApprovalUpdatedEvent'
        inbox.created: '#/components/schemas/InboxCreatedEvent'
        inbox.updated: '#/components/schemas/InboxUpdatedEvent'
        auth_event.created: '#/components/schemas/AuthEventCreatedEvent'
      parameters:
        - name: types
          in: query
          description: Comma-separated event types to receive. Default is every type.
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/StreamEventType'}
        - {name: sensor_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: agent_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - name: Last-Event-ID
          in: header
          description: Last sequence number the client saw.
          schema: {type: string}
      responses:
        '200':
          description: Event stream. Never ends on its own.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events. Each `data:` line parses as a `StreamEvent`.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/blobs/{hash}:
    get:
      operationId: getBlob
      tags: [meta]
      summary: Download a stored blob
      description: |
        Payloads over 64 KiB (stdout, stderr, stdin, transcripts) are stored as content-addressed blobs and referenced
        by `TextBlob.blob`. Returns the decompressed bytes. Secrets were already redacted when stored.
      x-hal-service: api
      parameters:
        - {name: hash, in: path, required: true, schema: {$ref: '#/components/schemas/Hash'}}
      responses:
        '200':
          description: Blob content.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/killswitch:
    get:
      operationId: getKillSwitch
      tags: [killswitch]
      summary: Kill-switch state
      x-hal-service: api
      responses:
        '200':
          description: Current state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/killswitch/pause:
    post:
      operationId: pauseKillSwitch
      tags: [killswitch]
      summary: Pause sensors and stop starting nodes
      description: |
        Pauses all sensor polling and stops starting new nodes. With `kill_running: true` also stops running work:
        SIGTERM to process groups, SIGKILL after 10 seconds, runs marked `killed`. Idempotent; pausing an already
        paused daemon with `kill_running: true` still kills what is running. State survives restarts.
      x-hal-service: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PauseRequest'}
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/killswitch/resume:
    post:
      operationId: resumeKillSwitch
      tags: [killswitch]
      summary: Resume sensors and node starts
      description: Queued runs start again and sensors resume on their schedule. Idempotent.
      x-hal-service: admin
      responses:
        '200':
          description: New state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KillSwitch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/sensors:
    get:
      operationId: listSensors
      tags: [sensors]
      summary: List sensors with status
      description: Every sensor file under `sensors/`, including ones that fail validation, with last-poll status.
      x-hal-service: api
      responses:
        '200':
          description: All sensors, ordered by id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSensor
      tags: [sensors]
      summary: Create a sensor
      description: |
        Writes `sensors/<id>.yaml`. Send either `yaml` (raw file text) or `sensor` (JSON form). Rejected with 422 when
        validation reports errors and 409 `already-exists` when the id is taken.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SensorCreateRequest'}
      responses:
        '201':
          description: Created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/sensors/validate:
    post:
      operationId: validateSensor
      tags: [sensors]
      summary: Validate a sensor without saving
      description: Always 200 when the request itself is well formed; check `valid` and `diagnostics`.
      x-hal-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SensorValidateRequest'}
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorValidation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/sensors/{id}:
    parameters:
      - {$ref: '#/components/parameters/SensorId'}
    get:
      operationId: getSensor
      tags: [sensors]
      summary: Get a sensor
      x-hal-service: api
      responses:
        '200':
          description: Sensor with raw YAML, parsed JSON, and diagnostics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateSensor
      tags: [sensors]
      summary: Replace a sensor
      description: |
        Send `expected_hash` (the `hash` from the last read) and either `yaml` or `sensor`. 409 `conflict` when the file
        changed on disk since.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SensorUpdateRequest'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteSensor
      tags: [sensors]
      summary: Delete a sensor
      description: |
        Removes the file. Flows that subscribe to it get an `unknown_sensor` diagnostic. Stored events and runs stay
        until retention pruning.
      x-hal-service: admin
      parameters:
        - {$ref: '#/components/parameters/ExpectedHash'}
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/sensors/{id}/poll:
    parameters:
      - {$ref: '#/components/parameters/SensorId'}
    post:
      operationId: pollSensor
      tags: [sensors]
      summary: Poll now
      description: |
        Starts a poll outside the schedule and returns the new SensorRun immediately. Follow it with
        `GET /api/sensor-runs/{id}?wait=30s`. 409 `invalid-state` when a poll of this sensor is already running;
        423 `paused` while the kill switch is engaged.
      x-hal-service: admin
      x-hal-paused: reject
      responses:
        '202':
          description: Poll started.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '423': {$ref: '#/components/responses/Paused'}
        default: {$ref: '#/components/responses/Error'}
  /api/sensors/{id}/runs:
    parameters:
      - {$ref: '#/components/parameters/SensorId'}
    get:
      operationId: listSensorRuns
      tags: [sensors]
      summary: Recent polls of a sensor
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/SensorRunStatus'}
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorRunList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/sensor-runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/SensorRunId'}
    get:
      operationId: getSensorRun
      tags: [sensors]
      summary: Get a sensor run
      description: With `wait`, blocks until the run is no longer `running` or the wait elapses; the current state is returned either way.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Wait'}
      responses:
        '200':
          description: The run, including stdout and stderr.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SensorRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Timeline of events with their flow runs
      description: |
        Events newest first, each with brief entries for the flow runs it fanned out to. `flow_id`, `status`,
        `decision`, and `kind` keep events that have at least one matching run. Test runs (`kind: test`) are hidden
        unless `kind=test` is requested.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: sensor_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: status, in: query, description: Flow run status., schema: {$ref: '#/components/schemas/FlowRunStatus'}}
        - {name: decision, in: query, description: Decision of any node run in the flow run., schema: {$ref: '#/components/schemas/NodeRunDecision'}}
        - {name: kind, in: query, description: 'Flow run kind. Default is `live` and `replay`.', schema: {$ref: '#/components/schemas/FlowRunKind'}}
        - {name: q, in: query, description: Case-insensitive substring search over the payload text., schema: {type: string, minLength: 1}}
        - {$ref: '#/components/parameters/Since'}
        - {$ref: '#/components/parameters/Until'}
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: injectEvent
      tags: [events]
      summary: Inject an event for a sensor without polling
      description: |
        The body is the item JSON, any JSON value. The item goes through the sensor's `key` template, dedup, and flow
        fan-out exactly like a polled item. 201 with the new event; 200 with `deduplicated: true` when the key was seen
        before (nothing is created). Injection is accepted while paused and the resulting runs stay `queued`.
      x-hal-service: admin
      x-hal-paused: queue
      parameters:
        - {name: sensor_id, in: query, required: true, schema: {$ref: '#/components/schemas/Slug'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JsonValue'}
      responses:
        '200':
          description: Item was already seen; nothing was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InjectResult'}
        '201':
          description: Event created and fanned out.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InjectResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/events/{id}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with its fan-out tree
      description: |
        The raw payload, dedup key, originating sensor run, and for each flow the event reached the flow run with its
        node runs as a tree (child = node run fed by its parent's output), which gives each branch's decision path.
      x-hal-service: api
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/events/{id}/replay:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      operationId: replayEvent
      tags: [events]
      summary: Replay an event into a flow
      description: |
        Runs the stored event through the current version of the flow. Creates a new FlowRun with `kind: replay` and
        `replay_of` set to the most recent earlier run of that event in that flow, or to null if there was none.
        Accepted while paused; the run stays `queued`.
      x-hal-service: admin
      x-hal-paused: queue
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayRequest'}
      responses:
        '202':
          description: Replay queued.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows:
