        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: q, in: query, description: Case-insensitive substring search over title and summary., schema: {type: string, minLength: 1}}
        - name: sort
          in: query
          description: '`priority` orders by priority then time; `time` orders by time only.'
