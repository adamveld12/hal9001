  /api/auth/{service}/begin:
    parameters:
      - {$ref: '#/components/parameters/AuthService'}
    post:
      operationId: beginAuth
      tags: [auth]
      summary: Start authentication for a service
      description: |
        Evaluates the `{service}` stack (PAM semantics, REQUIREMENTS §10.4) for this request. `method` may name one
        module to use; other members of the body are module inputs (for example `{"password": "..."}`).

        - Success: 200 `status: success`; a session cookie is set and `services` lists everything the session grants.
          When the caller already has a session covering the service, the same shape is returned with
          `already_authenticated: true`.
        - A module needs more input (password prompt, passkey assertion): 200 `status: challenge` with `login_id`
          and the `step`; answer it with `/continue`.
        - Failure: 401 `authentication-failed` with `service`, `methods`, and `trace`.

        Public: reachable without a session. Every decision is recorded as an auth event.
      x-hal-service: ui
      x-hal-public: true
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthBeginRequest'}
      responses:
        '200':
          description: Authenticated, or a challenge to answer.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/{service}/continue:
    parameters:
      - {$ref: '#/components/parameters/AuthService'}
    post:
      operationId: continueAuth
      tags: [auth]
      summary: Answer an authentication challenge
      description: |
        Sends the client's `response` to the open exchange `login_id`. Same result shapes as `begin`; a further
        challenge is possible. An exchange is single-use, bound to the service, Host, and peer address that started
        it, and expires after a few minutes: 410 `login-expired`, start again with `begin`. Public.
      x-hal-service: ui
      x-hal-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthContinueRequest'}
      responses:
        '200':
          description: Authenticated, or another challenge.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/LoginExpired'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      description: 'Revokes the session behind the cookie and clears it. 200 with `revoked: false` when there was no session.'
      x-hal-service: ui
      x-hal-public: true
      security: []
      responses:
        '200':
          description: Logged out.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/whoami:
    get:
      operationId: whoami
      tags: [auth]
      summary: Who the server thinks you are
      description: |
        With a session cookie, reports that session. Otherwise evaluates each distinct stack once and reports the
        union of granted services (`source: stack`). Always 200: `authenticated: false` tells the UI to show a login.
        Public so that the UI can decide what to render.
      x-hal-service: ui
      x-hal-public: true
      security: []
      responses:
        '200':
          description: Current identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhoAmI'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: Active sessions
      description: Sessions that are not expired or revoked. Session ids are hashes, not cookie values.
      x-hal-service: admin
      responses:
        '200':
          description: Sessions and the id of the caller's own session, if any.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeAllSessions
      tags: [auth]
      summary: Revoke all sessions
      description: Revokes every session including the caller's own, and clears the cookie.
      x-hal-service: admin
      responses:
        '200':
          description: How many sessions were revoked.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one session
      x-hal-service: admin
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokeCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/events:
    get:
      operationId: listAuthEvents
      tags: [auth]
      summary: Authentication decisions
      description: Most recent decisions with each module's result, newest first.
      x-hal-service: admin
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        '200':
          description: Events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthEventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/overview:
    get:
      operationId: getAuthOverview
      tags: [auth]
      summary: How you sign in
      description: |
        One row per way in with its status: `localhost` (On this Mac: `localhost-trust`), `tailscale` (From your tailnet:
        `tailscale-identity`), `passkeys` (`webauthn`) and `password`. `state` is `on`, `off` or `attention` (the method is
        in the stacks but needs a step: sharing is off, no passkey is registered, no password is set; `detail` says which).
        `current` says how this request was admitted, which the guardrails of the write endpoints compare against.
        Never returns the password hash.
      x-hal-service: admin
      responses:
        '200':
          description: Overview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/methods:
    patch:
      operationId: updateAuthMethods
      tags: [auth]
      summary: Switch sign-in methods on or off
      description: |
        Turns `tailscale` (`tailscale-identity`), `passkeys` (`webauthn`) and `password` on or off by editing `auth.stacks`
        in `config.yaml` (comments are kept). On adds `{module, control: sufficient}` to every stack a service uses that lacks
        it; off removes the module from every stack. Turning `password` off also deletes the stored hash (it lives in the
        entry's options); turning it on needs a password to be set first (409 `invalid-state`: set one with
        `PUT /api/auth/password`, which adds the entry itself). `localhost` is not switchable: this Mac can never lock
        itself out. The edit is validated like a config load.

        Guardrails (server-enforced). Switching a method off ends the sessions that were established with it. When that
        would disable the method this request was admitted by (`current.method`), or leave a remote request with no remote
        method (`tailscale`, `passkeys`, `password`), the server answers 409 `confirmation-required` (`reasons`,
        `ends_session`) and changes nothing until the request is repeated with `confirm: true`. The change is logged as an
        auth event (`auth_methods_change`).
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthMethodsRequest'}
      responses:
        '200':
          description: Changed (or already so). The overview after the change.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthChangeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/password:
    put:
      operationId: setAuthPassword
      tags: [auth]
      summary: Set or change the password
      description: |
        Stores an argon2id hash (the `hash` option of every `password` entry in `auth.stacks`; the entry is added to the
        stacks the services use when there is none, which turns password sign-in on). The password is never stored in
        clear text and neither it nor the hash is ever returned (settings views show `«redacted»`). `password` must be at
        least 12 characters (422 otherwise). Changing an existing password needs `current_password` (422 on a wrong one).
        A change ends every other session that was established with the password (`ended_sessions`, `notice`); the
        caller's own session stays. Wrong `current_password` attempts are rate limited per client address like password
        logins (429 `rate-limited` with `Retry-After`). Logged as `auth_password_set` / `auth_password_change`.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthPasswordSetRequest'}
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthChangeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: removeAuthPassword
      tags: [auth]
      summary: Remove the password
      description: |
        Needs `current_password` (422 on a wrong one, rate limited like `PUT`). Deletes the hash and removes the `password`
        entries from the stacks (password sign-in is then off), and ends every session established with the password.
        When the caller's own session is one of them, or the caller is remote and the password is its last remote method,
        the server answers 409 `confirmation-required` until `confirm: true` is sent. Logged as `auth_password_remove`.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthPasswordRemoveRequest'}
      responses:
        '200':
          description: Removed. Idempotent when no password is set (and `current_password` is then not checked).
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthChangeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/allowed-logins:
    put:
      operationId: setAllowedLogins
      tags: [auth]
      summary: Who can sign in over the tailnet
      description: |
        Replaces `allowed_logins` in `config.yaml` (comments are kept): the Tailscale logins `tailscale-identity` accepts.
        An empty list means the login that owns this Mac only. Each login must look like `name@domain` (no spaces, commas
        or control characters, at most 254 bytes); duplicates (case-insensitive) are dropped; 422 lists every bad entry.
        When the request was admitted by `tailscale-identity` and the new list no longer admits the caller's own login,
        the server answers 409 `confirmation-required` until `confirm: true` is sent. Logged as `auth_logins_change`.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthAllowedLoginsRequest'}
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthChangeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/stacks:
    get:
      operationId: getAuthStacks
      tags: [auth]
      summary: The auth stacks and service mapping
      description: |
        `auth.stacks` and `auth.services` of the effective config (defaults filled in), for the advanced editor. Secrets
        in module options (the password hash) are `«redacted»`. `hash` is the hash of `config.yaml` to send back as
        `expected_hash`.
      x-hal-service: admin
      responses:
        '200':
          description: Stacks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStacks'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: setAuthStacks
      tags: [auth]
      summary: Replace the auth stacks and service mapping
      description: |
        Writes `auth.stacks` and `auth.services` to `config.yaml`, keeping comments and entries that did not change. A
        `«redacted»` option value keeps the stored one. The result must pass the validator that loads the config (unknown
        modules, controls, services or stacks; 422 with diagnostics) and the server's own rules:

        - On this Mac (`localhost-trust`) can never be turned off, by a local or a remote caller and with or without `confirm`:
          the new stacks must still admit a plain local request for every service, otherwise 422 with the diagnostic
          `localhost_trust_required` and nothing is written.
        - 409 `confirmation-required` (`reasons`, `ends_session`) until `confirm: true` when the change removes the method
          this request was admitted by, or leaves a remote request with no remote method in the `admin` stack.

        Sessions established with a method that no longer appears in the `admin` stack's methods are ended. 409 `conflict`
        when `expected_hash` is stale. Logged as `auth_stacks_change`.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthStacksRequest'}
      responses:
        '200':
          description: Written.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthChangeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/stacks/preview:
    post:
      operationId: previewAuthStacks
      tags: [auth]
      summary: Preview a stacks change
      description: |
        Runs everything `PUT /api/auth/stacks` would check and writes nothing. Always 200 for a well-formed body:
        `valid` and `diagnostics` carry validation and lock-out findings, `confirm_required` / `reasons` /
        `ends_session` the guardrail outcome, and `before` / `after` the `auth:` section of `config.yaml` as YAML
        (secrets redacted) for the UI to diff.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthStacksPreviewRequest'}
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthStacksPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/tailscale:
    get:
      operationId: getTailscaleStatus
      tags: [tailscale]
      summary: Tailscale sharing status
      description: |
        What hal9001 found about Tailscale on this Mac: the `tailscale` CLI (also the macOS app's and Homebrew's, looked
        up like the agent CLIs), whether you are signed in, this Mac's MagicDNS name and tailnet, whether HTTPS
        certificates are enabled for the tailnet, the `tailscale serve` mapping for the HTTPS port hal9001 would use
        (and whether it points at hal9001), the URL, whether the name is in `allowed_hosts`, the logins
        `tailscale-identity` accepts, and `warnings` with the fix for each problem. Answers are cached for a few
        seconds; `POST /api/tailscale/refresh` checks again. A missing CLI or an unreachable tailscaled is a 200 with
        `cli.found: false` or `error` set. The daemon runs only read-only commands here.
      x-hal-service: admin
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TailscaleStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/tailscale/refresh:
    post:
      operationId: refreshTailscale
      tags: [tailscale]
      summary: Check Tailscale again
      description: Forgets the cached detection and checks again (CLI, sign-in, certificates, serve status). Read-only.
      x-hal-service: admin
      responses:
        '200':
          description: Freshly detected status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TailscaleStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/tailscale/serve:
    post:
      operationId: enableTailscaleServe
      tags: [tailscale]
      summary: Share hal9001 on your tailnet
      description: |
        Runs `tailscale serve --bg --yes --https=<https_port> http://127.0.0.1:<daemon port>` (tailnet only; `tailscale
        funnel` is never used), then adds this Mac's MagicDNS name (`<name>`, or `<name>:<port>` when the port is not
        443) to `allowed_hosts` in `config.yaml` unless it is already there, and sets `tailscale.serve: true` and
        `tailscale.https_port`. The edit keeps the comments of the file; entries you added are never touched. Nothing is
        run when the mapping already points at hal9001 (only the config is brought in line). The daemon re-applies the
        mapping at start while `tailscale.serve` is true.

        409 `already-exists` (`target`, `https_port`): the HTTPS port already serves something else; send `replace: true`
        to overwrite it. 409 `invalid-state`: Tailscale is not ready (CLI missing, signed out, stopped, HTTPS
        certificates disabled); the `warnings` extension lists the fixes. 409 `invalid-state` with `funnel_on_port:
        true` (and `https_port`): `tailscale funnel` exposes the HTTPS port to the public internet, which hal9001 never
        does; nothing is run or written, with or without `replace` and even when the mapping already points at
        hal9001. Turn funnel off (`tailscale funnel --https=<port> off`) or pick another port. 503 `unavailable`: the command failed
        (`detail` has its output).
      x-hal-service: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TailscaleServeRequest'}
      responses:
        '200':
          description: Shared. The status after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TailscaleStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: disableTailscaleServe
      tags: [tailscale]
      summary: Stop sharing hal9001 on your tailnet
      description: |
        Sets `tailscale.serve: false` and runs `tailscale serve --https=<https_port> off`, but only when the mapping on
        that port points at hal9001; a mapping to anything else is left alone. The MagicDNS name is removed from
        `allowed_hosts` only when hal9001 added it (it keeps a record in `<home>/data/tailscale.json`); entries you
        wrote are kept. Idempotent.
      x-hal-service: admin
      responses:
        '200':
          description: Not shared. The status after the change.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TailscaleStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/webauthn/credentials:
    get:
      operationId: listPasskeys
      tags: [auth]
      summary: Registered passkeys
      description: Credentials are stored per relying-party ID, so `localhost` and each Tailscale hostname list separately.
      x-hal-service: admin
      responses:
        '200':
          description: Passkeys.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/webauthn/credentials/{id}:
    parameters:
      - {$ref: '#/components/parameters/PasskeyId'}
    delete:
      operationId: deletePasskey
      tags: [auth]
      summary: Remove a passkey
      x-hal-service: admin
      responses:
        '204': {description: Removed.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/webauthn/register/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [auth]
      summary: Start passkey registration
      description: |
        Allowed for any caller the `admin` service admits, through a session or the stack itself (e.g. `localhost-trust`).
        Begin and finish must come from the same caller. The relying-party ID is the request's Host name without port, which must be
        `localhost` or an entry of `allowed_hosts`. Pass `options` to `navigator.credentials.create`.
      x-hal-service: admin
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyRegisterBeginRequest'}
      responses:
        '200':
          description: Creation options.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasskeyRegisterBegin'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/auth/webauthn/register/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [auth]
      summary: Finish passkey registration
      description: |
        Sends the `PublicKeyCredential` returned by the browser. Same session requirement as `begin`. 410
        `login-expired` when the registration expired or is unknown; 400 when attestation verification fails.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasskeyRegisterFinishRequest'}
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Passkey'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '410': {$ref: '#/components/responses/LoginExpired'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hal9001_session
      description: |
        Server-side session cookie (`HttpOnly`, `SameSite=Strict`, `Secure` over HTTPS) obtained from
        `POST /api/auth/{service}/begin`. The top-level `security: [{}, {sessionCookie: []}]` means a request may also
        be authenticated without a cookie, for example by the `localhost-trust` or `tailscale-identity` module.
  headers:
    Location:
      description: Absolute path of the created or started resource.
      schema: {type: string}
    SetSessionCookie:
      description: Sets or clears the `hal9001_session` cookie.
      schema: {type: string}
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `next_cursor`.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Since:
      name: since
      in: query
      description: Only records created at or after this time.
      schema: {type: string, format: date-time}
    Until:
      name: until
      in: query
      description: Only records created before this time.
      schema: {type: string, format: date-time}
    Wait:
      name: wait
      in: query
      description: |
        Long-poll duration such as `30s` or `2m`. Capped at 5 minutes; omit or `0s` to return immediately. Reaching
        the cap is not an error: the current state is returned with 200.
      schema: {$ref: '#/components/schemas/Duration'}
    ExpectedHash:
      name: expected_hash
      in: query
      required: true
      description: Hash from the last read of the file. 409 `conflict` when the file differs.
      schema: {$ref: '#/components/schemas/Hash'}
    HashPath:
      name: hash
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Hash'}
    SensorId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Slug'}
    ToolId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Slug'}
    FlowId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Slug'}
    PromptName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Slug'}
    RuntimeName:
      name: name
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Slug'}
    SensorRunId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    EventId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    FlowRunId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    NodeRunId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    AgentRunId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    ApprovalId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    InboxId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    AssistSessionId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ulid'}
    ConversationId:
      name: id
      in: path
      required: true
      description: 'An assist session id or an agent run id of a flow node.'
      schema: {$ref: '#/components/schemas/Ulid'}
    ConversationSince:
      name: since
      in: query
      description: Only conversations with activity at or after this time.
      schema: {type: string, format: date-time}
    ConversationUntil:
      name: until
      in: query
      description: Only conversations with activity before this time.
      schema: {type: string, format: date-time}
    SessionId:
      name: id
      in: path
      required: true
      description: Session handle from `Session.id`.
      schema: {type: string}
    PasskeyId:
      name: id
      in: path
      required: true
      description: Credential id from `Passkey.id` (base64url).
      schema: {type: string}
    AuthService:
      name: service
      in: path
      required: true
      schema: {$ref: '#/components/schemas/AuthService'}
    SandboxBackend:
      name: backend
      in: path
      required: true
      schema: {$ref: '#/components/schemas/SandboxBackendName'}
    EnvKey:
      name: key
      in: path
      required: true
      schema: {$ref: '#/components/schemas/EnvKeyName'}
  responses:
    Error:
      description: Any other error, including 5xx. The `type` URI says which class.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: Malformed JSON, unknown field, or an invalid query or path parameter.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/BadRequestProblem'}
    Unauthorized:
      description: |
        `unauthenticated`: no principal could be established for the service. `authentication-failed`: a login attempt
        failed. The body carries the service and the login `methods` available for it.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/UnauthorizedProblem'}
    Forbidden:
      description: |
        The baseline rejected the request (`host-not-allowed`, `origin-not-allowed`), the request came through
        `tailscale funnel` (a `Tailscale-Funnel-Request` header: always `forbidden`, on every path), or the session does
        not grant the service (`forbidden`).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ForbiddenProblem'}
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/NotFoundProblem'}
    Conflict:
      description: |
        The write conflicts with the current state: `conflict` (hash mismatch; carries `current_hash`),
        `already-exists`, or `invalid-state` (for example approving an approval that is no longer pending).
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ConflictProblem'}
    PayloadTooLarge:
      description: Request body exceeds the size limit.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/PayloadTooLargeProblem'}
    UnsupportedMediaType:
      description: 'Mutating requests must send `Content-Type: application/json`.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/UnsupportedMediaTypeProblem'}
    ValidationFailed:
      description: The request was well formed but its content is invalid. `diagnostics` lists every problem found.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ValidationProblem'}
    TooManyRequests:
      description: Too many failed attempts from this client address; wait `retry_after` seconds (`Retry-After` header).
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/TooManyRequestsProblem'}
    Paused:
      description: The kill switch is engaged and this operation would start work.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/PausedProblem'}
    LoginExpired:
      description: The login exchange or passkey registration expired or is unknown. Start again with `begin`.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/LoginExpiredProblem'}
  schemas:
    # ---------------------------------------------------------------- primitives
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
      description: ULID.
      examples: ['01JC7Z3K9Q8V5T2M4N6P8R0S1T']
    NullableUlid:
      type: [string, 'null']
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    Slug:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$'
      description: Identifier used as a file name (sensor, flow, prompt, runtime) or a node id.
      examples: [github-notifications]
    Hash:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Lowercase hex SHA-256 of the raw file (or blob) bytes.
    NullableHash:
      type: [string, 'null']
      pattern: '^[0-9a-f]{64}$'
    Duration:
      type: string
      pattern: '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h|d))+$'
      description: Duration string. `d` means 24 hours.
      examples: [60s, 20m, 1h, 7d]
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 with nanoseconds, UTC.
    NullableTimestamp:
      type: [string, 'null']
      format: date-time
    NextCursor:
      type: [string, 'null']
      description: Pass as `cursor` to get the next page; null on the last page.
    JsonValue:
      description: Any JSON value, including null.
      anyOf: [{}, {type: 'null'}]
    EnvKeyName:
      type: string
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
      maxLength: 128
    TextBlob:
      type: object
      description: |
        Captured text (stdin, stdout, stderr). `text` holds up to 64 KiB inline in detail responses and up to 4 KiB in
        list responses, event detail, and stream events (`truncated` is then true). When the full content is larger
        than 64 KiB, `blob` is its hash for `GET /api/blobs/{hash}`.
      required: [text, size, truncated, blob]
      properties:
        text: {type: string}
        size: {type: integer, minimum: 0, description: Full size in bytes.}
        truncated: {type: boolean}
        blob: {$ref: '#/components/schemas/NullableHash'}
    # ---------------------------------------------------------------- enums
    FlowRunStatus: {type: string, enum: [queued, running, awaiting_approval, succeeded, failed, killed, interrupted, cancelled]}
    FlowRunKind:
      type: string
      enum: [live, replay, test, continuation]
      description: >-
        `continuation` is a run started by an approved emit of a chat that continues an agent run. It reuses the
        original run's upstream results and runs only what follows the emitting agent node; see `FlowRun.continuation`.
    NodeRunStatus: {type: string, enum: [queued, running, awaiting_approval, done, failed, killed, interrupted, skipped, cancelled]}
    NodeRunDecision: {type: string, enum: [emitted, dropped, error, skipped]}
    NodeType: {type: string, enum: [command, agent, inbox, approval]}
    AgentRunStatus: {type: string, enum: [queued, running, awaiting_approval, succeeded, failed, denied, killed, interrupted, timeout]}
    AgentRunPhase: {type: string, enum: [propose, execute]}
    ResumedVia: {type: string, enum: [load, new_session]}
    AgentMode: {type: string, enum: [auto, approve, readonly]}
    ApproveStyle: {type: string, enum: [proposal, per_tool]}
    PermissionPolicy: {type: string, enum: [readonly, gated, auto]}
    ApprovalType: {type: string, enum: [proposal, tool_call, request]}
    ApprovalStatus: {type: string, enum: [pending, approved, denied, expired]}
    PermissionDecision: {type: string, enum: [allow, reject, cancelled, expired]}
    DecidedBy: {type: string, enum: [policy, user, timeout]}
    Priority: {type: string, enum: [low, normal, high, urgent]}
    AuthService: {type: string, enum: [ui, api, approve, admin]}
    ModuleResultCode: {type: string, enum: [success, fail, ignore, challenge]}
    ModuleControl: {type: string, enum: [required, requisite, sufficient, optional]}
    AuthOutcome: {type: string, enum: [success, fail, challenge]}
    SensorRunStatus: {type: string, enum: [running, succeeded, failed, timeout, killed, interrupted]}
    Lang: {type: string, enum: [bash, python, node, jq, exec]}
    FirstRun: {type: string, enum: [baseline, fire]}
    Severity: {type: string, enum: [error, warning, info]}
    # ---------------------------------------------------------------- problems (RFC 9457)
    ProblemType:
      type: string
      description: |
        Stable error class. The URIs are identifiers, not links. HTTP status per class: bad-request 400,
        unauthenticated 401, authentication-failed 401, forbidden 403, host-not-allowed 403,
        origin-not-allowed 403, not-found 404, conflict/already-exists/invalid-state 409, login-expired 410,
        payload-too-large 413, unsupported-media-type 415, validation-failed 422, paused 423, internal 500,
        unavailable 503; confirmation-required 409 (an auth change that needs `confirm: true`), rate-limited 429.
      enum:
        - 'urn:hal9001:problem:bad-request'
        - 'urn:hal9001:problem:unauthenticated'
        - 'urn:hal9001:problem:authentication-failed'
        - 'urn:hal9001:problem:forbidden'
        - 'urn:hal9001:problem:host-not-allowed'
        - 'urn:hal9001:problem:origin-not-allowed'
        - 'urn:hal9001:problem:not-found'
        - 'urn:hal9001:problem:conflict'
        - 'urn:hal9001:problem:already-exists'
        - 'urn:hal9001:problem:invalid-state'
        - 'urn:hal9001:problem:login-expired'
        - 'urn:hal9001:problem:payload-too-large'
        - 'urn:hal9001:problem:unsupported-media-type'
        - 'urn:hal9001:problem:validation-failed'
        - 'urn:hal9001:problem:paused'
        - 'urn:hal9001:problem:internal'
        - 'urn:hal9001:problem:unavailable'
        - 'urn:hal9001:problem:confirmation-required'
        - 'urn:hal9001:problem:rate-limited'
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {$ref: '#/components/schemas/ProblemType'}
        title: {type: string, description: Short summary of the class.}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, description: Human-readable explanation of this occurrence.}
    BadRequestProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:bad-request']}
            status: {enum: [400]}
    UnauthorizedProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          required: [service, methods]
          properties:
            type:
              description: '`unauthenticated`: the service needs a session or a stack decision and none succeeded. `authentication-failed`: a login attempt through `begin`/`continue` failed.'
              enum:
                - 'urn:hal9001:problem:unauthenticated'
                - 'urn:hal9001:problem:authentication-failed'
            status: {enum: [401]}
            service: {$ref: '#/components/schemas/AuthService'}
            methods:
              type: array
              description: Interactive modules of the service's stack that a client can log in with, in stack order. An empty list means only per-request modules apply.
              items: {type: string, examples: [password]}
            trace:
              type: array
              description: Per-module results of a failed login attempt (`authentication-failed` only).
              items: {$ref: '#/components/schemas/PublicModuleTrace'}
            next_step:
              type: object
              description: The call that starts a login for `service`.
              required: [method, href]
              properties:
                method: {type: string, enum: [POST]}
                href: {type: string, examples: [/api/auth/api/begin]}
    ForbiddenProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type:
              description: '`host-not-allowed` (DNS-rebinding check), `origin-not-allowed` (CSRF check), `forbidden` (the session does not grant the service).'
              enum:
                - 'urn:hal9001:problem:forbidden'
                - 'urn:hal9001:problem:host-not-allowed'
                - 'urn:hal9001:problem:origin-not-allowed'
            status: {enum: [403]}
            service: {$ref: '#/components/schemas/AuthService'}
            methods: {type: array, items: {type: string}}
    NotFoundProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:not-found']}
            status: {enum: [404]}
    ConflictProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type:
              description: '`conflict`: `expected_hash` does not match the file. `already-exists`: create of an existing id. `invalid-state`: the resource is not in a state that allows the operation. `confirmation-required`: an auth change that would end this session or leave it without a way in; repeat it with `confirm: true` (see `reasons`).'
              enum:
                - 'urn:hal9001:problem:conflict'
                - 'urn:hal9001:problem:already-exists'
                - 'urn:hal9001:problem:invalid-state'
                - 'urn:hal9001:problem:confirmation-required'
            status: {enum: [409]}
            expected_hash: {type: string, description: The hash the client sent.}
            current_hash: {$ref: '#/components/schemas/NullableHash'}
            current_state: {type: string, description: 'For `invalid-state`: the state that blocks the operation, such as `approved` or `running`.'}
            release_url: {type: string, description: 'For an install refused by `POST /api/update/install`: where to download the build by hand.'}
            reasons: {type: array, items: {type: string}, description: 'For `confirmation-required`: what the change does to this session, one sentence each.'}
            ends_session: {type: boolean, description: 'For `confirmation-required`: confirming ends the caller''s own session.'}
    TooManyRequestsProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:rate-limited']}
            status: {enum: [429]}
            retry_after: {type: integer, minimum: 1, description: Seconds until the client may try again (also the `Retry-After` header).}
    LoginExpiredProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:login-expired']}
            status: {enum: [410]}
    PayloadTooLargeProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:payload-too-large']}
            status: {enum: [413]}
    UnsupportedMediaTypeProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:unsupported-media-type']}
            status: {enum: [415]}
    ValidationProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          required: [diagnostics]
          properties:
            type: {enum: ['urn:hal9001:problem:validation-failed']}
            status: {enum: [422]}
            diagnostics:
              type: array
              items: {$ref: '#/components/schemas/Diagnostic'}
    PausedProblem:
      allOf:
        - {$ref: '#/components/schemas/Problem'}
        - type: object
          properties:
            type: {enum: ['urn:hal9001:problem:paused']}
            status: {enum: [423]}
            paused_since: {$ref: '#/components/schemas/NullableTimestamp'}
    Diagnostic:
      type: object
      description: One validation finding for a sensor, flow, prompt, or config file (`internal/spec`).
      required: [severity, code, message]
      properties:
        severity: {$ref: '#/components/schemas/Severity'}
        code:
          type: string
          description: |
            Stable snake_case code, for example `cycle`, `unknown_node`, `undeclared_port`, `unreachable`,
            `duplicate_id`, `unknown_sensor`, `unknown_prompt`, `unknown_runtime`, `invalid_enum`, `invalid_regex`,
            `invalid_template`, `invalid_schedule`, `invalid_duration`, `required`, `field_not_allowed`,
            `unknown_field`, `yaml_syntax`, `yaml_type`, `id_mismatch`.
        message: {type: string}
        file: {type: string, description: 'Path relative to the home dir, for example `flows/triage-github.yaml`.'}
        path: {type: string, description: 'Location in the document, for example `nodes[2].script`.'}
        node_id: {type: string, description: 'Flow node the finding belongs to, when it has one.'}
        line: {type: integer, minimum: 1, description: '1-based YAML line, when known.'}
    # ---------------------------------------------------------------- spec formats (REQUIREMENTS §5-§7, internal/spec)
    RenameRequest:
      type: object
      additionalProperties: false
      required: [new_id, expected_hash]
      properties:
        new_id: {$ref: '#/components/schemas/Slug'}
        expected_hash: {$ref: '#/components/schemas/Hash'}
    Sensor:
      type: object
      description: |
        Sensor definition (§5). `id` is the file name: it is returned by the API but never written to the file (an old
        `id:` line is ignored on read). At most one of `interval` and `cron`; with neither the sensor is manual-only: the
        scheduler never polls it and only "Run now" does. `exec` takes `command`; every other `lang` takes `script`.
      additionalProperties: false
      required: [lang]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        description: {type: string, description: 'Free text shown under the name; optional.'}
        interval: {$ref: '#/components/schemas/Duration'}
        cron: {type: string, examples: ['*/5 9-18 * * 1-5']}
        lang: {$ref: '#/components/schemas/Lang'}
        script: {type: string}
        command: {type: array, items: {type: string}, description: 'argv for `lang: exec`.'}
        cwd: {type: string, description: Working directory; default is the sensor's state dir.}
        key: {type: string, description: Go text/template over the item that produces the dedup key.}
        first_run: {$ref: '#/components/schemas/FirstRun'}
        timeout: {$ref: '#/components/schemas/Duration'}
    Cwd:
      type: object
      description: |
        Working directory of a node (§7.5). `mode: dir` uses `path`; `mode: worktree` uses `repo` and `ref`. All
        string fields are templates. In YAML a bare string means `{mode: dir, path}`. Command nodes and sensors accept
        `dir` only.
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [dir, worktree]}
        path: {type: string}
        repo: {type: string}
        ref: {type: string}
    NodeUI:
      type: object
      description: Canvas position.
      additionalProperties: false
      required: [x, y]
      properties:
        x: {type: number}
        y: {type: number}
    NoteLink:
      type: object
      additionalProperties: false
      required: [label, url]
      properties:
        label: {type: string}
        url: {type: string}
    RequiresApproval:
      type: boolean
      default: false
      description: |
        Any node but `approval`. When the node is reached (its input is ready, before it runs) hal raises an approval of
        type `request` (`request.gate` true; title `<flow>: run <node id>?`, with the node's resolved configuration and its
        input) and parks the node as `awaiting_approval` (no concurrency slot; it survives daemon restarts). Approving runs
        the node as usual. Denying, or `approval_timeout` passing, skips the node and emits the input on the extra port
        `denied`: `{"input": <node input>, "approval": {decision: denied|timeout, comment, decided_by, decided_at, approval_id}}`.
        With no edge on `denied` the branch stops and the node run is recorded as done on port `denied` (error `denied`
        or `approval_timeout`), not failed. A dry run still asks, tagged `dry_run`. Test runs (`test-node`, the assist flow
        test) do not wait: they take the decision from `simulate_approval`.
    GateApprovalTimeout:
      allOf: [{$ref: '#/components/schemas/Duration'}]
      description: 'How long the `requires_approval` approval waits before it expires and counts as denied (decision `timeout`). Only valid with `requires_approval`; without it the approval waits until decided.'
    AgentAllow:
      type: object
      description: Tools of the node's `mcp_servers` the agent may call (hal's own tools are always allowed). Entries are regular expressions over the tool title or name. Agents have no shell or file tools.
      additionalProperties: false
      properties:
        tools: {type: array, items: {type: string}, description: Regexes over tool title or name.}
    McpServer:
      type: object
      description: MCP server passed through to `session/new`.
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        type: {type: string, enum: [stdio, http, sse]}
        command: {type: string}
        args: {type: array, items: {type: string}}
        env: {type: object, additionalProperties: {type: string}}
        url: {type: string}
        headers: {type: object, additionalProperties: {type: string}}
    CommandNode:
      type: object
      description: Runs a process (§4). Implicit port `error`; declared `ports` default to `[out]`.
      additionalProperties: false
      required: [id, type, lang]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        type: {type: string, enum: [command]}
        lang: {$ref: '#/components/schemas/Lang'}
        script: {type: string}
        command: {type: array, items: {type: string}}
        ports: {type: array, items: {type: string}}
        cwd: {$ref: '#/components/schemas/Cwd'}
        timeout: {$ref: '#/components/schemas/Duration'}
        side_effect: {type: boolean, description: 'Skipped in dry-run, recorded as decision `skipped` with reason `dry_run`.'}
        requires_approval: {$ref: '#/components/schemas/RequiresApproval'}
        approval_timeout: {$ref: '#/components/schemas/GateApprovalTimeout'}
        ui: {$ref: '#/components/schemas/NodeUI'}
    McpToolList:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, description, input_schema]
            properties:
              name: {type: string}
              description: {type: string}
              input_schema: {type: object, additionalProperties: true, description: JSON Schema of the arguments.}
    McpCallRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        arguments: {type: object, additionalProperties: true}
    McpCallResult:
      type: object
      additionalProperties: false
      required: [text, is_error]
      properties:
        text: {type: string, description: 'The tool output, or the error message when `is_error` is true.'}
        is_error: {type: boolean}
    McpInfo:
      type: object
      description: Everything a client needs to connect to hal's MCP server, built from the running daemon.
      additionalProperties: false
      required: [server_name, http_url, base_url, stdio, cli_link, auth, approval_timeout_seconds, tools]
      properties:
        server_name: {type: string, description: 'Name to give the server in the client (`hal9001`).'}
        http_url: {type: string, description: 'Streamable HTTP endpoint on this daemon, on localhost and the daemon''s actual port.'}
        base_url: {type: string, description: 'The daemon''s address; the `--url` of the stdio command.'}
        stdio:
          type: object
          additionalProperties: false
          required: [command, args]
          properties:
            command: {type: string, description: 'Absolute path of the running hal9001 binary.'}
            args: {type: array, items: {type: string}, description: 'Arguments for `command`: `mcp --url <base_url>`.'}
        cli_link: {type: string, description: 'Where the app''s "Install command-line tool" links the binary (`~/.local/bin/hal9001`), a stable alternative to `stdio.command` that follows app updates.'}
        auth:
          type: object
          additionalProperties: false
          required: [localhost_trust, cookie_name]
          properties:
            localhost_trust:
              type: object
              additionalProperties: false
              required: [api, admin]
              description: 'Whether the stack of the service admits a request from this Mac with no credentials (it lists `localhost-trust`). `api` covers the read tools, `admin` the tools with side effects.'
              properties:
                api: {type: boolean}
                admin: {type: boolean}
            cookie_name: {type: string, description: 'Session cookie to send in a `Cookie` header when a stack asks for a login (see docs/auth.md).'}
        approval_timeout_seconds: {type: integer, description: 'How long a tool call that needs approval waits for the user before it fails.'}
        tools:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, description, needs_approval, needs_admin]
            properties:
              name: {type: string}
              description: {type: string}
              needs_approval: {type: boolean, description: 'A call waits for the user to approve it in the Inbox.'}
              needs_admin: {type: boolean, description: 'The tool changes state: the MCP request must also be admitted for the `admin` auth service, checked before anybody is asked.'}
    AgentPort:
      type: object
      additionalProperties: false
      properties:
        description: {type: string, description: 'Shown to the agent as the description of the `emit_<port>` tool.'}
        schema:
          type: object
          additionalProperties: true
          description: 'JSON Schema (draft 2020-12 unless `$schema` says otherwise) of the tool arguments; the top level must have `type: object`; only local `$ref`s ("#/$defs/x") are allowed. Omitted: the inbox note schema, only when every edge from the port goes directly to an `inbox` node.'
    AgentNode:
      type: object
      description: |
        Runs a coding agent over ACP (§7). Ports: `out`, `error`, and `denied` when `mode` is `approve` or `requires_approval` is set;
        with `ports` declared, those declared ports replace `out`.
        A `denied` payload says which approval refused it: a proposal denial carries `agent` (with the `proposal` and `comment`),
        a `requires_approval` denial carries `approval` and the agent did not start.
        `approve` applies to approve mode only (default `proposal`). `approval_timeout` falls back to the config value.
        Exactly one of `prompt` (a library prompt name) or `instructions` (inline prompt template) is required.
        `output` (`note` default, or `none`) applies to inline `instructions` only. With `note` the agent ends its
        final message with the inbox note JSON; hal also gives it the `submit_output` tool (note schema) and uses a valid
        call instead of parsing the text.
        `ports` declares output ports (names `[a-z0-9_]+`, not `out`, `error`, `denied`): hal gives the agent run one
        `emit_<port>` tool per declared port that has an outgoing edge, validated against the port's `schema`. The
        agent must finish by calling one; the validated arguments reach downstream nodes as `agent.output` together with
        `agent.port`. A run that ends without a valid call after one reminder fails with class `no_output` (error
        port). `ports` cannot be combined with an explicit `output`. A port without `schema` is only valid when every
        edge from it goes directly to an `inbox` node (the inbox note schema is used).
      additionalProperties: false
      required: [id, type, runtime, mode]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        type: {type: string, enum: [agent]}
        runtime: {$ref: '#/components/schemas/Slug'}
        mode: {$ref: '#/components/schemas/AgentMode'}
        approve: {$ref: '#/components/schemas/ApproveStyle'}
        prompt: {$ref: '#/components/schemas/Slug'}
        instructions: {type: string}
        output: {type: string, enum: [note, none]}
        ports:
          type: object
          description: 'Output ports in declaration order. Each becomes the tool `emit_<port>` of the agent run when the port has an outgoing edge.'
          additionalProperties: {$ref: '#/components/schemas/AgentPort'}
        emit: {type: string, enum: [one, many], default: one, description: 'With `ports`: `one` (the last valid call is the single emission) or `many` (every valid call is an emission and downstream runs once per emission).'}
        extra_prompt: {type: string}
        model: {type: string}
        cwd: {$ref: '#/components/schemas/Cwd'}
        timeout: {$ref: '#/components/schemas/Duration'}
        approval_timeout: {$ref: '#/components/schemas/Duration', description: 'How long the agent''s own approvals (per-tool calls, proposals) wait, falling back to the config value; with `requires_approval` it also bounds the gate''s wait, which has no timeout when this is unset.'}
        requires_approval: {$ref: '#/components/schemas/RequiresApproval'}
        allow: {$ref: '#/components/schemas/AgentAllow'}
        mcp_servers: {type: array, items: {$ref: '#/components/schemas/McpServer'}}
        sandbox: {type: string, description: 'Sandbox backend id; adds fs and shell tools executed there. Validated where sandboxes are defined.'}
        image: {type: string, description: 'Sandbox image (sandbox option).'}
        repo: {type: string, description: 'Repository to check out in the sandbox (sandbox option).'}
        ref: {type: string, description: 'Git ref of `repo` (sandbox option).'}
        tools: {type: array, items: {$ref: '#/components/schemas/NodeToolRef'}, description: 'Custom tools made available to the agent through hal MCP.'}
        ui: {$ref: '#/components/schemas/NodeUI'}
    InboxNode:
      type: object
      description: |
        Writes an inbox item. Fields are Go templates over `{.event, .input, .flow, .run}`. Port `out` only.
        `priority` is a priority name or a template that must render to one at run time (otherwise the node fails with
        error class `template`). `title` is required, except on an inbox node fed only by agent ports without a schema
        (the inbox shortcut): a missing `title` or `summary_md` is then taken from the agent's emission
        (`agent.output.title`, `agent.output.summary_md`); templates set here override it.
      additionalProperties: false
      required: [id, type]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        type: {type: string, enum: [inbox]}
        title: {type: string}
        priority: {type: string, description: 'One of `low`, `normal`, `high`, `urgent`, or a template that renders to one. Default `normal`.'}
        summary_md: {type: string}
        suggested_reply: {type: string}
        links: {type: array, items: {$ref: '#/components/schemas/NoteLink'}}
        requires_approval: {$ref: '#/components/schemas/RequiresApproval'}
        approval_timeout: {$ref: '#/components/schemas/GateApprovalTimeout'}
        ui: {$ref: '#/components/schemas/NodeUI'}
    ApprovalNode:
      type: object
      description: |
        "Request approval": asks the user to approve or deny and parks the node as `awaiting_approval` (no concurrency
        slot; it survives daemon restarts) until someone decides in the Inbox or the approval times out. Creates an
        approval of type `request`. `title`, `description` and `body` are Go templates over `{.event, .input, .flow, .run}`.
        Ports: `approved`, `denied` and the implicit `error`. On `approved` and `denied` (and a timed-out approval
        routed by `on_timeout`) the payload is `{"input": <node input>, "approval": {decision: approved|denied|timeout,
        comment, decided_by, decided_at, edited, edits?}}`. With `editable`, the approver may change those input paths when
        approving; the payload's `input` carries the edited values and `approval.edits` is `{path: {before, after}}`.
        In a dry run the approval is still created, tagged `dry_run`, and says so. (Every other node type can ask for
        approval before it runs with `requires_approval`; this node cannot.)
        Test runs (`test-node`, the assist flow test) do not wait: they take the decision from `simulate_approval`.
      additionalProperties: false
      required: [id, type, title]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        type: {type: string, enum: [approval]}
        title: {type: string, description: Template. Required.}
        description: {type: string, description: 'Template. Required by validation (an empty one is an error diagnostic, so the file still parses and opens in the visual editor): one or two sentences saying what the approver is asked and why. Shown on the approval card.'}
        body: {type: string, description: Markdown template shown in the approval.}
        fields: {type: array, items: {type: string}, description: 'Dot-paths into the node input, shown as a key/value table.'}
        editable: {type: array, items: {type: string}, description: 'Dot-paths into the node input the approver may edit before approving (strings or JSON values).'}
        priority: {$ref: '#/components/schemas/Priority'}
        timeout: {$ref: '#/components/schemas/Duration'}
        on_timeout: {type: string, enum: [denied, approved, error], default: denied, description: 'What an expired approval does: route to `denied`, to `approved`, or fail the node (the `error` port). Only valid with `timeout`.'}
        ui: {$ref: '#/components/schemas/NodeUI'}
    TransformCondition:
      type: object
      description: |
        Tests one field of the item. `field` is a dot path (`author.login`); `[]` in a path means "any element"
        (`labels[].name`); `.` is the item itself. Operators `not_*`, `is_not_empty` are the exact opposite of their
        positive form, so with `[]` they mean "no element ...". Text operators ignore case unless `case_sensitive`.
        `value` is required by `equals`, `not_equals`, `contains`, `not_contains`, `starts_with`, `ends_with`,
        `matches` (a regular expression), `gt`, `gte`, `lt`, `lte` and `in` (a list), and not allowed by the others.
      additionalProperties: false
      required: [field, op]
      properties:
        field: {type: string}
        op: {$ref: '#/components/schemas/TransformOperator'}
        value: {$ref: '#/components/schemas/JsonValue'}
        case_sensitive: {type: boolean, default: false}
    TransformOperator:
      type: string
      enum: [equals, not_equals, contains, not_contains, starts_with, ends_with, matches, gt, gte, lt, lte, exists, not_exists, is_empty, is_not_empty, is_true, is_false, in]
    TransformRule:
      type: object
      description: One branch of a route step; items matching the conditions are sent to `port`.
      additionalProperties: false
      required: [port]
      properties:
        port: {type: string}
        match: {$ref: '#/components/schemas/TransformMatch'}
        conditions: {type: array, items: {$ref: '#/components/schemas/TransformCondition'}}
    TransformMatch:
      type: string
      enum: [all, any]
      default: all
    TransformValue:
      type: object
      description: |
        What a `set` step writes. `constant` uses `value`; `field` copies `field`; `template` uses `template` (text with
        `{field.path}` placeholders; `{{` and `}}` are literal braces); `function` applies `function` to `field`
        (`join` and `split` take their separator in `arg`, `default` its fallback value).
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, enum: [constant, field, template, function]}
        value: {$ref: '#/components/schemas/JsonValue'}
        field: {type: string}
        template: {type: string}
        function: {type: string, enum: [lowercase, uppercase, trim, length, join, first, last, split, to_number, to_string, default]}
        arg: {$ref: '#/components/schemas/JsonValue'}
    TransformStep:
      type: object
      description: |
        One plain-language step. `type` selects the fields that apply; validation rejects the others.
        `filter`: `match`, `conditions`, `keep` (default true; false drops what matches).
        `route`: `rules`, `default_port` (where unmatched items go; default `out`); must be the last step.
        `pick`: `fields`, `rename` (path to new top-level name), `flatten` (nested fields become `a_b` keys).
        `set`: `field`, `value`. `remove`: `fields`.
        `split`: `field` (an array), `as`, `keep_parent`; emits one item per element.
        `sort`: `field`, `by`, `order`. `limit`: `field`, `count`. `unique`: `field`, `by`.
        `aggregate`: `field`, `into`, `op`, `of`, `group_by`. `filter_list`: `field`, `match`, `conditions`, `keep`;
        conditions are relative to each element.
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [filter, route, pick, set, remove, split, sort, limit, unique, aggregate, filter_list]}
        match: {$ref: '#/components/schemas/TransformMatch'}
        conditions: {type: array, items: {$ref: '#/components/schemas/TransformCondition'}}
        keep: {type: boolean, default: true}
        rules: {type: array, items: {$ref: '#/components/schemas/TransformRule'}}
        default_port: {type: string}
        fields: {type: array, items: {type: string}}
        rename: {type: object, additionalProperties: {type: string}}
        flatten: {type: boolean}
        field: {type: string}
        value: {$ref: '#/components/schemas/TransformValue'}
        as: {type: string}
        keep_parent: {type: boolean}
        by: {type: string}
        order: {type: string, enum: [asc, desc], default: asc}
        count: {type: integer, minimum: 0}
        into: {type: string}
        op: {type: string, enum: [count, sum, avg, min, max, collect, group_count]}
        of: {type: string}
        group_by: {type: string}
    TransformNode:
      type: object
      description: |
        Reshapes the item with a list of plain-language steps (compiled to jq and run like a jq command node).
        Ports: `out`, every port named by a route step (rules and `default_port`), and the implicit `error`.
      additionalProperties: false
      required: [id, type]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        type: {type: string, enum: [transform]}
        steps: {type: array, items: {$ref: '#/components/schemas/TransformStep'}}
        timeout: {$ref: '#/components/schemas/Duration'}
        requires_approval: {$ref: '#/components/schemas/RequiresApproval'}
        approval_timeout: {$ref: '#/components/schemas/GateApprovalTimeout'}
        ui: {$ref: '#/components/schemas/NodeUI'}
    TransformPreviewRequest:
      type: object
      additionalProperties: false
      required: [steps, input]
      properties:
        steps: {type: array, items: {$ref: '#/components/schemas/TransformStep'}}
        input: {$ref: '#/components/schemas/JsonValue'}
    TransformCompileRequest:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        steps: {type: array, items: {$ref: '#/components/schemas/TransformStep'}}
    TransformCompiled:
      type: object
      required: [jq, description]
      properties:
        jq: {type: string, description: 'The jq program, with one `# step N:` comment per step.'}
        description: {type: array, items: {type: string}, description: One plain-language sentence per step.}
    TransformOutput:
      type: object
      required: [port, payload]
      properties:
        port: {type: string}
        payload: {$ref: '#/components/schemas/JsonValue'}
    TransformStepResult:
      type: object
      required: [step, description, outputs_count, dropped, error]
      properties:
        step: {type: integer, minimum: 0, description: Index into `steps`.}
        description: {type: string}
        outputs_count: {type: integer, minimum: 0, description: Items leaving this step when the steps up to and including it run on the input.}
        dropped: {type: boolean, description: True for the step after which nothing is left.}
        error: {type: [string, 'null'], description: The jq error when this step failed.}
    TransformPreview:
      type: object
      required: [jq, description, decision, outputs, reason, error, step_results, diagnostics]
      properties:
        jq: {type: string, description: The compiled program (empty when the steps are invalid).}
        description: {type: array, items: {type: string}}
        decision: {type: string, enum: [emitted, dropped, error]}
        outputs: {type: array, items: {$ref: '#/components/schemas/TransformOutput'}}
        reason: {type: [string, 'null'], description: 'Plain-language explanation: when `dropped`, which step and which condition; when `emitted`, why routed items went to their port.'}
        error: {type: [string, 'null'], description: Set when `decision` is `error`.}
        step_results: {type: array, items: {$ref: '#/components/schemas/TransformStepResult'}}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}, description: 'Problems with the steps; `path` is relative to the request, for example `steps[1].conditions[0].value`.'}
    FlowSample:
      type: object
      required: [source, event_id, node_run_id, from_node_id, sensor_id, created_at, payload]
      properties:
        source: {type: string, enum: [event, node_run]}
        event_id: {$ref: '#/components/schemas/NullableUlid'}
        node_run_id: {$ref: '#/components/schemas/NullableUlid'}
        from_node_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: The upstream node that emitted the payload (node samples).}
        sensor_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: The sensor of the event (event samples).}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        payload: {$ref: '#/components/schemas/JsonValue'}
    FlowSamples:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FlowSample'}}
    Node:
      oneOf:
        - {$ref: '#/components/schemas/CommandNode'}
        - {$ref: '#/components/schemas/AgentNode'}
        - {$ref: '#/components/schemas/InboxNode'}
        - {$ref: '#/components/schemas/TransformNode'}
        - {$ref: '#/components/schemas/ApprovalNode'}
      discriminator:
        propertyName: type
        mapping:
          command: '#/components/schemas/CommandNode'
          agent: '#/components/schemas/AgentNode'
          inbox: '#/components/schemas/InboxNode'
          transform: '#/components/schemas/TransformNode'
          approval: '#/components/schemas/ApprovalNode'
    Edge:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: {type: string, description: Source node id.}
        to: {type: string, description: Target node id.}
        port: {type: string, description: 'Source port; omitted means `out`.'}
    Flow:
      type: object
      description: Flow definition (§6). `id` is the file name; it is never written to the file.
      additionalProperties: false
      required: [nodes]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        description: {type: string, description: 'Free text shown under the name; optional.'}
        enabled: {type: boolean, default: false, description: A flow without `enabled` is disabled; new flows must opt in.}
        dry_run: {type: boolean, default: false}
        subscribe: {type: array, items: {$ref: '#/components/schemas/Slug'}, description: Sensor ids.}
        max_concurrent: {type: integer, minimum: 1, default: 2}
        nodes: {type: array, items: {$ref: '#/components/schemas/Node'}}
        edges: {type: array, items: {$ref: '#/components/schemas/Edge'}}
    Prompt:
      type: object
      description: |
        Prompt file (§7.1) as JSON: the front matter (`description`, `output`) plus the template `body`. `name` is the file name.
        `output: note` expects the structured note schema; `none` is free text.
      additionalProperties: false
      required: [name, body]
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        description: {type: string}
        output: {type: string, enum: [note, none], default: none}
        body: {type: string}
    RuntimeConfig:
      type: object
      additionalProperties: false
      description: A runtime needs a `command` or a `kind`.
      properties:
        command:
          type: array
          items: {type: string}
          description: 'The agent argv. Optional with a `kind`: hal9001 then uses the installed ACP adapter or, for omp, `omp acp` (see `GET /api/runtimes`).'
        modes:
          type: object
          description: Names of the agent's session modes for restrictive and permissive runs.
          additionalProperties: false
          properties:
            ask: {type: string}
            full: {type: string}
        env:
          type: object
          description: Extra environment for the process. Values are returned as `«redacted»`.
          additionalProperties: {type: string}
        ask:
          $ref: '#/components/schemas/RuntimeSpawn'
          description: Extra argv/env for restrictive (readonly, approve) runs, for runtimes that pick approval behaviour with a process flag.
        full:
          $ref: '#/components/schemas/RuntimeSpawn'
          description: Extra argv/env for permissive (auto, approved proposal) runs.
        kind:
          type: string
          enum: [claude, codex, omp]
          description: Runtime family, used to lock the agent down to hal's MCP tools. Detected from `command` when absent; an unknown runtime runs without lockdown.
        session_meta:
          type: object
          description: Sent as `_meta` on session/new and session/load (e.g. claude settingSources isolation). Lockdown keys win over these.
          additionalProperties: true
        elicitation:
          type: boolean
          description: Advertise form elicitation so the runtime routes edit/MCP approvals to the harness (omp).
    RuntimeSpawn:
      type: object
      additionalProperties: false
      properties:
        args: {type: array, items: {type: string}}
        env:
          type: object
          description: Values are returned as `«redacted»`.
          additionalProperties: {type: string}
    AuthModuleEntry:
      type: object
      additionalProperties: false
      required: [module, control]
      properties:
        module: {type: string, examples: [localhost-trust]}
        control: {$ref: '#/components/schemas/ModuleControl'}
        options:
          type: object
          description: Module options. Values of keys containing `hash`, `secret`, `password`, `token`, or `key` are returned as `«redacted»`.
          additionalProperties: true
    AuthConfig:
      type: object
      additionalProperties: false
      properties:
        stacks:
          type: object
          description: Named ordered module stacks.
          additionalProperties:
            type: array
            items: {$ref: '#/components/schemas/AuthModuleEntry'}
        services:
          type: object
          description: Which stack guards each service.
          additionalProperties: false
          properties:
            ui: {type: string}
            api: {type: string}
            approve: {type: string}
            admin: {type: string}
    Config:
      type: object
      description: '`config.yaml` (§3, §7.3, §10.4). Defaults apply for omitted keys.'
      additionalProperties: false
      properties:
        max_agent_runs: {type: integer, minimum: 1, default: 2}
        max_command_runs: {type: integer, minimum: 1, default: 8}
        retention_days: {type: integer, minimum: 1, default: 30}
        dedup_retention_days: {type: integer, minimum: 1, default: 180}
        notify_min_priority: {$ref: '#/components/schemas/Priority'}
        notify_via: {$ref: '#/components/schemas/NotifyVia'}
        approval_timeout: {$ref: '#/components/schemas/Duration'}
        max_steers_per_run: {type: integer, minimum: 1, maximum: 100, default: 3, description: 'How many steered denials (a denial with additional steering text) one agent run or chat conversation takes. The next gated action is then held for the user and the agent is told to stop and wait.'}
        system_prompt: {type: string, maxLength: 16384, description: 'Markdown added to every agent call (flow agent nodes and assistant sessions); empty adds nothing. At most 16 KiB (16384 bytes).'}
        update_channel: {$ref: '#/components/schemas/UpdateChannel'}
        update_auto_install: {type: boolean, default: false}
        session_ttl: {$ref: '#/components/schemas/Duration'}
        allowed_hosts: {type: array, items: {type: string}}
        allowed_logins: {type: array, items: {type: string}}
        tailscale: {$ref: '#/components/schemas/TailscaleConfig'}
        runtimes:
          type: object
          additionalProperties: {$ref: '#/components/schemas/RuntimeConfig'}
        auth: {$ref: '#/components/schemas/AuthConfig'}
    StructuredNote:
      type: object
      description: Structured agent result (§7.4).
      required: [title, priority, summary_md]
      properties:
        title: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        summary_md: {type: string}
        suggested_reply: {type: string}
        links: {type: array, items: {$ref: '#/components/schemas/NoteLink'}}
    # ---------------------------------------------------------------- meta
    Health:
      type: object
      required: [status, version]
      properties:
        status: {type: string, enum: [ok]}
        version: {type: string}
    Version:
      type: object
      required: [version, commit, build_time, go_version, started_at, home]
      properties:
        version: {type: string}
        commit: {type: string}
        build_time: {type: string}
        go_version: {type: string}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        home: {type: string, description: Home directory the daemon serves.}
    KillSwitch:
      type: object
      required: [paused, kill_running, since, by, reason]
      properties:
        paused: {type: boolean}
        kill_running: {type: boolean, description: True when the pause also killed running work.}
        since: {$ref: '#/components/schemas/NullableTimestamp'}
        by: {type: [string, 'null'], description: Principal that paused.}
        reason: {type: [string, 'null']}
    PauseRequest:
      type: object
      additionalProperties: false
      properties:
        kill_running: {type: boolean, default: false}
        reason: {type: string}
    Status:
      type: object
      description: Counters for the UI header.
      required: [kill_switch, running_flow_runs, queued_flow_runs, queue_total, running_agent_runs, queued_agent_runs, pending_approvals, unread_inbox]
      properties:
        kill_switch: {$ref: '#/components/schemas/KillSwitch'}
        running_flow_runs: {type: integer, minimum: 0}
        queued_flow_runs: {type: integer, minimum: 0}
        queue_total: {type: integer, minimum: 0, description: 'Runs in the queue; equals `total` of `GET /api/queue`.'}
        running_agent_runs: {type: integer, minimum: 0}
        queued_agent_runs: {type: integer, minimum: 0}
        pending_approvals: {type: integer, minimum: 0}
        unread_inbox: {type: integer, minimum: 0, description: 'Unread, unarchived, non-dry-run items.'}
    # ---------------------------------------------------------------- app updates (GET /api/update)
    UpdateState:
      type: string
      enum: [disabled, idle, checking, up_to_date, available, pending, installing, error]
      description: |
        `disabled`: this daemon cannot update (see `disabled_reason`). `idle`: enabled, no check finished yet.
        `checking`: a check is running and nothing is known yet. `up_to_date`: the feed offers nothing newer.
        `available`: a newer build is offered. `pending`: an install was requested while flows run and starts when none
        runs. `installing`: the macOS app is downloading, verifying or replacing the bundle (see `phase`). `error`: the
        last install failed, or the last check failed and nothing newer is known (see `error`).
    UpdateBuild:
      type: object
      description: The running app build, read from the Info.plist of the bundle the daemon lives in. Empty strings and 0 outside a bundle.
      required: [bundle_id, version, build]
      properties:
        bundle_id: {type: string, examples: [dev.hal9001]}
        version: {type: string, description: '`CFBundleShortVersionString`.', examples: [0.1.7]}
        build: {type: integer, minimum: 0, description: '`CFBundleVersion`, the CI run number; 0 for a local build.'}
    UpdateRelease:
      type: object
      description: A release on a channel's feed, as published in its manifest without the signature.
      required: [schema, channel, version, build, commit, published_at, min_macos, url, size, sha256, notes_url, notes]
      properties:
        schema: {type: integer}
        channel: {$ref: '#/components/schemas/UpdateChannel'}
        version: {type: string}
        build: {type: integer, minimum: 1}
        commit: {type: string}
        published_at: {$ref: '#/components/schemas/Timestamp'}
        min_macos: {type: string, description: 'Lowest macOS version that runs the build; empty when unspecified.'}
        url: {type: string, format: uri, description: 'The `.app.zip` the app downloads.'}
        size: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        notes_url: {type: string}
        notes: {type: string}
    UpdateManifest:
      description: The full manifest of a release, with the Ed25519 `signature` (base64) over the bytes of the `.app.zip`.
      allOf:
        - {$ref: '#/components/schemas/UpdateRelease'}
        - type: object
          required: [signature]
          properties:
            signature: {type: string}
    UpdateStatus:
      type: object
      description: |
        State of app self-update. The daemon decides (checks the feed, applies the channel, idle detection and the
        auto-install policy); the macOS app executes (download, verify, replace the bundle, relaunch) after it connects to
        `GET /api/stream` with `X-Hal9001-Updater: app`. Only the release app (`dev.hal9001`, build > 0, with a signing
        key) updates; otherwise `enabled` is false and `disabled_reason` says why.
      required: [enabled, disabled_reason, current, channel, auto_install_when_idle, state, latest, available, pending, phase, busy, installer_connected, last_checked_at, error]
      properties:
        enabled: {type: boolean}
        disabled_reason: {type: [string, 'null'], description: 'Why updates are off: not in an app bundle, dev build, local build (build 0), or no signing key embedded. Null when enabled.'}
        current: {$ref: '#/components/schemas/UpdateBuild'}
        channel: {$ref: '#/components/schemas/UpdateChannel'}
        auto_install_when_idle: {type: boolean, description: 'The `update_auto_install` setting.'}
        state: {$ref: '#/components/schemas/UpdateState'}
        latest:
          description: 'Newest release on the channel feed, even when it is not newer than `current` (`available` false). Null before the first successful check.'
          oneOf:
            - {$ref: '#/components/schemas/UpdateRelease'}
            - {type: 'null'}
        available: {type: boolean, description: '`latest.build` is greater than `current.build` and this macOS can run it. Downgrades are never offered.'}
        pending: {type: boolean, description: 'An install was requested while flows run; it starts when none runs. Dropped when the installer app disconnects.'}
        phase:
          description: 'While `state` is `installing`: `requested` (the app was told), `downloading`, `verifying`, `installing` (replacing the bundle and relaunching). Null otherwise.'
          type: [string, 'null']
          enum: [requested, downloading, verifying, installing, null]
        busy:
          type: object
          required: [running_runs]
          properties:
            running_runs: {type: integer, minimum: 0, description: 'Flow runs running now; a normal install waits until it is 0.'}
        installer_connected: {type: boolean, description: 'The macOS app is connected as installer. Without it installs are refused (409) and auto-install does not fire.'}
        last_checked_at: {$ref: '#/components/schemas/NullableTimestamp'}
        error: {type: [string, 'null'], description: 'The last install failure (kept until the next install request) or check failure.'}
    UpdateInstall:
      type: object
      required: [manifest]
      properties:
        manifest: {$ref: '#/components/schemas/UpdateManifest'}
    UpdateInstallRequest:
      type: object
      additionalProperties: false
      properties:
        force: {type: boolean, default: false, description: 'Install now even while flows run. The daemon restart that follows the update interrupts them. Offered by the web UI only, behind a confirmation.'}
    UpdateReportRequest:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, enum: [downloading, verifying, installing, failed]}
        error: {type: string, description: 'For `failed`: what went wrong, shown to the user.'}
    # ---------------------------------------------------------------- file resources (sensors, flows, prompts)
    SensorStatus:
      type: object
      required: [state, paused, paused_at, paused_by, last_run, last_success_at, next_poll_at, manual, reset_at, reset_by, new_items_24h]
      properties:
        paused:
          type: boolean
          description: 'This sensor was paused with `POST /api/sensors/{id}/pause`. Independent of the kill switch: `state` is `paused` for either, `paused` is true only for this one.'
        paused_at: {$ref: '#/components/schemas/NullableTimestamp'}
        paused_by: {type: [string, 'null'], description: 'Principal that paused the sensor; null when it is not paused.'}
        state:
          type: string
          enum: [idle, running, failing, paused, invalid]
          description: '`failing` when the last poll failed; `paused` while the kill switch is engaged or this sensor is paused (`paused`); `invalid` when the file has errors.'
        last_run: {oneOf: [{$ref: '#/components/schemas/SensorRun'}, {type: 'null'}]}
        last_success_at: {$ref: '#/components/schemas/NullableTimestamp'}
        next_poll_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: 'When the scheduler polls next. `null` while paused (kill switch or this sensor), when the file is invalid, when no enabled flow subscribes to the sensor (such a sensor is not scheduled; "Run now" still works) and for a manual-only sensor (`manual`).'
        manual: {type: boolean, description: 'The sensor has neither `interval` nor `cron`: the scheduler never polls it, only "Run now" (`POST /api/sensors/{id}/poll`) does.'}
        reset_at:
          $ref: '#/components/schemas/NullableTimestamp'
          description: 'When the sensor''s dedup state was last reset (`POST /api/sensors/{id}/reset`); null if never.'
        reset_by: {type: [string, 'null'], description: 'Principal that last reset the sensor; null if never reset.'}
        new_items_24h: {type: integer, minimum: 0}
    SensorSummary:
      type: object
      required: [id, path, hash, sensor, diagnostics, status]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        path: {type: string, description: 'Relative to the home dir, e.g. `sensors/github-notifications.yaml`.'}
        hash: {$ref: '#/components/schemas/Hash'}
        sensor: {oneOf: [{$ref: '#/components/schemas/Sensor'}, {type: 'null'}], description: Null when the YAML does not parse.}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        status: {$ref: '#/components/schemas/SensorStatus'}
    SensorDetail:
      allOf:
        - {$ref: '#/components/schemas/SensorSummary'}
        - type: object
          required: [yaml]
          properties:
            yaml: {type: string, description: The file as on disk.}
    SensorList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SensorSummary'}}
    SensorCreateRequest:
      type: object
      description: Exactly one of `yaml` and `sensor`.
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string}
        sensor: {$ref: '#/components/schemas/Sensor'}
      oneOf:
        - {required: [yaml]}
        - {required: [sensor]}
    SensorUpdateRequest:
      type: object
      description: '`expected_hash` plus exactly one of `yaml` and `sensor`.'
      additionalProperties: false
      required: [expected_hash]
      properties:
        expected_hash: {$ref: '#/components/schemas/Hash'}
        yaml: {type: string}
        sensor: {$ref: '#/components/schemas/Sensor'}
      oneOf:
        - {required: [yaml]}
        - {required: [sensor]}
    SensorValidateRequest:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string}
        sensor: {$ref: '#/components/schemas/Sensor'}
      oneOf:
        - {required: [yaml]}
        - {required: [sensor]}
    SensorValidation:
      type: object
      required: [valid, diagnostics, yaml, sensor]
      properties:
        valid: {type: boolean, description: 'True when there are no `error` diagnostics.'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        yaml: {type: [string, 'null'], description: 'Canonical YAML of the sensor, null when the input did not parse.'}
        sensor: {oneOf: [{$ref: '#/components/schemas/Sensor'}, {type: 'null'}]}
    # ---------------------------------------------------------------- custom tools (docs/design/agent-access.md)
    ToolLang: {type: string, enum: [bash, python, node, exec]}
    ToolParamType: {type: string, enum: [string, number, integer, boolean, array, object]}
    ToolParam:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/ToolParamType'}
        description: {type: string}
        required: {type: boolean, default: false}
        enum: {type: array, items: {$ref: '#/components/schemas/JsonValue'}, description: Allowed values.}
        default: {$ref: '#/components/schemas/JsonValue'}
    ToolWhen:
      type: object
      description: A condition group over the tool's arguments (the Transform condition model; `field` is a path into the arguments object).
      additionalProperties: false
      required: [conditions]
      properties:
        match: {type: string, enum: [all, any], default: all}
        conditions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TransformCondition'}}
    NodeToolRef:
      description: |
        A custom tool on an agent node: its id, or `{id, approve}` to override the tool's own approval setting for this
        node. The tool is exposed to the agent as its id lowercased with `-` replaced by `_`.
      oneOf:
        - {type: string}
        - type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {type: string}
            approve: {$ref: '#/components/schemas/ToolApprove'}
    ToolApprove:
      description: |
        When a call needs approval: `never`, `always` (the default), or `{when: {match, conditions}}`, which asks only
        when the conditions match the arguments (defaults filled in).
      oneOf:
        - {type: string, enum: [never, always]}
        - type: object
          additionalProperties: false
          required: [when]
          properties:
            when: {$ref: '#/components/schemas/ToolWhen'}
    Tool:
      type: object
      description: |
        Custom tool (`tools/<id>.yaml`). Arguments are described by `params` or, as an override, by a raw JSON Schema
        in `schema` (not both). A call passes the arguments as JSON on stdin and as `ARG_<UPPER_NAME>` variables
        (strings as is, numbers and booleans as text, arrays and objects as JSON). Stdout is the result; a non-zero
        exit is a tool error carrying the stderr tail. `exec` takes `command`; every other `lang` takes `script`.
      additionalProperties: false
      required: [description, lang]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        description: {type: string, description: What the tool does and when to use it; the agent reads this.}
        params:
          type: object
          additionalProperties: {$ref: '#/components/schemas/ToolParam'}
        schema: {type: object, additionalProperties: true, description: 'Raw JSON Schema of the arguments (`type: object`). Replaces `params`.'}
        lang: {$ref: '#/components/schemas/ToolLang'}
        script: {type: string}
        command: {type: array, items: {type: string}, description: 'argv for `lang: exec`.'}
        approve: {$ref: '#/components/schemas/ToolApprove'}
        timeout: {$ref: '#/components/schemas/Duration'}
        runs_in_sandbox: {type: boolean, default: false, description: 'Run in the calling node sandbox instead of on the hal host.'}
    ToolSummary:
      type: object
      required: [id, path, hash, tool, schema, diagnostics]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        path: {type: string, description: 'Relative to the home dir, e.g. `tools/now.yaml`.'}
        hash: {$ref: '#/components/schemas/Hash'}
        tool: {oneOf: [{$ref: '#/components/schemas/Tool'}, {type: 'null'}], description: Null when the YAML does not parse.}
        schema:
          type: [object, 'null']
          additionalProperties: true
          description: The effective JSON Schema of the arguments (built from `params`, or the raw `schema`). Null when the YAML does not parse.
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    ToolDetail:
      allOf:
        - {$ref: '#/components/schemas/ToolSummary'}
        - type: object
          required: [yaml]
          properties:
            yaml: {type: string, description: The file as on disk.}
    ToolList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ToolSummary'}}
    ToolCreateRequest:
      type: object
      description: Exactly one of `yaml` and `tool`.
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string}
        tool: {$ref: '#/components/schemas/Tool'}
      oneOf:
        - {required: [yaml]}
        - {required: [tool]}
    ToolUpdateRequest:
      type: object
      description: '`expected_hash` plus exactly one of `yaml` and `tool`.'
      additionalProperties: false
      required: [expected_hash]
      properties:
        expected_hash: {$ref: '#/components/schemas/Hash'}
        yaml: {type: string}
        tool: {$ref: '#/components/schemas/Tool'}
      oneOf:
        - {required: [yaml]}
        - {required: [tool]}
    ToolValidateRequest:
      type: object
      additionalProperties: false
      properties:
        yaml: {type: string}
        tool: {$ref: '#/components/schemas/Tool'}
      oneOf:
        - {required: [yaml]}
        - {required: [tool]}
    ToolValidation:
      type: object
      required: [valid, diagnostics, yaml, tool, schema]
      properties:
        valid: {type: boolean, description: 'True when there are no `error` diagnostics.'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        yaml: {type: [string, 'null'], description: 'Canonical YAML of the tool, null when the input did not parse.'}
        tool: {oneOf: [{$ref: '#/components/schemas/Tool'}, {type: 'null'}]}
        schema: {type: [object, 'null'], additionalProperties: true, description: The effective JSON Schema of the arguments.}
    ToolTestRequest:
      type: object
      additionalProperties: false
      properties:
        args: {type: object, additionalProperties: true, description: 'The arguments object; omitted means `{}`.'}
    ToolTestResult:
      type: object
      required: [ok, args, stdout, structured, stderr, exit_code, duration_ms, timed_out, error]
      properties:
        ok: {type: boolean, description: Exit code 0 within the timeout.}
        args: {type: object, additionalProperties: true, description: 'The arguments as passed to the tool, with defaults filled in.'}
        stdout: {type: string, description: Redacted standard output.}
        structured: {description: 'Stdout parsed when it is a JSON object or array; null otherwise.', oneOf: [{type: object, additionalProperties: true}, {type: array, items: {}}, {type: 'null'}]}
        stderr: {type: string, description: Redacted standard error.}
        exit_code: {type: integer}
        duration_ms: {type: integer}
        timed_out: {type: boolean}
        error: {type: [string, 'null'], description: 'The tool error message with the stderr tail; null when ok.'}
    ToolEnvKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, overrides_global, secret, value]
            properties:
              key: {$ref: '#/components/schemas/EnvKeyName'}
              secret: {type: boolean, description: 'Secret values are redacted from output and never returned. A key is secret unless marked plain.'}
              value: {type: [string, 'null'], description: 'The value of a plain key (`secret: false`); null for a secret key.'}
              overrides_global: {type: boolean, description: 'The global `env` file has the same key; this tool sees its own value.'}
    FlowHealth:
      type: object
      description: Run statistics over the last 7 days (bounded by retention). `live` and `replay` runs only.
      required: [window_hours, runs, failed, error_rate, running, queued, awaiting_approval, last_run_id, last_run_at, last_run_status]
      properties:
        window_hours: {type: integer, examples: [168]}
        runs: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0, description: 'Runs that ended `failed`, `killed`, or `interrupted`. `cancelled` runs count as finished, not failed.'}
        error_rate: {type: number, minimum: 0, maximum: 1, description: '`failed / finished runs`; 0 when none finished.'}
        running: {type: integer, minimum: 0}
        queued: {type: integer, minimum: 0}
        awaiting_approval: {type: integer, minimum: 0}
        last_run_id: {$ref: '#/components/schemas/NullableUlid'}
        last_run_at: {$ref: '#/components/schemas/NullableTimestamp'}
        last_run_status: {oneOf: [{$ref: '#/components/schemas/FlowRunStatus'}, {type: 'null'}]}
    FlowSummary:
      type: object
      required: [id, path, hash, enabled, dry_run, subscribe, node_count, diagnostics, health]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        path: {type: string}
        hash: {$ref: '#/components/schemas/Hash'}
        enabled: {type: [boolean, 'null'], description: Null when the YAML does not parse.}
        dry_run: {type: [boolean, 'null']}
        subscribe: {type: array, items: {$ref: '#/components/schemas/Slug'}}
        description: {type: string, description: 'The flow''s `description`; empty when unset.'}
        node_count: {type: integer, minimum: 0}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        health: {$ref: '#/components/schemas/FlowHealth'}
    FlowList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FlowSummary'}}
    FlowDetail:
      type: object
      required: [id, path, hash, yaml, flow, diagnostics]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        path: {type: string}
        hash: {$ref: '#/components/schemas/Hash'}
        yaml: {type: string, description: The file as on disk.}
        flow: {oneOf: [{$ref: '#/components/schemas/Flow'}, {type: 'null'}], description: Parsed flow; null when the YAML does not parse.}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    FlowCreateRequest:
      type: object
      description: Exactly one of `yaml` and `flow`.
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string}
        flow: {$ref: '#/components/schemas/Flow'}
      oneOf:
        - {required: [yaml]}
        - {required: [flow]}
    FlowUpdateRequest:
      type: object
      description: '`expected_hash` plus exactly one of `yaml` and `flow`. The flow `id` must match the path.'
      additionalProperties: false
      required: [expected_hash]
      properties:
        expected_hash: {$ref: '#/components/schemas/Hash'}
        yaml: {type: string}
        flow: {$ref: '#/components/schemas/Flow'}
      oneOf:
        - {required: [yaml]}
        - {required: [flow]}
    FlowValidateRequest:
      type: object
      description: Exactly one of `yaml` and `flow`. `id`, when given, is the id the flow would be stored under (an invalid one is an `invalid_id` error; a different `id:` line in the YAML is a warning).
      additionalProperties: false
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string}
        flow: {$ref: '#/components/schemas/Flow'}
      oneOf:
        - {required: [yaml]}
        - {required: [flow]}
    FlowValidation:
      type: object
      required: [valid, diagnostics, hash, yaml, flow]
      properties:
        valid: {type: boolean, description: 'True when there are no `error` diagnostics.'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        hash: {$ref: '#/components/schemas/NullableHash'}
        yaml: {type: [string, 'null'], description: 'YAML text (the input, or the canonical rendering of the JSON input).'}
        flow: {oneOf: [{$ref: '#/components/schemas/Flow'}, {type: 'null'}], description: Parsed flow; null when the YAML did not parse.}
    FlowVersionSummary:
      type: object
      required: [flow_id, hash, created_at, run_count]
      properties:
        flow_id: {$ref: '#/components/schemas/Slug'}
        hash: {$ref: '#/components/schemas/Hash'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        run_count: {type: integer, minimum: 0}
    FlowVersion:
      allOf:
        - {$ref: '#/components/schemas/FlowVersionSummary'}
        - type: object
          required: [yaml, flow]
          properties:
            yaml: {type: string}
            flow: {oneOf: [{$ref: '#/components/schemas/Flow'}, {type: 'null'}]}
    FlowVersionList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FlowVersionSummary'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    TestNodeInput:
      description: What the node receives on stdin.
      oneOf:
        - type: object
          description: A stored event's payload (as if the node were an entry node).
          additionalProperties: false
          required: [source, event_id]
          properties:
            source: {type: string, enum: [event]}
            event_id: {$ref: '#/components/schemas/Ulid'}
        - type: object
          description: An output payload of an earlier node run (its stdout parsed as JSON or JSONL).
          additionalProperties: false
          required: [source, node_run_id]
          properties:
            source: {type: string, enum: [node_run]}
            node_run_id: {$ref: '#/components/schemas/Ulid'}
            output_index: {type: integer, minimum: 0, default: 0, description: Which payload when the node emitted several.}
        - type: object
          description: Pasted JSON.
          additionalProperties: false
          required: [source, json]
          properties:
            source: {type: string, enum: [json]}
            json: {$ref: '#/components/schemas/JsonValue'}
      discriminator:
        propertyName: source
    TestNodeRequest:
      type: object
      additionalProperties: false
      required: [node_id, input]
      properties:
        node_id: {$ref: '#/components/schemas/Slug'}
        node: {$ref: '#/components/schemas/Node'}
        input: {$ref: '#/components/schemas/TestNodeInput'}
        dry_run: {type: boolean, default: false, description: 'Run with dry-run semantics (`HAL_DRY_RUN=1`, agents forced readonly, `side_effect` skipped).'}
        simulate_approval: {type: string, enum: [approved, denied], default: approved, description: 'For an `approval` node or a node with `requires_approval`: the decision to take instead of waiting for one.'}
        simulate_emit:
          $ref: '#/components/schemas/SimulatedEmit'
          description: 'For an `agent` node: emit on a port instead of running the agent. The node run is `done` with the reason `simulated: emit_<port>` and its stdout is the emitted payload. Outputs are not routed (a node test runs one node).'
    SimulatedEmit:
      type: object
      description: |
        Makes an agent node emit in a test instead of running the agent. `port` must be a declared port of the node
        with an outgoing edge. The emitted payload is the downstream payload of a real emission, with
        `agent.status` `simulated` and `agent.output` the validated `output`. The request is rejected (400) when the
        node is not an agent node, the port is not declared or has no outgoing edge, or `output` does not match the
        port's schema (the error names each path and reason).
      additionalProperties: false
      required: [port]
      properties:
        port: {type: string, pattern: '^[a-z0-9_]+$'}
        output:
          type: [object, 'null']
          additionalProperties: true
          description: 'The emitted arguments. When omitted, a minimal payload is generated from the port''s schema: required fields only; `const`, `default`, the first example or the first enum value when present, a placeholder string named after the property, `minimum` or 0, false, an empty array, nested required objects.'
    TestNodeResult:
      type: object
      required: [flow_run, node_run]
      properties:
        flow_run: {$ref: '#/components/schemas/FlowRun'}
        node_run: {$ref: '#/components/schemas/NodeRun'}
    PromptSummary:
      type: object
      required: [name, path, hash, prompt, diagnostics]
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        path: {type: string}
        hash: {$ref: '#/components/schemas/Hash'}
        prompt: {oneOf: [{$ref: '#/components/schemas/Prompt'}, {type: 'null'}], description: Null when the file does not parse.}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    PromptDetail:
      allOf:
        - {$ref: '#/components/schemas/PromptSummary'}
        - type: object
          required: [markdown]
          properties:
            markdown: {type: string, description: The file as on disk.}
    PromptList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PromptSummary'}}
    PromptCreateRequest:
      type: object
      description: Exactly one of `markdown` and `prompt`.
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        markdown: {type: string}
        prompt: {$ref: '#/components/schemas/Prompt'}
      oneOf:
        - {required: [markdown]}
        - {required: [prompt]}
    PromptUpdateRequest:
      type: object
      additionalProperties: false
      required: [expected_hash]
      properties:
        expected_hash: {$ref: '#/components/schemas/Hash'}
        markdown: {type: string}
        prompt: {$ref: '#/components/schemas/Prompt'}
      oneOf:
        - {required: [markdown]}
        - {required: [prompt]}
    PromptRenderRequest:
      type: object
      description: One of `name` or `markdown`, and one of `event_id` or `input`.
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        markdown: {type: string}
        event_id: {$ref: '#/components/schemas/Ulid'}
        input: {$ref: '#/components/schemas/JsonValue'}
        extra_prompt: {type: string}
      allOf:
        - oneOf:
            - {required: [name]}
            - {required: [markdown]}
        - oneOf:
            - {required: [event_id]}
            - {required: [input]}
    PromptRender:
      type: object
      required: [rendered, diagnostics]
      properties:
        rendered: {type: [string, 'null'], description: Null when rendering failed.}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    # ---------------------------------------------------------------- settings, env, runtimes
    Settings:
      type: object
      required: [hash, config]
      properties:
        hash: {$ref: '#/components/schemas/Hash'}
        config: {$ref: '#/components/schemas/Config'}
    SettingsPatch:
      type: object
      description: Editable `config.yaml` fields. Absent fields are unchanged.
      additionalProperties: false
      minProperties: 1
      properties:
        expected_hash: {$ref: '#/components/schemas/Hash'}
        max_agent_runs: {type: integer, minimum: 1}
        max_command_runs: {type: integer, minimum: 1}
        retention_days: {type: integer, minimum: 1}
        dedup_retention_days: {type: integer, minimum: 1}
        notify_min_priority: {$ref: '#/components/schemas/Priority'}
        notify_via: {$ref: '#/components/schemas/NotifyVia'}
        approval_timeout: {$ref: '#/components/schemas/Duration'}
        max_steers_per_run: {type: integer, minimum: 1, maximum: 100}
        system_prompt: {type: string, description: 'Markdown added to every agent call. Empty clears it. 422 above 16 KiB (16384 bytes).'}
        update_channel: {$ref: '#/components/schemas/UpdateChannel'}
        update_auto_install: {type: boolean, description: 'Install an available app update by itself once no flow is running.'}
    EnvKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, secret, value]
            properties:
              key: {$ref: '#/components/schemas/EnvKeyName'}
              secret: {type: boolean, description: 'Secret values are redacted from output and never returned. A key is secret unless marked plain.'}
              value: {type: [string, 'null'], description: 'The value of a plain key (`secret: false`); null for a secret key.'}
    SensorEnvKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, overrides_global, secret, value]
            properties:
              key: {$ref: '#/components/schemas/EnvKeyName'}
              secret: {type: boolean, description: 'Secret values are redacted from output and never returned. A key is secret unless marked plain.'}
              value: {type: [string, 'null'], description: 'The value of a plain key (`secret: false`); null for a secret key.'}
              overrides_global: {type: boolean, description: 'The global `env` file has the same key; this sensor sees its own value.'}
    EnvSetRequest:
      type: object
      additionalProperties: false
      description: |
        At least one of `value` and `secret` is required. With `value`, the key is created or replaced and `secret`
        defaults to true. Without `value`, only the flag of an existing key changes.
      properties:
        value: {type: string, writeOnly: true}
        secret: {type: boolean, description: 'false marks the value as not secret: it is not redacted from output and the API returns it. Default true.'}
    SandboxBackendName:
      type: string
      enum: [local, docker, depot, kubernetes, ssh]
    SandboxLifecycle:
      type: string
      enum: [per_run, persistent]
      description: '`per_run`: a workspace (container, pod, sandbox, directory) per run, removed after a successful run; failed runs are kept for debugging. `persistent`: one long-lived environment with a per-run workdir.'
    SandboxApprovalMode:
      type: string
      enum: [auto, always, rules]
      description: 'Approval for `shell` and `fs_write` tool calls: `auto` runs them, `always` asks in the Inbox, `rules` applies `approval_rules` and asks when none matches.'
    SandboxRuleAction:
      type: string
      enum: [auto, approve, deny]
    SandboxResources:
      type: object
      additionalProperties: false
      required: [cpus, memory_mb, disk_gb]
      description: Compute limits; 0 means the backend default. Docker uses cpus and memory_mb, kubernetes the same as limits and requests, depot all three (whole vCPUs, 2 to 64).
      properties:
        cpus: {type: number, minimum: 0}
        memory_mb: {type: integer, minimum: 0}
        disk_gb: {type: integer, minimum: 0}
    SandboxApprovalRules:
      type: object
      additionalProperties: false
      required: [shell, fs_write]
      description: The first matching rule wins; no match means approval is required.
      properties:
        shell:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [match, action]
            properties:
              match: {type: string, minLength: 1, description: Regular expression (RE2) searched in the whole command text. Anchor it with ^ and $.}
              action: {$ref: '#/components/schemas/SandboxRuleAction'}
        fs_write:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, action]
            properties:
              path: {type: string, minLength: 1, description: 'Glob relative to the workdir: `*` within a path segment, `**` across segments.'}
              action: {$ref: '#/components/schemas/SandboxRuleAction'}
    Sandbox:
      type: object
      additionalProperties: false
      description: |
        Config of one sandbox backend (`sandboxes/<backend>.yaml`). The fields after `resources` belong to the backend
        named in their description and are ignored by the others. Credentials are not part of it (see the env endpoints).
      required: [enabled, lifecycle, approval, approval_rules, timeout, keep_alive, resources, root, socket, images, network, org_id, image_ref, architecture, timeout_minutes, disable_tailnet, disable_depot_cache, secrets, endpoint, kubeconfig, context, namespace, service_account, host, port, user, key_file, host_key]
      properties:
        enabled: {type: boolean, description: 'Always true for local, which cannot be disabled (a stored false is ignored with a warning). Required fields of other backends are only checked while enabled. An enabled depot also needs DEPOT_TOKEN in its env file (422 "Depot token is required" otherwise).'}
        lifecycle: {$ref: '#/components/schemas/SandboxLifecycle'}
        approval: {$ref: '#/components/schemas/SandboxApprovalMode'}
        approval_rules: {$ref: '#/components/schemas/SandboxApprovalRules'}
        timeout: {$ref: '#/components/schemas/Duration', description: Default timeout of one command.}
        keep_alive: {$ref: '#/components/schemas/Duration', description: 'How long the sandbox of a run stays after the run ends, so a chat can continue in it. `0s` removes it at once. Default `1m` when the file does not set it; any non-negative duration is accepted (`0` is accepted on input).'}
        resources: {$ref: '#/components/schemas/SandboxResources'}
        root: {type: string, description: 'local, ssh: root directory (`<root>/runs/<run-id>` for per_run). local default `<home>/data/sandboxes/local`; ssh may be relative to the remote home.'}
        socket: {type: string, description: 'docker: Engine socket (`/path`, `unix:///path` or `tcp://host:port`). Default `DOCKER_HOST`, then the usual socket locations.'}
        images: {type: array, items: {type: string}, description: 'docker, kubernetes: allowed images; the first is the default.'}
        network: {type: boolean, description: 'docker: false runs containers without a network.'}
        org_id: {type: string, description: 'depot: organization id (else `DEPOT_ORG_ID` from the env).'}
        image_ref: {type: string, description: 'depot: Depot snapshot image to boot; empty uses the default image.'}
        architecture: {type: string, enum: ['', amd64, arm64], description: 'depot.'}
        timeout_minutes: {type: integer, minimum: 0, maximum: 1440, description: 'depot: sandbox lifetime; 0 uses the Depot default (120).'}
        disable_tailnet: {type: boolean, description: 'depot.'}
        disable_depot_cache: {type: boolean, description: 'depot.'}
        secrets: {type: object, additionalProperties: {type: string}, description: 'depot: environment variable name to Depot CI secret name.'}
        endpoint: {type: string, description: 'depot: API endpoint; default https://api.depot.dev.'}
        kubeconfig: {type: string, description: 'kubernetes: kubeconfig path (`KUBECONFIG`); empty uses kubectl''s default.'}
        context: {type: string, description: 'kubernetes: kubectl context.'}
        namespace: {type: string, description: 'kubernetes.'}
        service_account: {type: string, description: 'kubernetes: service account of the pods.'}
        host: {type: string, description: ssh.}
        port: {type: integer, minimum: 0, maximum: 65535, description: 'ssh; default 22.'}
        user: {type: string, description: ssh.}
        key_file: {type: string, description: 'ssh: private key file; alternative to `SSH_PRIVATE_KEY` and `SSH_PASSWORD` in the env.'}
        host_key: {type: string, description: 'ssh: pinned SHA256 host key fingerprint (`SHA256:...`). Required to connect; get it from the check endpoint.'}
    SandboxSummary:
      type: object
      required: [backend, configured, enabled, lifecycle, approval, valid]
      properties:
        backend: {$ref: '#/components/schemas/SandboxBackendName'}
        configured: {type: boolean, description: The config file exists.}
        enabled: {type: boolean}
        lifecycle: {$ref: '#/components/schemas/SandboxLifecycle'}
        approval: {$ref: '#/components/schemas/SandboxApprovalMode'}
        valid: {type: boolean, description: The file has no errors.}
    SandboxList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SandboxSummary'}}
    SandboxDetail:
      type: object
      required: [backend, configured, hash, config, diagnostics]
      properties:
        backend: {$ref: '#/components/schemas/SandboxBackendName'}
        configured: {type: boolean}
        hash: {$ref: '#/components/schemas/Hash'}
        config: {$ref: '#/components/schemas/Sandbox'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
    SandboxUpdateRequest:
      type: object
      additionalProperties: false
      required: [expected_hash, config]
      properties:
        expected_hash: {$ref: '#/components/schemas/Hash'}
        config: {$ref: '#/components/schemas/Sandbox'}
    SandboxCheckRequest:
      type: object
      additionalProperties: false
      properties:
        config: {$ref: '#/components/schemas/Sandbox'}
    SandboxCheckResult:
      type: object
      required: [ok, message, fingerprint]
      properties:
        ok: {type: boolean}
        message: {type: string}
        fingerprint: {type: [string, 'null'], description: 'ssh: SHA256 fingerprint the server presented when the host key is not pinned or does not match.'}
    SandboxEnvKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [key, overrides_global, secret, value]
            properties:
              key: {$ref: '#/components/schemas/EnvKeyName'}
              secret: {type: boolean}
              value: {type: [string, 'null'], description: 'The value of a plain key; null for a secret key.'}
              overrides_global: {type: boolean, description: 'The global `env` file has the same key; commands in this sandbox see this value.'}
    AgentInfo:
      type: object
      description: '`agentInfo` from the ACP `initialize` response.'
      properties:
        name: {type: string}
        title: {type: [string, 'null']}
        version: {type: string}
    Runtime:
      type: object
      required: [name, kind, command, modes, last_probe, detection]
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        kind:
          type: [string, 'null']
          enum: [claude, codex, omp, null]
          description: The configured `kind`, else the family the command names; null for another agent.
        command: {type: array, items: {type: string}, description: 'The `command` set in `config.yaml`; empty when hal9001 finds the agent itself (see `detection.command`).'}
        modes:
          type: object
          properties:
            ask: {type: string}
            full: {type: string}
        env_keys: {type: array, items: {type: string}, description: Names of the extra environment variables; values are never returned.}
        last_probe: {oneOf: [{$ref: '#/components/schemas/ProbeResult'}, {type: 'null'}], description: Result of the last probe since the daemon started.}
        detection: {$ref: '#/components/schemas/RuntimeDetection'}
    RuntimeDetection:
      type: object
      description: |
        What hal9001 found for a runtime. `status`: `ready` (a command to start and you are signed in), `warning` (a
        command to start, but the login is missing or unknown, or another warning applies) or `unavailable` (no
        command can be started). A runtime that is not `unavailable` runs; a node of an `unavailable` runtime fails
        with the first warning's message.
      required: [status, cli, auth, adapter, node, command, warnings, checked_at]
      properties:
        status: {type: string, enum: [ready, warning, unavailable]}
        cli:
          type: object
          description: The agent's own command line tool (`claude`, `codex`, `omp`). A candidate that cannot run `--version` counts as not found.
          required: [name, found, path, version]
          properties:
            name: {type: string}
            found: {type: boolean}
            path: {type: [string, 'null']}
            version: {type: [string, 'null']}
        auth:
          type: object
          required: [status, command]
          properties:
            status:
              type: string
              enum: [ok, missing, unknown]
              description: 'From `claude auth status`, `codex login status`, or (omp) whether `omp models` lists a provider with credentials; `unknown` when the check could not run.'
            command: {type: [string, 'null'], description: 'What to run to sign in, for example `claude login`.'}
        adapter:
          type: object
          description: What speaks ACP for the runtime.
          required: [source, installed, version, pinned_version, path, installable, installing]
          properties:
            source:
              type: string
              enum: [builtin, managed, custom, none]
              description: '`custom`: the `command` of `config.yaml`; `managed`: the adapter hal9001 installed; `builtin`: the CLI itself (`omp acp`); `none`: nothing usable yet.'
            installed: {type: boolean}
            version: {type: [string, 'null']}
            pinned_version: {type: [string, 'null'], description: The version hal9001 installs (the one the lockdown was tested with); null when the runtime has no managed adapter.}
            path: {type: [string, 'null'], description: 'The adapter script, or the executable of the `builtin` and `custom` sources.'}
            installable: {type: boolean, description: 'hal9001 can install the adapter (`POST /api/runtimes/{name}/adapter`).'}
            installing: {type: boolean}
        node:
          type: object
          required: [found, version, ok]
          properties:
            found: {type: boolean}
            version: {type: [string, 'null']}
            ok: {type: boolean, description: Version 22 or newer; the adapters need it.}
        command:
          type: [array, 'null']
          items: {type: string}
          description: The argv hal9001 starts for the runtime; null when `status` is `unavailable`.
        warnings: {type: array, items: {$ref: '#/components/schemas/RuntimeWarning'}}
        checked_at: {$ref: '#/components/schemas/Timestamp'}
    RuntimeWarning:
      type: object
      required: [code, message, command, url]
      properties:
        code:
          type: string
          enum: [cli_missing, auth_missing, auth_unknown, node_missing, node_old, adapter_missing, providers_missing, adapter_install_failed]
        message: {type: string}
        command: {type: [string, 'null'], description: A command that fixes it.}
        url: {type: [string, 'null'], description: A page that explains the fix.}
    RuntimeList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Runtime'}}
    ProbeResult:
      type: object
      required: [runtime, ok, checked_at, duration_ms, error]
      properties:
        runtime: {$ref: '#/components/schemas/Slug'}
        ok: {type: boolean}
        checked_at: {$ref: '#/components/schemas/Timestamp'}
        duration_ms: {type: integer, minimum: 0}
        error: {type: [string, 'null'], description: Why the probe failed.}
        stderr: {type: string, description: 'Tail of the process''s stderr, redacted.'}
        protocol_version: {type: [integer, 'null']}
        agent_info: {oneOf: [{$ref: '#/components/schemas/AgentInfo'}, {type: 'null'}]}
        capabilities: {$ref: '#/components/schemas/JsonValue'}
        load_session: {type: boolean, description: 'Whether the agent advertises `loadSession`.'}
        available_modes:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
              description: {type: [string, 'null']}
        available_models:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string}
              name: {type: string}
        ask_mode_available: {type: boolean, description: 'The configured `modes.ask` is among `available_modes`.'}
        full_mode_available: {type: boolean}
    # ---------------------------------------------------------------- trace records (REQUIREMENTS §9)
    SensorRun:
      type: object
      required: [id, sensor_id, trigger, status, baseline, started_at, ended_at, duration_ms, exit_code, item_count, new_count, stdout, stderr, error]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        sensor_id: {$ref: '#/components/schemas/Slug'}
        trigger: {type: string, enum: [scheduled, manual]}
        status: {$ref: '#/components/schemas/SensorRunStatus'}
        baseline: {type: boolean, description: 'True for a `first_run: baseline` poll that marked items seen without firing.'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        duration_ms: {type: [integer, 'null'], minimum: 0}
        exit_code: {type: [integer, 'null']}
        item_count: {type: [integer, 'null'], minimum: 0}
        new_count: {type: [integer, 'null'], minimum: 0}
        stdout: {$ref: '#/components/schemas/TextBlob'}
        stderr: {$ref: '#/components/schemas/TextBlob'}
        error: {type: [string, 'null'], description: 'Failure class: `timeout`, `exit_nonzero`, `invalid_output`, `killed`, `interrupted`.'}
    SensorRunList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SensorRun'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    Event:
      type: object
      required: [id, sensor_id, sensor_run_id, dedup_key, payload, created_at, injected]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        sensor_id: {$ref: '#/components/schemas/Slug'}
        sensor_run_id: {$ref: '#/components/schemas/NullableUlid'}
        dedup_key: {type: string}
        payload: {$ref: '#/components/schemas/JsonValue'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        injected: {type: boolean, description: 'Created by `POST /api/events`, not by a poll.'}
    FlowRunBrief:
      type: object
      required: [id, flow_id, flow_hash, kind, dry_run, status, replay_of, created_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        flow_id: {$ref: '#/components/schemas/Slug'}
        flow_hash: {$ref: '#/components/schemas/Hash'}
        kind: {$ref: '#/components/schemas/FlowRunKind'}
        dry_run: {type: boolean}
        status: {$ref: '#/components/schemas/FlowRunStatus'}
        replay_of: {$ref: '#/components/schemas/NullableUlid'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
    EventSummary:
      type: object
      required: [id, sensor_id, sensor_run_id, dedup_key, payload_preview, created_at, injected, flow_runs]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        sensor_id: {$ref: '#/components/schemas/Slug'}
        sensor_run_id: {$ref: '#/components/schemas/NullableUlid'}
        dedup_key: {type: string}
        payload_preview: {type: string, maxLength: 512, description: Compact JSON of the payload cut to 512 characters.}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        injected: {type: boolean}
        flow_runs: {type: array, items: {$ref: '#/components/schemas/FlowRunBrief'}, description: 'Runs matching the list filters (default: live and replay).'}
    EventList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EventSummary'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    NodeRunTree:
      type: object
      required: [node_run, children]
      properties:
        node_run: {$ref: '#/components/schemas/NodeRun'}
        children: {type: array, items: {$ref: '#/components/schemas/NodeRunTree'}, description: 'Node runs whose `parent_node_run_id` is this one.'}
    FanOutBranch:
      type: object
      required: [flow_run, node_runs]
      properties:
        flow_run: {$ref: '#/components/schemas/FlowRun'}
        node_runs: {type: array, items: {$ref: '#/components/schemas/NodeRunTree'}, description: Entry node runs of the flow run. Text previews are truncated to 4 KiB.}
    EventDetail:
      type: object
      required: [event, sensor_run, fan_out]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        sensor_run: {oneOf: [{$ref: '#/components/schemas/SensorRun'}, {type: 'null'}]}
        fan_out: {type: array, items: {$ref: '#/components/schemas/FanOutBranch'}, description: 'One branch per flow run of this event, oldest first.'}
    InjectResult:
      type: object
      required: [event, deduplicated, dedup_key, flow_runs]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        deduplicated: {type: boolean, description: 'True when the key was already seen; `event` is then the existing event and no runs were created.'}
        dedup_key: {type: string}
        flow_runs: {type: array, items: {$ref: '#/components/schemas/FlowRunBrief'}}
    PollRequest:
      type: object
      additionalProperties: false
      properties:
        rerun_seen: {type: boolean, default: false, description: 'Also replay items whose dedup key was already seen into each target flow. The dedup state is not changed.'}
        flows:
          type: array
          items: {$ref: '#/components/schemas/Slug'}
          description: 'Send new events and re-runs only to these flows. Each must subscribe to the sensor and may be disabled. Default: every enabled flow subscribed to the sensor.'
    PollResult:
      description: The SensorRun of the poll plus what the poll started.
      allOf:
        - $ref: '#/components/schemas/SensorRun'
        - type: object
          required: [new_events, rerun_events, flow_run_ids]
          properties:
            new_events: {type: integer, minimum: 0, description: 'Items that became events (and live runs).'}
            rerun_events: {type: integer, minimum: 0, description: 'Already-seen items replayed into at least one flow (`rerun_seen`).'}
            flow_run_ids:
              type: array
              items: {$ref: '#/components/schemas/Ulid'}
              description: 'Every flow run the poll created: live runs of new events, then replay runs.'
    SensorResetRequest:
      type: object
      additionalProperties: false
      properties:
        run: {type: boolean, default: false, description: 'Run the sensor now right after the reset (a manual poll: it never baselines).'}
        rerun_flows:
          type: array
          items: {$ref: '#/components/schemas/Slug'}
          description: 'With `run`: send the run''s events only to these flows (as `flows` of the poll endpoint).'
    SensorResetResult:
      type: object
      required: [sensor_id, reset_at, reset_by, keys_cleared, run]
      properties:
        sensor_id: {$ref: '#/components/schemas/Slug'}
        reset_at: {$ref: '#/components/schemas/Timestamp'}
        reset_by: {type: string, description: Principal that reset the sensor.}
        keys_cleared: {type: integer, minimum: 0, description: Number of dedup keys that were forgotten.}
        run:
          oneOf: [{$ref: '#/components/schemas/PollResult'}, {type: 'null'}]
          description: 'The poll started by `run: true`; null otherwise.'
    FlowRunNowRequest:
      type: object
      additionalProperties: false
      properties:
        rerun_seen: {type: boolean, default: false, description: 'Also replay items whose dedup key was already seen into the flow.'}
    FlowRunNowSensorResult:
      type: object
      required: [sensor_id, run, new_events, rerun_events, flow_run_ids, error]
      properties:
        sensor_id: {$ref: '#/components/schemas/Slug'}
        run: {oneOf: [{$ref: '#/components/schemas/SensorRun'}, {type: 'null'}], description: 'The sensor run; null when the poll could not be started.'}
        new_events: {type: integer, minimum: 0}
        rerun_events: {type: integer, minimum: 0}
        flow_run_ids: {type: array, items: {$ref: '#/components/schemas/Ulid'}}
        error: {type: [string, 'null'], description: 'Why the poll could not be started (sensor missing or invalid, or a poll of it already running).'}
    FlowRunNowResult:
      type: object
      required: [flow_id, sensors, flow_run_ids]
      properties:
        flow_id: {$ref: '#/components/schemas/Slug'}
        sensors: {type: array, items: {$ref: '#/components/schemas/FlowRunNowSensorResult'}, description: 'One per subscribed sensor, in the flow''s subscribe order.'}
        flow_run_ids: {type: array, items: {$ref: '#/components/schemas/Ulid'}, description: 'Every flow run created, in sensor order.'}
    ReplayRequest:
      type: object
      additionalProperties: false
      required: [flow]
      properties:
        flow: {$ref: '#/components/schemas/Slug'}
        dry_run: {type: boolean, description: 'Overrides the flow''s `dry_run` for this run; absent keeps the flow''s setting.'}
    FlowRun:
      type: object
      required: [id, flow_id, flow_hash, event_id, kind, replay_of, dry_run, status, error, cancelled_by, created_at, started_at, ended_at, continuation]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        flow_id: {$ref: '#/components/schemas/Slug'}
        flow_hash: {$ref: '#/components/schemas/Hash'}
        event_id: {$ref: '#/components/schemas/NullableUlid'}
        kind: {$ref: '#/components/schemas/FlowRunKind'}
        replay_of: {$ref: '#/components/schemas/NullableUlid'}
        dry_run: {type: boolean}
        status: {$ref: '#/components/schemas/FlowRunStatus'}
        error: {type: [string, 'null']}
        cancelled_by: {type: [string, 'null'], description: 'Principal that removed the run from the queue; null unless `status` is `cancelled`.'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        continuation:
          oneOf:
            - {$ref: '#/components/schemas/FlowRunContinuation'}
            - {type: 'null'}
          description: Where a run of kind `continuation` came from; null for the other kinds.
    FlowRunContinuation:
      type: object
      required: [of_run_id, conversation_id, node_id, port, approval_id]
      description: The link of a continuation run. The original run is not changed; the link is only on the continuation run.
      properties:
        of_run_id: {$ref: '#/components/schemas/Ulid'}
        conversation_id: {$ref: '#/components/schemas/Ulid'}
        node_id: {type: string, description: The agent node that was emitted from.}
        port: {type: string, description: The port that was emitted on (`out` for a node without declared ports).}
        approval_id: {$ref: '#/components/schemas/NullableUlid'}
    Queue:
      type: object
      required: [items, total, waiting_for_flow_slot, waiting_for_agent_slot, waiting_for_command_slot, limits]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/QueueItem'}}
        total: {type: integer, minimum: 0}
        waiting_for_flow_slot: {type: integer, minimum: 0}
        waiting_for_agent_slot: {type: integer, minimum: 0}
        waiting_for_command_slot: {type: integer, minimum: 0}
        limits: {$ref: '#/components/schemas/QueueLimits'}
    QueueItem:
      type: object
      required: [flow_run, position, waiting_for, queued_at, waiting_node_ids]
      properties:
        flow_run: {$ref: '#/components/schemas/FlowRun'}
        position: {type: integer, minimum: 1, description: 'Place in the list, 1 first.'}
        waiting_for:
          type: string
          enum: [flow_slot, agent_slot, command_slot, kill_switch]
          description: 'What the run waits for. `kill_switch` while the daemon is paused.'
        queued_at: {$ref: '#/components/schemas/Timestamp'}
        waiting_node_ids: {type: array, items: {type: string}, description: 'Nodes waiting for an agent or command slot; empty for a run that has not started.'}
    QueueLimits:
      type: object
      required: [max_agent_runs, max_command_runs, agent_runs_in_use, command_runs_in_use, flows]
      properties:
        max_agent_runs: {type: integer, minimum: 0}
        max_command_runs: {type: integer, minimum: 0}
        agent_runs_in_use: {type: integer, minimum: 0}
        command_runs_in_use: {type: integer, minimum: 0}
        flows:
          type: array
          description: 'Per-flow `max_concurrent` and running count, for the flows that have queued runs.'
          items:
            type: object
            required: [flow_id, max_concurrent, running]
            properties:
              flow_id: {$ref: '#/components/schemas/Slug'}
              max_concurrent: {type: integer, minimum: 0}
              running: {type: integer, minimum: 0}
    ClearQueueRequest:
      type: object
      additionalProperties: false
      properties:
        flow_id: {$ref: '#/components/schemas/Slug'}
    ClearQueueResult:
      type: object
      required: [cancelled, flow_run_ids]
      properties:
        cancelled: {type: integer, minimum: 0}
        flow_run_ids: {type: array, items: {$ref: '#/components/schemas/Ulid'}}
    FlowRunList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FlowRun'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    NodeRun:
      type: object
      required: [id, flow_run_id, node_id, node_type, parent_node_run_id, status, decision, reason, error, ports, emitted_count, node, argv, env_keys, stdin, stdout, stderr, exit_code, duration_ms, created_at, started_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        flow_run_id: {$ref: '#/components/schemas/Ulid'}
        node_id: {$ref: '#/components/schemas/Slug'}
        node_type: {$ref: '#/components/schemas/NodeType'}
        parent_node_run_id: {$ref: '#/components/schemas/NullableUlid'}
        status: {$ref: '#/components/schemas/NodeRunStatus'}
        decision: {oneOf: [{$ref: '#/components/schemas/NodeRunDecision'}, {type: 'null'}], description: Null until the node run has finished.}
        reason: {type: [string, 'null'], description: '`_reason` from the output, a skip reason such as `dry_run`, or an error summary.'}
        error: {type: [string, 'null'], description: 'Error class: `timeout`, `exit_nonzero`, `undeclared_port`, `invalid_output`, `killed`, `interrupted`, `approval_timeout`, `denied`, and for agent nodes also `no_output`, `spawn_failed`, `agent_exit`, `agent_error`, `mode_unavailable`, `model_rejected`, `policy_rejected`, `empty_proposal`.'}
        ports: {type: array, items: {type: string}, description: Distinct ports the node emitted on. Empty when dropped.}
        emitted_count: {type: integer, minimum: 0, description: Number of payloads emitted.}
        node: {$ref: '#/components/schemas/Node'}
        argv: {type: [array, 'null'], items: {type: string}, description: Exact command line with secrets redacted.}
        script: {type: string, description: 'The script the process ran, secrets redacted. For a transform node this is the compiled jq, so the trace shows what ran. Omitted when the node ran no script.'}
        env_keys: {type: array, items: {type: string}, description: Names of the environment variables injected; values are never stored.}
        stdin: {$ref: '#/components/schemas/TextBlob'}
        stdout: {$ref: '#/components/schemas/TextBlob'}
        stderr: {$ref: '#/components/schemas/TextBlob'}
        exit_code: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null'], minimum: 0}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
    NodeRunDetail:
      allOf:
        - {$ref: '#/components/schemas/NodeRun'}
        - type: object
          required: [agent_runs]
          properties:
            agent_runs: {type: array, items: {$ref: '#/components/schemas/AgentRun'}, description: 'Agent runs behind an agent node, one per phase, in order. Empty for other nodes.'}
    FlowRunDetail:
      type: object
      required: [flow_run, node_runs]
      properties:
        flow_run: {$ref: '#/components/schemas/FlowRun'}
        node_runs: {type: array, items: {$ref: '#/components/schemas/NodeRun'}, description: 'In creation order. Use `parent_node_run_id` to rebuild the tree.'}
    AgentRun:
      type: object
      required: [id, node_run_id, flow_run_id, flow_id, node_id, assist_session_id, runtime, agent_info, capabilities, mode, approve_style, policy, phase, session_id, resumed_via, resume_fallback, cwd, rendered_prompt, argv, status, stop_reason, final_message, result, output, emissions, parse_error, error, raw_blob, raw_size, created_at, started_at, ended_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        node_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Null for a turn of an assist session.'}
        flow_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Null for a turn of an assist session.'}
        flow_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Null for a turn of an assist session.'}
        node_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Null for a turn of an assist session.'}
        assist_session_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Set when the run is one turn of an assist session (mode `approve`, style `per_tool`, policy `gated`, phase `execute`).'}
        runtime: {$ref: '#/components/schemas/Slug'}
        agent_info: {oneOf: [{$ref: '#/components/schemas/AgentInfo'}, {type: 'null'}], description: 'Null until `initialize` completed.'}
        capabilities: {$ref: '#/components/schemas/JsonValue'}
        mode: {$ref: '#/components/schemas/AgentMode'}
        approve_style: {oneOf: [{$ref: '#/components/schemas/ApproveStyle'}, {type: 'null'}], description: 'Set for mode `approve` only.'}
        policy: {$ref: '#/components/schemas/PermissionPolicy'}
        phase: {$ref: '#/components/schemas/AgentRunPhase'}
        session_id: {type: [string, 'null']}
        resumed_via: {oneOf: [{$ref: '#/components/schemas/ResumedVia'}, {type: 'null'}], description: 'Set on the `execute` phase of a proposal run.'}
        resume_fallback: {type: [string, 'null'], description: 'Why `session/load` was not used when `resumed_via` is `new_session`.'}
        cwd: {type: [string, 'null'], description: Resolved working directory.}
        rendered_prompt: {type: string}
        argv: {type: array, items: {type: string}}
        status: {$ref: '#/components/schemas/AgentRunStatus'}
        stop_reason: {type: [string, 'null'], description: 'ACP `stopReason`.'}
        final_message: {type: [string, 'null'], description: Text of the agent's final message.}
        result: {oneOf: [{$ref: '#/components/schemas/StructuredNote'}, {type: 'null'}], description: 'Parsed structured note when the prompt''s `output` is `note` and parsing succeeded.'}
        output: {allOf: [{$ref: '#/components/schemas/JsonValue'}], description: 'The arguments of the valid `submit_output` call (validated against the note schema; agent nodes with `output: note`); null when the run made none.'}
        emissions:
          type: array
          description: 'Valid `emit_<port>` calls of an agent node with `ports`, in call order; with `emit: one` the last one is the node''s output. Empty without ports.'
          items:
            type: object
            additionalProperties: false
            required: [port, output]
            properties:
              port: {type: string}
              output: {$ref: '#/components/schemas/JsonValue'}
        parse_error: {type: boolean, description: The prompt expects a note but the final message did not parse.}
        error: {type: [string, 'null']}
        raw_blob: {$ref: '#/components/schemas/NullableHash'}
        raw_size: {type: integer, minimum: 0, description: Size of the raw JSON-RPC log in bytes.}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        started_at: {$ref: '#/components/schemas/NullableTimestamp'}
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
    AgentRunDetail:
      allOf:
        - {$ref: '#/components/schemas/AgentRun'}
        - type: object
          required: [phase_run_ids, approvals]
          properties:
            phase_run_ids: {type: array, items: {$ref: '#/components/schemas/Ulid'}, description: 'All agent runs of the same node run in phase order, including this one.'}
            approvals: {type: array, items: {$ref: '#/components/schemas/Approval'}}
    AgentRunList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentRun'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    AgentEvent:
      type: object
      required: [agent_run_id, seq, ts, kind, tool_call_id, payload]
      properties:
        agent_run_id: {$ref: '#/components/schemas/Ulid'}
        seq: {type: integer, minimum: 1}
        ts: {$ref: '#/components/schemas/Timestamp'}
        kind:
          type: string
          description: |
            ACP `session/update` kind: `message`, `thought`, `user_message`, `tool_call`, `tool_call_update`, `plan`,
            `mode_update`, `commands_update`, or another value passed through from the agent.
        tool_call_id: {type: [string, 'null']}
        payload: {$ref: '#/components/schemas/JsonValue'}
    AgentEventList:
      type: object
      required: [items, last_seq, has_more]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentEvent'}}
        last_seq: {type: integer, minimum: 0, description: '`seq` of the last event in `items`, or the requested `after_seq` when empty.'}
        has_more: {type: boolean}
    SandboxSession:
      type: object
      description: One sandbox an agent run or a conversation opened. `agent_run_id` is the id the run has or would have (the sandbox is provisioned before the agent run is recorded, and when provisioning fails there is no agent run); for a session of a conversation it is the conversation id. `node_run_id` is the node run of the original run, so the session is pruned with it.
      required: [id, node_run_id, agent_run_id, assist_session_id, backend, status, env_names, truncated, entry_count, started_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        node_run_id: {$ref: '#/components/schemas/Ulid'}
        agent_run_id: {$ref: '#/components/schemas/Ulid'}
        assist_session_id: {type: string, description: 'The chat (assist session) this sandbox belongs to; empty for a sandbox of an agent run. Sessions with this set are listed by the conversation sandbox log only.'}
        backend: {type: string, enum: [local, docker, depot, kubernetes, ssh]}
        status:
          type: string
          enum: [provisioning, ready, failed, closed, interrupted]
          description: '`failed` means provisioning failed (see `error`); `interrupted` means the daemon stopped while the sandbox was open.'
        sandbox_id: {type: string, description: 'Backend id of the sandbox: the Depot sandbox id. Empty when the backend has none.'}
        sandbox_name: {type: string, description: 'Container, pod or host name; the run directory for `local`.'}
        image: {type: string}
        repo: {type: string, description: Clone URL without credentials.}
        ref: {type: string}
        lifecycle: {type: string, enum: [per_run, persistent]}
        workdir: {type: string}
        env_names: {type: array, items: {type: string}, description: 'Names of the environment variables commands see. Values are never recorded.'}
        error: {type: string, description: The backend's message when provisioning failed or the sandbox was interrupted.}
        truncated: {type: boolean, description: The run's log hit its size cap; later entries were dropped or lost their output.}
        entry_count: {type: integer, minimum: 0}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        ready_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}], description: 'Provisioning took `ready_at - started_at`.'}
        ended_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}]}
    SandboxLogEntry:
      type: object
      required: [id, session_id, ts, kind, level, title]
      properties:
        id: {type: integer, minimum: 1, description: 'Increases in insertion order across all sandboxes; the cursor for `after_id`.'}
        session_id: {$ref: '#/components/schemas/Ulid'}
        ts: {$ref: '#/components/schemas/Timestamp'}
        kind:
          type: string
          enum: [lifecycle, exec, fs, denied, backend]
          description: |
            `lifecycle`: provisioning, clone, ready, teardown. `exec`: a command (the `shell` tool, or the script of a custom
            tool that runs in the sandbox). `fs`: `fs_read`, `fs_write`, `fs_list`, `fs_search`. `denied`: a call that was not
            run. `backend`: messages from the backend itself (image pull, pod events).
        level: {type: string, enum: [info, warn, error]}
        title: {type: string, description: One-line summary.}
        tool: {type: string, description: 'The hal tool (`shell`, `fs_write`, a custom tool id).'}
        approval: {type: string, description: 'How the call was allowed (`auto: <reason>`, `approved by user`) or why it was not run (`denied by policy: ...`, `denied by user`, `expired`).'}
        command: {type: string, description: 'The command line; for `fs_search` the pattern.'}
        cwd: {type: string}
        path: {type: string}
        exit_code: {type: integer}
        duration_ms: {type: integer, minimum: 0}
        bytes: {type: integer, minimum: 0, description: 'Size of the file read or written; the number of entries or hits listed.'}
        stdout: {type: string, description: 'Capped to 64 KiB with a marker. Omitted from `sandbox_log.appended` events.'}
        stderr: {type: string, description: 'Capped to 64 KiB with a marker. Omitted from `sandbox_log.appended` events.'}
        timed_out: {type: boolean}
        truncated: {type: boolean, description: The backend cut the output or hal capped it.}
        error: {type: string}
        fields: {type: object, additionalProperties: {type: string}, description: Small details of lifecycle and backend entries.}
    SandboxLog:
      type: object
      required: [sessions, entries, has_more]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/SandboxSession'}}
        entries: {type: array, items: {$ref: '#/components/schemas/SandboxLogEntry'}}
        has_more: {type: boolean}
    SandboxSessionCreatedEvent:
      description: A sandbox started provisioning. `data` is `SandboxSession`; the stream filters `agent_run_id` and `flow_run_id` apply.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [sandbox_session.created]}
            data: {$ref: '#/components/schemas/SandboxSession'}
    SandboxSessionUpdatedEvent:
      description: A sandbox changed status (ready, failed, closed). `data` is `SandboxSession`; the stream filters `agent_run_id` and `flow_run_id` apply.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [sandbox_session.updated]}
            data: {$ref: '#/components/schemas/SandboxSession'}
    SandboxLogAppendedEvent:
      description: |
        A sandbox log entry was added. `data` is `SandboxLogEntry` without `stdout` and `stderr` (fetch `after_id` for the
        content) plus `agent_run_id`, `node_run_id` and `assist_session_id`; the stream filters `agent_run_id`, `assist_session_id` and `flow_run_id` apply.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [sandbox_log.appended]}
            data: {$ref: '#/components/schemas/SandboxLogAppended'}
    SandboxLogAppended:
      description: The `data` of `sandbox_log.appended`.
      allOf:
        - {$ref: '#/components/schemas/SandboxLogEntry'}
        - type: object
          required: [agent_run_id, node_run_id, assist_session_id]
          properties:
            agent_run_id: {$ref: '#/components/schemas/Ulid'}
            node_run_id: {$ref: '#/components/schemas/Ulid'}
            assist_session_id: {type: string}
    PermissionOption:
      type: object
      required: [option_id, name, kind]
      properties:
        option_id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [allow_once, allow_always, reject_once, reject_always]}
    PermissionRequest:
      type: object
      required: [id, agent_run_id, tool_call_id, tool_kind, title, raw_input, options, decision, decided_by, matched_rule, reason, approval_id, requested_at, decided_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        agent_run_id: {$ref: '#/components/schemas/Ulid'}
        tool_call_id: {type: string}
        tool_kind: {type: string, description: 'ACP tool kind: `read`, `edit`, `delete`, `move`, `search`, `execute`, `think`, `fetch`, `switch_mode`, `other`.'}
        title: {type: string}
        raw_input: {$ref: '#/components/schemas/JsonValue'}
        options: {type: array, items: {$ref: '#/components/schemas/PermissionOption'}}
        decision: {oneOf: [{$ref: '#/components/schemas/PermissionDecision'}, {type: 'null'}], description: Null while pending.}
        decided_by: {oneOf: [{$ref: '#/components/schemas/DecidedBy'}, {type: 'null'}]}
        matched_rule: {type: [string, 'null'], description: 'The policy rule that decided, for example `hal:mcp`, `allow.tools[0]: ...` or `lockdown`.'}
        reason: {type: [string, 'null']}
        approval_id: {$ref: '#/components/schemas/NullableUlid'}
        requested_at: {$ref: '#/components/schemas/Timestamp'}
        decided_at: {$ref: '#/components/schemas/NullableTimestamp'}
    PermissionRequestList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PermissionRequest'}}
    Approval:
      type: object
      description: |
        One shape for every approval: a title, a required description, details (fields, command, diffs, markdown), a
        priority, where it came from (`origin`) and the conversation it belongs to. Created only by the engine's
        RaiseApproval, whatever raised it (agent tool call, `request_approval`, proposal, node gate, Request approval
        node, MCP client).
      required: [id, type, status, title, description, description_by, priority, origin, details, editable, edits, conversation, held, held_note, gate, on_timeout, agent_run_id, node_run_id, flow_run_id, flow_id, node_id, assist_session_id, event_id, runtime, permission_request_id, permission_request, proposal_md, comment, cancel_run, decided_by, decided_at, created_at, expires_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        type: {$ref: '#/components/schemas/ApprovalType'}
        status: {$ref: '#/components/schemas/ApprovalStatus'}
        title: {type: string, description: 'One line: what is being asked.'}
        description:
          type: string
          description: Plain text or short markdown, never empty, at most 600 characters. What will happen if approved and why. Written by hal from facts (`description_by` `hal`) or by an agent (`agent`; the card labels it as agent-written and always shows the real command, diff or target beside it).
        description_by: {type: string, enum: [hal, agent]}
        priority: {$ref: '#/components/schemas/Priority'}
        origin: {$ref: '#/components/schemas/ApprovalOrigin'}
        details: {$ref: '#/components/schemas/ApprovalDetails'}
        editable: {type: array, description: 'Paths the approver may edit when approving, with their current values (any JSON).', items: {type: object, required: [key, value], properties: {key: {type: string}, value: {}}}}
        edits: {type: [object, 'null'], description: 'Set once approved with edits: what changed at each path.', additionalProperties: {type: object, required: [before, after], properties: {before: {}, after: {}}}}
        conversation: {oneOf: [{$ref: '#/components/schemas/ApprovalConversation'}, {type: 'null'}], description: 'The conversation on the Chat page the approval was requested in; null for approvals with no agent run (Request approval nodes, node gates, MCP clients).'}
        held: {type: boolean, description: 'The conversation reached `max_steers_per_run` steered denials: this action is held for the user and the agent was told to stop and wait. Steering is not offered.'}
        held_note: {type: [string, 'null']}
        gate: {type: boolean, description: 'The approval a node with `requires_approval` raised before running: approving runs the node, denying emits its input on port `denied`.'}
        on_timeout: {type: [string, 'null'], enum: [denied, approved, error, null], description: 'What expiry does for a Request approval node; null otherwise.'}
        agent_run_id: {$ref: '#/components/schemas/NullableUlid'}
        node_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Null for an approval of an assist session and for an MCP approval.'}
        flow_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Null for an approval of an assist session and for an MCP approval.'}
        flow_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Null for an approval of an assist session and for an MCP approval.'}
        node_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Null for an approval of an assist session and for an MCP approval.'}
        assist_session_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: Set for an approval raised by a chat session turn.}
        event_id: {$ref: '#/components/schemas/NullableUlid'}
        runtime: {$ref: '#/components/schemas/Slug'}
        permission_request_id: {$ref: '#/components/schemas/NullableUlid'}
        permission_request: {oneOf: [{$ref: '#/components/schemas/PermissionRequest'}, {type: 'null'}], description: 'Embedded for `tool_call` approvals (raw input, options).'}
        proposal_md: {type: [string, 'null'], description: 'Set for `proposal` approvals: the agent''s full proposal. `description` is its summary line.'}
        comment: {type: [string, 'null'], description: 'The approver''s additional steering text. A denial with a comment is a steered denial; see docs/flows.md.'}
        cancel_run: {type: [boolean, 'null'], description: 'For a denied `tool_call`, whether the run was cancelled (Deny + stop).'}
        decided_by: {type: [string, 'null'], description: 'Principal that decided; null for `expired`.'}
        decided_at: {$ref: '#/components/schemas/NullableTimestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/NullableTimestamp'}
    ApprovalOrigin:
      type: object
      required: [kind, label, client]
      properties:
        kind: {type: string, enum: [flow, chat, continued_chat, mcp], description: '`flow`: a node or agent run of a flow. `chat`: a chat (assist) session. `continued_chat`: a chat continued from a flow agent run. `mcp`: an external MCP client.'}
        label: {type: string, description: 'Human label, for example `reviews / triage`, `Chat: <title>` or `MCP: claude-code`; may name the sandbox.'}
        client: {type: [string, 'null'], description: 'Name of the MCP client for kind `mcp`.'}
    ApprovalDetails:
      type: object
      description: What will actually happen, as hal knows it. Always shown next to the description.
      required: [body_md, fields, command, tool, diffs, dry_run]
      properties:
        body_md: {type: string, description: 'Markdown. In a dry run the first line says so.'}
        fields: {type: array, items: {type: object, required: [key, value], properties: {key: {type: string}, value: {type: string}}}}
        command: {type: [string, 'null'], description: 'The shell command or tool-call explanation (extracted from nested arguments), not raw JSON.'}
        tool: {type: [string, 'null'], description: 'Tool name or kind for a tool call.'}
        diffs: {type: array, items: {type: object, required: [path, old, new], properties: {path: {type: [string, 'null']}, old: {type: [string, 'null']}, new: {type: string}}}}
        dry_run: {type: boolean, description: 'The approval belongs to a dry run: deciding only exercises the flow''s branches.'}
    ApprovalConversation:
      type: object
      required: [id, kind, anchor, path]
      properties:
        id: {type: string, description: 'Chat session id (kind `chat`) or agent run id (kind `flow`).'}
        kind: {type: string, enum: [chat, flow]}
        anchor: {type: [string, 'null'], description: 'Message id of the point where the approval was requested.'}
        path: {type: string, description: 'UI path: `/chat/<id>?message=<anchor>`.'}
    ApprovalList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string}
        edits: {type: object, description: '`request` approvals only: new values (any JSON) for paths the node declares `editable`. 422 for any other approval or path. Ignored by deny.', additionalProperties: {}}
    DenyRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, description: 'Additional steering. The agent gets it verbatim: a denied tool call or `request_approval` returns `Denied by the user: "<text>". Do not retry the same action unchanged; do what the user asked instead.`, a denied proposal is revised and proposed again with it, a denied node gate or Request approval node continues on port `denied` with it in `approval.comment`.'}
        edits: {description: 'Accepted and ignored: a denial never applies edits.'}
        cancel_run: {type: boolean, default: false, description: '`tool_call` only (Deny + stop): cancel the run instead of letting the agent continue.'}
    InboxItem:
      type: object
      required: [id, source, source_id, flow_run_id, node_run_id, agent_run_id, flow_id, node_id, event_id, title, priority, summary_md, suggested_reply, links, read, starred, archived, dry_run, parse_error, created_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        source: {type: string, enum: [agent_run, node_run, mcp], description: '`mcp` is a note an external MCP client posted with `send_note` (`docs/mcp.md`): no run ids, `flow_id` is `mcp`, `node_id` `send_note`.'}
        source_id: {type: string, pattern: '^([0-9A-HJKMNP-TV-Z]{26})?$', description: 'ULID of the node run or agent run; empty for source `mcp`.'}
        flow_run_id: {type: string, pattern: '^([0-9A-HJKMNP-TV-Z]{26})?$', description: 'Empty for source `mcp`.'}
        node_run_id: {type: string, pattern: '^([0-9A-HJKMNP-TV-Z]{26})?$', description: 'Empty for source `mcp`.'}
        agent_run_id: {$ref: '#/components/schemas/NullableUlid'}
        flow_id: {$ref: '#/components/schemas/Slug'}
        node_id: {$ref: '#/components/schemas/Slug'}
        event_id: {$ref: '#/components/schemas/NullableUlid'}
        title: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        summary_md: {type: string}
        suggested_reply: {type: [string, 'null']}
        links: {type: array, items: {$ref: '#/components/schemas/NoteLink'}}
        read: {type: boolean}
        starred: {type: boolean}
        archived: {type: boolean}
        dry_run: {type: boolean, description: 'Tagged `dry-run` in the UI.'}
        parse_error: {type: boolean, description: 'The note could not be parsed; `summary_md` holds the raw final message.'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        client: {type: [string, 'null'], description: 'Name of the external MCP client of a note with source `mcp`.'}
        thread_key: {type: [string, 'null'], description: 'Grouping key the MCP client passed with the note.'}
    NotifyVia:
      type: string
      enum: [auto, app, terminal-notifier, none]
      description: |
        Where notifications go. `auto` (default): the macOS app when at least one is connected as a sink, otherwise
        terminal-notifier. `app`: never terminal-notifier. `terminal-notifier`: always. `none`: logged only.
    UpdateChannel:
      type: string
      enum: [stable, beta]
      description: Release channel the macOS app updates from. Every main build is published to both; `beta` is where builds may be staged ahead of `stable`.
    Notification:
      type: object
      description: A rendered notification as logged and as sent in `notification.created`.
      required: [id, kind, flow_id, title, subtitle, body, priority, dry_run, thread_id, url, item_id, approval_id, approval_type, editable, created_at, channel, status, error]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        kind: {type: string, enum: [note, proposal, tool_call, request]}
        flow_id: {type: string, description: 'Flow that raised it; `assistant` for a sensor assistant turn.'}
        title: {type: string, description: The flow id.}
        subtitle: {type: string, description: 'The note title, `Approval: ...`, `Tool call: <tool> <args>` or `Request: <title>`; prefixed `[dry run] ` for dry runs.'}
        body: {type: string, description: 'First one or two lines of the summary, proposal or request body, markdown removed, at most 200 characters.'}
        priority: {$ref: '#/components/schemas/Priority'}
        dry_run: {type: boolean}
        thread_id: {type: string, description: Groups notifications; the flow id.}
        url: {type: string, description: 'Deep link into the UI: `/inbox/<id>` or `/inbox/approval/<id>`.'}
        item_id: {type: string, description: Inbox item id (kind `note`); empty otherwise.}
        approval_id: {type: string, description: Approval id (other kinds); empty for notes.}
        approval_type: {type: string, enum: ['', proposal, tool_call, request]}
        editable: {type: boolean, description: True for a request approval with editable fields.}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        channel: {type: string, enum: [app, terminal-notifier, none], description: The channel the daemon routed it to.}
        status: {type: string, enum: [sent, no_sink, failed, logged], description: '`no_sink`: channel `app` but no app was connected.'}
        error: {type: string, description: Delivery error when `status` is `failed`.}
    NotificationList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Notification'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    InboxList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InboxItem'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    InboxBulkFilter:
      type: object
      additionalProperties: false
      properties:
        read: {type: boolean}
        starred: {type: boolean}
        archived: {type: string, enum: ['true', 'false', any]}
        priority: {$ref: '#/components/schemas/Priority'}
        max_priority: {$ref: '#/components/schemas/Priority'}
        dry_run: {type: boolean, description: Only items of dry-run flows.}
        flow_id: {$ref: '#/components/schemas/Slug'}
        older_than: {type: string, description: 'A duration (`7d`, `36h`) or an RFC 3339 time. Matches items created before it.'}
        q: {type: string, minLength: 1}
    InboxBulkRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [archive, unarchive, mark_read, mark_unread, delete]}
        ids:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/Ulid'}
        filter: {$ref: '#/components/schemas/InboxBulkFilter'}
        include_starred: {type: boolean, default: false}
        dry_run: {type: boolean, default: false, description: Count only; change nothing.}
    InboxBulkResult:
      type: object
      required: [matched, changed, skipped_starred, skipped_not_archived, changed_ids]
      properties:
        matched: {type: integer, minimum: 0}
        changed: {type: integer, minimum: 0}
        skipped_starred: {type: integer, minimum: 0}
        skipped_not_archived: {type: integer, minimum: 0}
        changed_ids: {type: array, items: {$ref: '#/components/schemas/Ulid'}}
    InboxPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        read: {type: boolean}
        starred: {type: boolean}
        archived: {type: boolean}
    # ---------------------------------------------------------------- auth (shapes follow internal/auth)
    Principal:
      type: object
      required: [name]
      properties:
        name: {type: string, description: 'Identity: a Tailscale login, `localhost`, or `owner` for password and passkey logins.'}
    PublicModuleTrace:
      type: object
      description: Module result shown to the caller. Reasons are omitted because they can reveal configuration.
      required: [module, result]
      properties:
        module: {type: string}
        result: {$ref: '#/components/schemas/ModuleResultCode'}
    ModuleTrace:
      type: object
      required: [module, control, result]
      properties:
        module: {type: string}
        control: {$ref: '#/components/schemas/ModuleControl'}
        result: {$ref: '#/components/schemas/ModuleResultCode'}
        reason: {type: string}
    AuthBeginRequest:
      type: object
      description: '`method` selects a module; the other members are module inputs such as `password`.'
      properties:
        method: {type: string, examples: [password]}
        password: {type: string, writeOnly: true}
      additionalProperties: true
    AuthContinueRequest:
      type: object
      additionalProperties: false
      required: [login_id]
      properties:
        login_id: {type: string}
        response: {$ref: '#/components/schemas/JsonValue'}
    AuthSessionView:
      type: object
      required: [id, expires_at, services]
      properties:
        id: {type: string}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        services: {type: array, items: {$ref: '#/components/schemas/AuthService'}}
    AuthSuccess:
      type: object
      required: [status, service, principal, modules, services, session]
      properties:
        status: {type: string, enum: [success]}
        service: {$ref: '#/components/schemas/AuthService'}
        principal: {$ref: '#/components/schemas/Principal'}
        modules: {type: array, items: {type: string}, description: Modules that succeeded.}
        services: {type: array, items: {$ref: '#/components/schemas/AuthService'}, description: Services the session grants.}
        session: {$ref: '#/components/schemas/AuthSessionView'}
        trace: {type: array, items: {$ref: '#/components/schemas/PublicModuleTrace'}}
        already_authenticated: {type: boolean}
    AuthChallenge:
      type: object
      required: [status, service, login_id, module, step, methods]
      properties:
        status: {type: string, enum: [challenge]}
        service: {$ref: '#/components/schemas/AuthService'}
        login_id: {type: string, description: 'Pass to `/continue`.'}
        module: {type: string, description: Module that is waiting for input.}
        step:
          type: object
          required: [kind]
          properties:
            kind: {type: string, description: 'What to send back, for example `password` or `webauthn.assertion`.'}
            data: {$ref: '#/components/schemas/JsonValue'}
        methods: {type: array, items: {type: string}, description: Interactive modules of the service's stack.}
        trace: {type: array, items: {$ref: '#/components/schemas/PublicModuleTrace'}}
    AuthResult:
      oneOf:
        - {$ref: '#/components/schemas/AuthSuccess'}
        - {$ref: '#/components/schemas/AuthChallenge'}
      discriminator:
        propertyName: status
        mapping:
          success: '#/components/schemas/AuthSuccess'
          challenge: '#/components/schemas/AuthChallenge'
    WhoAmI:
      type: object
      required: [authenticated]
      properties:
        authenticated: {type: boolean}
        source: {type: string, enum: [session, stack], description: 'Absent when not authenticated.'}
        principal: {$ref: '#/components/schemas/Principal'}
        modules: {type: array, items: {type: string}}
        services: {type: array, items: {$ref: '#/components/schemas/AuthService'}}
        session: {$ref: '#/components/schemas/AuthSessionView'}
    Session:
      type: object
      required: [id, principal, modules, services, created_at, last_seen_at, expires_at]
      properties:
        id: {type: string}
        principal: {type: string}
        modules: {type: array, items: {type: string}}
        services: {type: array, items: {$ref: '#/components/schemas/AuthService'}}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_seen_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/Timestamp'}
        host: {type: string}
        remote_addr: {type: string}
    SessionList:
      type: object
      required: [sessions, current]
      properties:
        sessions: {type: array, items: {$ref: '#/components/schemas/Session'}}
        current: {type: string, description: Id of the caller's own session; empty when the caller has none.}
    RevokeResult:
      type: object
      required: [revoked]
      properties:
        revoked: {type: boolean}
    RevokeCount:
      type: object
      required: [revoked]
      properties:
        revoked: {type: integer, minimum: 0}
    AuthEvent:
      type: object
      required: [id, ts, action, endpoint, outcome, remote_addr, host]
      properties:
        id: {type: string}
        ts: {$ref: '#/components/schemas/Timestamp'}
        action:
          type: string
          description: '`request`, `whoami`, `login_begin`, `login_continue`, `logout`, `session_revoke`, `session_revoke_all`, `webauthn_register`, `webauthn_delete`, `auth_methods_change`, `auth_password_set`, `auth_password_change`, `auth_password_remove`, `auth_logins_change`, `auth_stacks_change`. The auth_* actions are admin changes of the sign-in configuration (`reason` says what changed; a rejected current password logs outcome `fail`).'
        service: {$ref: '#/components/schemas/AuthService'}
        endpoint: {type: string, examples: ['GET /api/flows']}
        modules: {type: array, items: {$ref: '#/components/schemas/ModuleTrace'}}
        outcome: {$ref: '#/components/schemas/AuthOutcome'}
        reason: {type: string}
        principal: {type: string}
        remote_addr: {type: string}
        host: {type: string}
        session_id: {type: string}
    AuthEventList:
      type: object
      required: [events]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/AuthEvent'}}
    AuthMethodId: {type: string, enum: [localhost, tailscale, passkeys, password], description: 'Ways in: `localhost` = module `localhost-trust`, `tailscale` = `tailscale-identity`, `passkeys` = `webauthn`, `password` = `password`.'}
    AuthMethodState: {type: string, enum: [on, off, attention]}
    AuthMethod:
      type: object
      required: [id, module, name, state, enabled, toggleable, custom, detail]
      properties:
        id: {$ref: '#/components/schemas/AuthMethodId'}
        module: {type: string, examples: [tailscale-identity]}
        name: {type: string, description: 'Label for the UI: On this Mac, From your tailnet, Passkeys, Password.', examples: [From your tailnet]}
        state: {$ref: '#/components/schemas/AuthMethodState'}
        enabled: {type: boolean, description: 'The module is in the stack of at least one service.'}
        toggleable: {type: boolean, description: 'False for `localhost`.'}
        custom: {type: boolean, description: 'The stacks do not have the plain shape (the module is in some of the stacks the services use but not all, or with a control other than `sufficient`); switching it rewrites every stack as described at `PATCH /api/auth/methods`. The Advanced editor shows the details.'}
        detail: {type: string, description: 'One line for the row: why it is on, off, or needs attention.'}
    AuthCurrent:
      type: object
      required: [method, modules, remote, source, principal, session_id]
      description: How this request was admitted (to the `admin` service).
      properties:
        method: {oneOf: [{$ref: '#/components/schemas/AuthMethodId'}, {type: 'null'}], description: 'The method of the first module that admitted it; null when unknown.'}
        modules: {type: array, items: {type: string}}
        remote: {type: boolean, description: 'The request does not pass the `localhost-trust` conditions (it came over the tailnet or a proxy).'}
        source: {type: string, enum: [session, stack]}
        principal: {type: string}
        session_id: {type: [string, 'null']}
    PasswordStatus:
      type: object
      required: [set, enabled, last_used_at]
      properties:
        set: {type: boolean, description: 'A password hash is stored.'}
        enabled: {type: boolean, description: 'The `password` module is in the stacks.'}
        last_used_at: {oneOf: [{$ref: '#/components/schemas/Timestamp'}, {type: 'null'}], description: 'Last successful password sign-in found in the auth events; null if none.'}
    AuthOverview:
      type: object
      required: [methods, current, password, passkey_count, allowed_logins]
      properties:
        methods: {type: array, items: {$ref: '#/components/schemas/AuthMethod'}, description: 'In the order localhost, tailscale, passkeys, password.'}
        current: {$ref: '#/components/schemas/AuthCurrent'}
        password: {$ref: '#/components/schemas/PasswordStatus'}
        passkey_count: {type: integer, minimum: 0}
        allowed_logins: {type: array, items: {type: string}, description: '`allowed_logins` as configured; empty means the Mac''s owner only.'}
    AuthChangeResult:
      type: object
      required: [overview, ended_sessions, notice]
      properties:
        overview: {$ref: '#/components/schemas/AuthOverview'}
        ended_sessions: {type: integer, minimum: 0, description: 'Sessions the change ended (the caller''s own included, when confirmed).'}
        notice: {type: [string, 'null'], description: 'Human sentence about what the change ended, for the UI.'}
    AuthMethodsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        tailscale: {type: boolean}
        passkeys: {type: boolean}
        password: {type: boolean}
        confirm: {type: boolean, description: 'Acknowledge a `confirmation-required` answer.'}
    AuthPasswordSetRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        current_password: {type: string, writeOnly: true, description: 'Required when a password is already set.'}
    AuthPasswordRemoveRequest:
      type: object
      additionalProperties: false
      properties:
        current_password: {type: string, writeOnly: true}
        confirm: {type: boolean}
    AuthAllowedLoginsRequest:
      type: object
      additionalProperties: false
      required: [logins]
      properties:
        logins: {type: array, maxItems: 100, items: {type: string, maxLength: 254, examples: [alice@example.com]}}
        confirm: {type: boolean}
    AuthStackMap:
      type: object
      description: Named ordered module stacks.
      additionalProperties:
        type: array
        items: {$ref: '#/components/schemas/AuthModuleEntry'}
    AuthServiceMap:
      type: object
      additionalProperties: false
      required: [ui, api, approve, admin]
      description: Which stack guards each service.
      properties:
        ui: {type: string}
        api: {type: string}
        approve: {type: string}
        admin: {type: string}
    AuthStacks:
      type: object
      required: [stacks, services, hash]
      properties:
        stacks: {$ref: '#/components/schemas/AuthStackMap'}
        services: {$ref: '#/components/schemas/AuthServiceMap'}
        hash: {$ref: '#/components/schemas/Hash'}
    AuthStacksRequest:
      type: object
      additionalProperties: false
      required: [stacks, services]
      properties:
        stacks: {$ref: '#/components/schemas/AuthStackMap'}
        services: {$ref: '#/components/schemas/AuthServiceMap'}
        expected_hash: {$ref: '#/components/schemas/Hash'}
        confirm: {type: boolean}
    AuthStacksPreviewRequest:
      type: object
      additionalProperties: false
      required: [stacks, services]
      properties:
        stacks: {$ref: '#/components/schemas/AuthStackMap'}
        services: {$ref: '#/components/schemas/AuthServiceMap'}
    AuthStacksPreview:
      type: object
      required: [valid, diagnostics, changed, confirm_required, reasons, ends_session, before, after]
      properties:
        valid: {type: boolean, description: 'No error diagnostics: the change could be written (after confirmation, when required).'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}, description: 'Validator findings, and the blocking `localhost_trust_required` when any request (local or remote) would remove `localhost-trust`.'}
        changed: {type: boolean}
        confirm_required: {type: boolean}
        reasons: {type: array, items: {type: string}}
        ends_session: {type: boolean}
        before: {type: string, description: 'The `auth:` section as YAML, secrets redacted.'}
        after: {type: string}
    Passkey:
      type: object
      required: [id, rp_id, sign_count, label, created_at]
      properties:
        id: {type: string, description: Base64url credential id.}
        rp_id: {type: string, description: 'Relying-party ID: `localhost` or a Tailscale hostname.'}
        sign_count: {type: integer, minimum: 0}
        label: {type: string}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_used_at: {$ref: '#/components/schemas/Timestamp'}
    PasskeyList:
      type: object
      required: [credentials]
      properties:
        credentials: {type: array, items: {$ref: '#/components/schemas/Passkey'}}
    PasskeyRegisterBeginRequest:
      type: object
      additionalProperties: false
      properties:
        label: {type: string}
    PasskeyRegisterBegin:
      type: object
      required: [registration_id, options]
      properties:
        registration_id: {type: string}
        options: {type: object, additionalProperties: true, description: 'WebAuthn `PublicKeyCredentialCreationOptions` for `navigator.credentials.create`.'}
    PasskeyRegisterFinishRequest:
      type: object
      additionalProperties: false
      required: [registration_id, credential]
      properties:
        registration_id: {type: string}
        credential: {type: object, additionalProperties: true, description: 'The `PublicKeyCredential` (attestation) JSON from the browser.'}
    TailscaleServeRequest:
      type: object
      additionalProperties: false
      properties:
        https_port: {type: integer, minimum: 1, maximum: 65535, description: 'The tailnet HTTPS port. Default: `tailscale.https_port` of the config (443).'}
        replace: {type: boolean, default: false, description: Overwrite what the HTTPS port serves now when it is not hal9001.}
    TailscaleWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable identifier of the problem.
          enum: [cli_not_found, daemon_unreachable, logged_out, stopped, needs_machine_auth, https_disabled, magicdns_disabled, funnel_enabled, funnel_on_port, port_conflict, serve_missing, host_missing, host_renamed, reapply_failed]
        message: {type: string}
        command: {type: [string, 'null'], description: 'A command that fixes it, to copy into a terminal.'}
        url: {type: [string, 'null'], description: A page that fixes it (for example the admin console).}
    TailscaleCLI:
      type: object
      required: [found, path, version]
      properties:
        found: {type: boolean}
        path: {type: [string, 'null'], description: The `tailscale` executable hal9001 uses.}
        version: {type: [string, 'null']}
    TailscaleServe:
      type: object
      required: [enabled, https_port, target, active, points_at_hal, conflict, funnel, funnel_on_port]
      properties:
        enabled: {type: boolean, description: '`tailscale.serve` in `config.yaml`: hal9001 keeps the mapping in place.'}
        https_port: {type: integer, description: The tailnet HTTPS port hal9001 uses or would use.}
        target: {type: string, description: 'What hal9001 maps the port to, `http://127.0.0.1:<daemon port>`.'}
        active: {type: boolean, description: The HTTPS port has a mapping now (to anything).}
        points_at_hal: {type: boolean, description: The mapping of the port proxies to the daemon.}
        conflict: {type: [string, 'null'], description: 'What the port serves when it is not hal9001 (a proxy target or a description), else null.'}
        funnel: {type: boolean, description: Anything of this Mac is exposed to the internet through funnel. hal9001 never does this.}
        funnel_on_port: {type: boolean, description: 'Funnel exposes the HTTPS port (`https_port`) to the public internet. hal9001 refuses to share on it (`POST /api/tailscale/serve` is a 409) until funnel is turned off there.'}
    TailscaleAllowedHost:
      type: object
      required: [entry, present, added_by_hal]
      properties:
        entry: {type: [string, 'null'], description: 'The `allowed_hosts` entry that matches the URL (`<name>` or `<name>:<port>`); null without a MagicDNS name.'}
        present: {type: boolean}
        added_by_hal: {type: boolean, description: hal9001 added it when it enabled sharing; disabling removes it.}
    TailscaleStatus:
      type: object
      required: [cli, backend_state, logged_in, dns_name, tailnet, owner_login, https_enabled, magic_dns_enabled, serve, url, allowed_host, allowed_logins, warnings, error, checked_at]
      properties:
        cli: {$ref: '#/components/schemas/TailscaleCLI'}
        backend_state: {type: [string, 'null'], description: 'tailscaled state: `Running`, `NeedsLogin`, `Stopped`, `NeedsMachineAuth`, ...; null when it cannot be read.', examples: [Running]}
        logged_in: {type: boolean, description: Signed in and running.}
        dns_name: {type: [string, 'null'], description: 'This Mac''s MagicDNS name without the trailing dot, e.g. `hal-mac.example-tailnet.ts.net`.'}
        tailnet: {type: [string, 'null']}
        owner_login: {type: [string, 'null'], description: The login that owns this Mac.}
        https_enabled: {type: boolean, description: 'HTTPS certificates are enabled for the tailnet (`tailscale serve` over HTTPS needs them).'}
        magic_dns_enabled: {type: boolean}
        serve: {$ref: '#/components/schemas/TailscaleServe'}
        url: {type: [string, 'null'], description: 'Where this Mac answers on the tailnet when shared: `https://<dns_name>[:<port>]/`. Set whenever the name is known.'}
        allowed_host: {$ref: '#/components/schemas/TailscaleAllowedHost'}
        allowed_logins: {type: array, items: {type: string}, description: 'Logins `tailscale-identity` accepts: `allowed_logins` or, when empty, `owner_login`.'}
        warnings: {type: array, items: {$ref: '#/components/schemas/TailscaleWarning'}}
        error: {type: [string, 'null'], description: 'Why Tailscale could not be read (CLI missing, tailscaled unreachable).'}
        checked_at: {type: string, format: date-time}
    TailscaleConfig:
      type: object
      additionalProperties: false
      description: What hal9001 keeps in place for `tailscale serve` (see `POST /api/tailscale/serve`).
      properties:
        serve: {type: boolean, default: false}
        https_port: {type: integer, minimum: 1, maximum: 65535, default: 443}
    # ---------------------------------------------------------------- assist (AI-assisted sensor authoring)
    AssistTargetKind:
      type: string
      description: |
        What the session works on. `sensor`, `flow` and `tool` sessions hold a draft of that kind (and carry the draft tools).
        `general` sessions have no draft and no draft tools: they answer questions, inspect with the read tools, move the user's
        view (`navigate_ui`) and can hand the user over to a draft session (`start_draft`). `target.id` is always null for `general`.
      enum: [general, sensor, flow, tool]
    AssistStatus:
      type: string
      description: |
        `idle`: no turn running. `running`: a turn is running. `awaiting_approval`: a turn is blocked on a tool-call
        approval (`GET /api/approvals?status=pending`). `failed`: the last turn failed (`error` says why); the session
        can still take a message. `closed`: ended; the draft directory is gone.
      enum: [idle, running, awaiting_approval, failed, closed]
    AssistRole: {type: string, enum: [user, assistant, tool, system]}
    AssistDraftAuthor: {type: string, enum: [agent, user]}
    AssistTarget:
      type: object
      required: [kind, id]
      properties:
        kind: {$ref: '#/components/schemas/AssistTargetKind'}
        id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Sensor, flow or tool id; null when the session authors a new one.'}
    AssistTargetRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/AssistTargetKind'}
        id: {$ref: '#/components/schemas/Slug'}
    AssistPageContextFact:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: {type: string}
        value: {type: string}
    AssistPageContextEntity:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: {type: string, description: 'What it is: `sensor`, `flow`, `node`, `run`, `inbox_item`, `approval`, and so on.'}
        id: {type: string}
        label: {type: string, description: 'Its name or title as shown on the page.'}
        detail: {type: string, description: 'One short line: status, error, count.'}
    AssistPageContext:
      type: object
      additionalProperties: false
      required: [route, title]
      description: |
        What the user sees, sent by the web UI with a turn so the assistant knows where they are. It is untrusted UI data:
        names, titles and errors on a page may be written by users, agents or external systems. The server renders it as a
        delimited section of the turn prompt (after hal's own instructions) and truncates it to a few KB (4096 bytes rendered;
        it drops entities and facts from the end and cuts long strings). It never carries secrets or environment values.
      properties:
        route: {type: string, description: 'In-app path with query, for example `/flows/triage?view=runs`. No origin.'}
        title: {type: string, description: 'The page title as shown.'}
        summary: {type: string, description: 'One or two sentences: what is on the page.'}
        facts: {type: array, items: {$ref: '#/components/schemas/AssistPageContextFact'}, description: 'Label/value pairs: filters, counts, selected item, validation errors.'}
        entities: {type: array, items: {$ref: '#/components/schemas/AssistPageContextEntity'}, description: 'The things on the page that the assistant may refer to or open (capped by the client, for example 20 visible rows).'}
    AssistDraftPrompt:
      type: object
      description: A prompt file the agent drafted under `prompts/`. Save creates it (`POST /api/prompts`) when `exists` is false.
      required: [name, yaml, exists]
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string, description: 'The file as written (front matter and body).'}
        exists: {type: boolean, description: 'A prompt of that name is already saved. Save never overwrites it.'}
    AssistDraftSensor:
      type: object
      description: |
        A sensor the agent drafted in a flow session (`sensors/<id>.yaml` in the draft directory): a new sensor, or an edit
        of a saved one (the agent's first `draft_write` to `sensors/<id>.yaml` copies it in). Save creates it
        (`POST /api/sensors` with `id`) when `base_hash` is null, else replaces the file (`PUT /api/sensors/{id}` with
        `expected_hash` = `base_hash`), before the prompts and the flow.
      required: [id, yaml, exists, base_hash, diagnostics]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        yaml: {type: string, description: The draft file as written}
        exists: {type: boolean, description: 'A sensor file of that id is saved now. For a new sensor (`base_hash` null) that is a clash and the draft carries an error diagnostic.'}
        base_hash: {oneOf: [{$ref: '#/components/schemas/Hash'}, {type: 'null'}], description: 'Hash of the saved file when the draft copy was made (an edit); null for a new sensor.'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}, description: 'The validator''s findings for this draft sensor (also part of the draft''s `diagnostics`, with `file` `sensors/<id>.yaml`).'}
    AssistDraft:
      type: object
      description: |
        The YAML the session works on, stored in the session's draft directory (`sensor.yaml`, `flow.yaml` or `tool.yaml`). Only the
        user's Save writes a real file.
      required: [kind, yaml, hash, sensor_id, flow_id, tool_id, prompts, sensors, diagnostics, updated_at, updated_by]
      properties:
        kind: {$ref: '#/components/schemas/AssistTargetKind'}
        yaml: {type: string}
        hash: {$ref: '#/components/schemas/Hash'}
        sensor_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Sensor sessions: the `id` parsed from the YAML; null when it has none or does not parse. For a new sensor it need not exist yet. Null for flows and tools.'}
        flow_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Flow sessions: the `id` parsed from the YAML; null when it has none or does not parse. Null for sensors and tools.'}
        tool_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Tool sessions: the `id` parsed from the YAML; null when it has none or does not parse. Null for sensors and flows.'}
        prompts: {type: array, items: {$ref: '#/components/schemas/AssistDraftPrompt'}, description: 'Flow sessions: new prompt files the agent drafted, by name. Always empty for sensors. They do not change `hash`.'}
        sensors: {type: array, items: {$ref: '#/components/schemas/AssistDraftSensor'}, description: 'Flow sessions: sensors the agent drafted (new or edits of saved ones), by id. Always empty for sensors and tools. Flow drafts may subscribe to them. They do not change `hash`.'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}, description: 'Findings of the validator for the target kind (the same checks as `POST /api/sensors/validate` or `POST /api/flows/validate`), plus `prompts/` files and, in flow sessions, `sensors/` drafts that do not validate. Flow drafts may reference the draft prompts and sensors.'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        updated_by: {$ref: '#/components/schemas/AssistDraftAuthor'}
    AssistSession:
      type: object
      required: [id, title, target, runtime, model, status, error, draft, last_agent_run_id, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        title: {type: [string, 'null'], description: 'The start of the first user message (at most 80 characters); null before the first message. For lists of chats.'}
        target: {$ref: '#/components/schemas/AssistTarget'}
        runtime: {$ref: '#/components/schemas/Slug'}
        model: {type: [string, 'null']}
        status: {$ref: '#/components/schemas/AssistStatus'}
        error: {type: [string, 'null'], description: Why the last turn failed; null otherwise.}
        draft: {$ref: '#/components/schemas/AssistDraft'}
        last_agent_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'The agent run of the latest turn (`GET /api/agent-runs/{id}`). Every turn is one agent run.'}
        forked_from_agent_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Set for a chat that continues the agent run of a flow node (`POST /api/conversations/{id}/fork`); null otherwise. Always present.'}
        fork_context: {oneOf: [{$ref: '#/components/schemas/ForkContext'}, {type: 'null'}], description: 'How a fork restored the run''s context; null before its first turn and for a chat that is not a fork. Always present.'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    AssistSessionList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AssistSession'}}
    AssistToolCall:
      type: object
      description: The agent's tool call, updated in place as it progresses.
      required: [tool_call_id, title, kind, status, raw_input, content]
      properties:
        tool_call_id: {type: string}
        title: {type: string}
        kind: {type: string, description: 'ACP tool kind: `read`, `edit`, `delete`, `move`, `search`, `execute`, `think`, `fetch`, `switch_mode`, `other`.'}
        status: {type: string, description: 'ACP status: `pending`, `in_progress`, `completed`, `failed`.'}
        raw_input: {$ref: '#/components/schemas/JsonValue'}
        content: {type: array, items: {$ref: '#/components/schemas/JsonValue'}, description: 'ACP tool call content, including diffs (`{type: diff, path, oldText, newText}`).'}
    AssistMessage:
      type: object
      description: |
        One entry of the conversation. Consecutive assistant text chunks are merged into one message; each tool call is
        one message that is updated in place (same `id`, new `assist.message` event) as its status changes.
      required: [id, role, text, agent_run_id, tool_call, approval_id, created_at]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        role: {$ref: '#/components/schemas/AssistRole'}
        text: {type: [string, 'null'], description: 'Null for `tool` messages.'}
        agent_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: The turn's agent run; null for user messages.}
        tool_call: {oneOf: [{$ref: '#/components/schemas/AssistToolCall'}, {type: 'null'}]}
        approval_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'The tool-call approval that gated this call, to be decided with `POST /api/approvals/{id}/approve|deny`.'}
        kind: {$ref: '#/components/schemas/ConversationMessageKind'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    AssistStreamMessage:
      allOf:
        - {$ref: '#/components/schemas/AssistMessage'}
        - type: object
          required: [session_id]
          properties:
            session_id: {$ref: '#/components/schemas/Ulid'}
    ConversationSource: {type: string, enum: [flow, chat]}
    ConversationKind:
      type: string
      description: 'A chat''s assist target kind, or `agent` for the agent run of a flow node.'
      enum: [general, sensor, flow, tool, agent]
    ConversationStatus:
      type: string
      description: |
        Normalised status. `running`: a chat turn or an agent run (queued or running) is in progress. `awaiting_approval`: blocked
        on an approval. `idle`: a chat without a running turn. `closed`: an ended chat. `succeeded`, `denied`, `killed`,
        `interrupted` and `timeout`: how an agent run ended; `failed` is both a failed run and a chat whose last turn failed.
      enum: [running, awaiting_approval, idle, succeeded, failed, killed, denied, interrupted, timeout, closed]
    ForkContext: {type: string, description: 'How a fork restored the run''s context: `resumed` (session/load) or `replayed` (a compacted transcript in the first prompt).', enum: [resumed, replayed]}
    ConversationForkRef:
      type: object
      description: The agent run a chat continues.
      required: [agent_run_id, flow_id, flow_run_id, node_id]
      properties:
        agent_run_id: {$ref: '#/components/schemas/Ulid'}
        flow_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Null when the run was pruned.'}
        flow_run_id: {$ref: '#/components/schemas/NullableUlid'}
        node_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}]}
    Conversation:
      type: object
      required: [id, source, kind, title, status, running, continuable, runtime, model, flow_id, flow_run_id, node_id, node_run_id, agent_run_id, assist_session_id, forked_from, fork_context, fork_count, started_at, updated_at, ended_at, preview]
      properties:
        id: {$ref: '#/components/schemas/Ulid'}
        source: {$ref: '#/components/schemas/ConversationSource'}
        kind: {$ref: '#/components/schemas/ConversationKind'}
        title: {type: string, description: 'A chat''s title (the start of its first message; "New chat" before it, "Continued: <flow> / <node>" for a fork without a message), or `<flow> / <node>` for a flow conversation.'}
        status: {$ref: '#/components/schemas/ConversationStatus'}
        running: {type: boolean, description: 'A turn or run is in progress (`running` or `awaiting_approval`).'}
        continuable: {type: boolean, description: 'A flow run that ended can be continued in a chat (`POST /api/conversations/{id}/fork`); a chat can be continued unless it is closed.'}
        runtime: {$ref: '#/components/schemas/Slug'}
        model: {type: [string, 'null']}
        flow_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'The flow of a flow conversation; for a fork the flow of the run it continues; for a chat that drafts a flow, that flow.'}
        flow_run_id: {$ref: '#/components/schemas/NullableUlid'}
        node_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}]}
        node_run_id: {$ref: '#/components/schemas/NullableUlid'}
        agent_run_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Flow conversations: the last phase of the node run (`GET /api/agent-runs/{id}`). Null for a chat.'}
        assist_session_id: {oneOf: [{$ref: '#/components/schemas/Ulid'}, {type: 'null'}], description: 'Chats: the assist session (`GET /api/assist/sessions/{id}`; the same as `id`). Null for a flow conversation.'}
        forked_from: {oneOf: [{$ref: '#/components/schemas/ConversationForkRef'}, {type: 'null'}]}
        fork_context: {oneOf: [{$ref: '#/components/schemas/ForkContext'}, {type: 'null'}], description: 'Null for a chat that is not a fork and before a fork''s first turn.'}
        fork_count: {type: integer, minimum: 0, description: 'Chats forked from this flow conversation (any of its phases). Always 0 for a chat.'}
        started_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}  # last activity: a chat's last change; a run's end, or its start while it runs
        ended_at: {$ref: '#/components/schemas/NullableTimestamp'}
        preview: {type: string, description: 'The start of the last user or assistant text of a chat, or of the result of a flow run (its error or prompt when it has no result); at most 160 characters, one line.'}
    ConversationList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
    ConversationDetail:
      allOf:
        - {$ref: '#/components/schemas/Conversation'}
        - type: object
          required: [forks]
          properties:
            forks: {type: array, items: {$ref: '#/components/schemas/Conversation'}, description: 'Chats forked from this conversation, newest activity first, at most 50. Empty for a chat.'}
    ConversationMessageKind:
      type: string
      description: '`divider`: the "Continued from run X" line at the start of a fork. `notice`: a system notice (for example that the sandbox was recreated). Empty for every other message.'
      enum: ['', divider, notice]
    ConversationMessage:
      type: object
      description: One transcript entry, in the shape of `AssistMessage` (see there for `tool_call`) with a string `id` and a `kind`.
      required: [id, role, kind, text, agent_run_id, tool_call, approval_id, created_at]
      properties:
        id: {type: string, description: 'A chat message''s id, or `<agent_run_id>:<zero padded seq>` for a flow conversation.'}
        role: {$ref: '#/components/schemas/AssistRole'}
        kind: {$ref: '#/components/schemas/ConversationMessageKind'}
        text: {type: [string, 'null'], description: 'Null for `tool` messages.'}
        agent_run_id: {$ref: '#/components/schemas/NullableUlid'}
        tool_call: {oneOf: [{$ref: '#/components/schemas/AssistToolCall'}, {type: 'null'}]}
        approval_id: {$ref: '#/components/schemas/NullableUlid'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    ConversationMessageList:
      type: object
      required: [items, truncated]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ConversationMessage'}, description: Oldest first.}
        truncated: {type: boolean, description: Older entries were left out (only the newest 2000 are returned).}
    AssistSessionDetail:
      allOf:
        - {$ref: '#/components/schemas/AssistSession'}
        - type: object
          required: [messages]
          properties:
            messages: {type: array, items: {$ref: '#/components/schemas/AssistMessage'}, description: Oldest first.}
    AssistCreateRequest:
      type: object
      additionalProperties: false
      required: [target, runtime]
      properties:
        target: {$ref: '#/components/schemas/AssistTargetRequest'}
        runtime: {$ref: '#/components/schemas/Slug'}
        model: {type: string}
        yaml: {type: string, description: "Initial draft. Defaults to the target sensor's file, or a commented skeleton for a new sensor."}
    AssistSendRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1}
        yaml: {type: string, description: 'Replaces the draft before the turn starts (the editor''s current content). Ignored by `general` sessions.'}
        page_context: {$ref: '#/components/schemas/AssistPageContext'}
    AssistDraftRequest:
      type: object
      additionalProperties: false
      required: [yaml]
      properties:
        yaml: {type: string}
        expected_hash: {$ref: '#/components/schemas/Hash'}
    AssistTestItem:
      type: object
      required: [dedup_key, key_error, item]
      properties:
        dedup_key: {type: [string, 'null'], description: 'The draft''s `key` template rendered over the item; null when it failed.'}
        key_error: {type: [string, 'null'], description: Why the key template failed on this item.}
        item: {$ref: '#/components/schemas/JsonValue'}
    AssistSensorTestResult:
      type: object
      description: |
        Outcome of one test run of a sensor draft, redacted: values of the global env file and of the target sensor's env
        file are replaced by `«KEY»`. `items` lists at most the first 200 parsed items; `item_count` is the total.
      required: [kind, sensor_id, exit_code, duration_ms, timed_out, items, item_count, parse_error, stdout, stderr]
      properties:
        kind: {type: string, enum: [sensor]}
        sensor_id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'Flow sessions: the draft sensor that was run (`sensor` in the request); null in sensor sessions.'}
        exit_code: {type: integer, description: '-1 when the process was killed by a signal (for example on timeout).'}
        duration_ms: {type: integer, minimum: 0}
        timed_out: {type: boolean}
        items: {type: array, items: {$ref: '#/components/schemas/AssistTestItem'}}
        item_count: {type: integer, minimum: 0}
        parse_error: {type: [string, 'null'], description: 'Why stdout is not a JSON array or JSONL of items (items is then empty).'}
        stdout: {$ref: '#/components/schemas/TextBlob'}
        stderr: {$ref: '#/components/schemas/TextBlob'}
    AssistFlowTestOutput:
      type: object
      required: [port, payload]
      properties:
        port: {type: string}
        payload: {$ref: '#/components/schemas/JsonValue'}
    AssistFlowTestNode:
      type: object
      description: |
        What one node did in a flow test, in the order the nodes ran. A node that did not run (a branch that was not
        taken) is absent. Agent nodes are `skipped` with the reason `assist test: agent nodes are not run`, and
        their branch ends there, unless the request simulates an emit for them (`simulate_emit`): then `simulated` is
        true, the reason is `simulated: emit_<port>`, and the node's outputs feed the downstream nodes. An inbox node records the item it would create in `would_create` and creates nothing.
      required: [node_id, node_run_id, status, decision, reason, error, ports, outputs, simulated, would_create, stdout, stderr, exit_code, duration_ms]
      properties:
        node_id: {$ref: '#/components/schemas/Slug'}
        node_run_id: {$ref: '#/components/schemas/Ulid'}
        status: {$ref: '#/components/schemas/NodeRunStatus'}
        decision: {oneOf: [{$ref: '#/components/schemas/NodeRunDecision'}, {type: 'null'}]}
        reason: {type: [string, 'null'], description: 'Why the node decided as it did: for a transform that dropped the item, the step and condition.'}
        error: {type: [string, 'null'], description: 'Error class when the node failed.'}
        ports: {type: array, items: {type: string}, description: 'Ports the node emitted on.'}
        outputs: {type: array, items: {$ref: '#/components/schemas/AssistFlowTestOutput'}}
        simulated: {type: boolean, description: 'An agent node that emitted through `simulate_emit` instead of running.'}
        would_create: {oneOf: [{$ref: '#/components/schemas/AssistInboxPreview'}, {type: 'null'}], description: 'Inbox nodes only: the item a real run would create.'}
        stdout: {type: [string, 'null'], description: 'Redacted, at most 4 KiB.'}
        stderr: {type: [string, 'null'], description: 'Redacted, at most 4 KiB.'}
        exit_code: {type: [integer, 'null']}
        duration_ms: {type: [integer, 'null'], minimum: 0}
    AssistInboxPreview:
      type: object
      required: [title, priority, summary_md, suggested_reply, links]
      properties:
        title: {type: string}
        priority: {type: string}
        summary_md: {type: string}
        suggested_reply: {type: string}
        links: {type: array, items: {type: object, required: [label, url], properties: {label: {type: string}, url: {type: string}}}}
    AssistFlowTestEdge:
      type: object
      required: [from, to, port]
      properties:
        from: {$ref: '#/components/schemas/Slug'}
        to: {$ref: '#/components/schemas/Slug'}
        port: {type: string}
    AssistFlowTestResult:
      type: object
      description: |
        Outcome of running the draft flow once on one input as a `kind: test` flow run (hidden from the default
        timelines; `GET /api/flow-runs/{id}` and its node runs show it). The run is forced `dry_run`.
      required: [kind, flow_run_id, status, input, nodes, edges_taken]
      properties:
        kind: {type: string, enum: [flow]}
        flow_run_id: {$ref: '#/components/schemas/Ulid'}
        status: {$ref: '#/components/schemas/FlowRunStatus'}
        input: {$ref: '#/components/schemas/JsonValue'}
        nodes: {type: array, items: {$ref: '#/components/schemas/AssistFlowTestNode'}}
        edges_taken: {type: array, items: {$ref: '#/components/schemas/AssistFlowTestEdge'}}
    AssistToolTestResult:
      type: object
      description: |
        Outcome of calling the draft tool once (tool sessions). Same fields as `ToolTestResult` plus `kind`. A failing
        tool is still a result (`ok: false`, `error` carries the stderr tail).
      required: [kind, ok, args, stdout, structured, stderr, exit_code, duration_ms, timed_out, error]
      properties:
        kind: {type: string, enum: [tool]}
        ok: {type: boolean}
        args: {type: object, additionalProperties: true}
        stdout: {type: string}
        structured: {oneOf: [{type: object, additionalProperties: true}, {type: array, items: {}}, {type: 'null'}]}
        stderr: {type: string}
        exit_code: {type: integer}
        duration_ms: {type: integer}
        timed_out: {type: boolean}
        error: {type: [string, 'null']}
    AssistTestResult:
      description: 'The result of a draft test; `kind` says which. Sensor sessions answer `sensor`, flow sessions `flow`, tool sessions `tool`.'
      oneOf:
        - {$ref: '#/components/schemas/AssistSensorTestResult'}
        - {$ref: '#/components/schemas/AssistFlowTestResult'}
        - {$ref: '#/components/schemas/AssistToolTestResult'}
      discriminator:
        propertyName: kind
        mapping:
          sensor: '#/components/schemas/AssistSensorTestResult'
          flow: '#/components/schemas/AssistFlowTestResult'
          tool: '#/components/schemas/AssistToolTestResult'
    AssistTestRequest:
      type: object
      additionalProperties: false
      description: |
        Flow sessions: the input to run the draft flow on. At most one of `sample_index`, `event_id` and `input`; with
        none, the first sample is used (422 when there is none). Tool sessions: `args`, the arguments object of the
        call (default `{}`). Ignored for sensors.

        Flow sessions can also run a draft sensor (`sensors/<id>.yaml` of the draft): `sensor` runs it like a sensor test and
        returns the `sensor` variant; `from_sensor` runs it and uses its item number `item` (default 0) as the flow test's
        input. `sensor` and `from_sensor` exclude each other and the other inputs. The sensor's script is subject to the same
        approval rule as a command node.
      properties:
        sensor: {$ref: '#/components/schemas/Slug'}
        from_sensor: {$ref: '#/components/schemas/Slug'}
        item: {type: integer, minimum: 0, description: 'With `from_sensor`: which item of the sensor''s output to use.'}
        sample_index: {type: integer, minimum: 0, description: 'Index into `GET /api/assist/sessions/{id}/samples`.'}
        event_id: {$ref: '#/components/schemas/Ulid'}
        input: {$ref: '#/components/schemas/JsonValue'}
        args: {type: [object, 'null'], additionalProperties: true, description: Tool sessions only.}
        simulate_approval: {type: string, enum: [approved, denied], default: approved, description: 'Flow sessions: the decision `approval` nodes and `requires_approval` gates take in the test; the test never waits for a person.'}
        simulate_emit:
          type: object
          additionalProperties: {$ref: '#/components/schemas/SimulatedEmit'}
          description: 'Flow sessions: agent nodes that emit instead of running, keyed by node id. Downstream nodes run as for a live emission. A node that does not exist, is not an agent node, or names a port that is not declared with an outgoing edge, or an output that does not match the port''s schema, is a request error.'
    AssistSample:
      type: object
      required: [index, sensor_id, payload]
      properties:
        index: {type: integer, minimum: 0}
        sensor_id: {$ref: '#/components/schemas/Slug'}
        payload: {$ref: '#/components/schemas/JsonValue'}
    AssistSampleList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AssistSample'}}
    # ---------------------------------------------------------------- SSE envelopes (GET /api/stream)
    StreamEventType:
      type: string
      description: |
        Value of the SSE `event:` field and of `StreamEvent.type`.
        `stream.ready` and `stream.resync` are control messages and always delivered.
        `status.changed`, `killswitch.changed`, and `config.changed` carry daemon-wide state; `sensor.changed` carries one
        sensor's status.
        The rest announce that a record was created (`.created`, `.appended`) or changed (`.updated`).
      enum:
        - stream.ready
        - stream.resync
        - status.changed
        - killswitch.changed
        - sensor.changed
        - config.changed
        - sensor_run.created
        - sensor_run.updated
        - event.created
        - flow_run.created
        - flow_run.updated
        - node_run.created
        - node_run.updated
        - agent_run.created
        - agent_run.updated
        - agent_event.appended
        - sandbox_session.created
        - sandbox_session.updated
        - sandbox_log.appended
        - permission_request.created
        - permission_request.updated
        - approval.created
        - approval.updated
        - inbox.created
        - inbox.updated
        - notification.created
        - auth_event.created
        - assist.updated
        - assist.message
        - assist.navigate
        - assist.start_draft
        - update.status
        - update.install
        - runtime.adapter
    StreamEnvelope:
      type: object
      description: |
        Fields shared by every message. `id` equals the SSE `id:` field and increases monotonically within one daemon
        run. Records in `data` have text previews truncated to 4 KiB; fetch the resource for full content.
      required: [type, id, ts, data]
      properties:
        type: {$ref: '#/components/schemas/StreamEventType'}
        id: {type: string}
        ts: {$ref: '#/components/schemas/Timestamp'}
        data: {}
    StreamEvent:
      description: One message of `GET /api/stream`, discriminated by `type`.
      oneOf:
        - {$ref: '#/components/schemas/StreamReadyEvent'}
        - {$ref: '#/components/schemas/StreamResyncEvent'}
        - {$ref: '#/components/schemas/StatusChangedEvent'}
        - {$ref: '#/components/schemas/KillSwitchChangedEvent'}
        - {$ref: '#/components/schemas/SensorChangedEvent'}
        - {$ref: '#/components/schemas/ConfigChangedEvent'}
        - {$ref: '#/components/schemas/SensorRunCreatedEvent'}
        - {$ref: '#/components/schemas/SensorRunUpdatedEvent'}
        - {$ref: '#/components/schemas/EventCreatedEvent'}
        - {$ref: '#/components/schemas/FlowRunCreatedEvent'}
        - {$ref: '#/components/schemas/FlowRunUpdatedEvent'}
        - {$ref: '#/components/schemas/NodeRunCreatedEvent'}
        - {$ref: '#/components/schemas/NodeRunUpdatedEvent'}
        - {$ref: '#/components/schemas/AgentRunCreatedEvent'}
        - {$ref: '#/components/schemas/AgentRunUpdatedEvent'}
        - {$ref: '#/components/schemas/AgentEventAppendedEvent'}
        - {$ref: '#/components/schemas/SandboxSessionCreatedEvent'}
        - {$ref: '#/components/schemas/SandboxSessionUpdatedEvent'}
        - {$ref: '#/components/schemas/SandboxLogAppendedEvent'}
        - {$ref: '#/components/schemas/PermissionRequestCreatedEvent'}
        - {$ref: '#/components/schemas/PermissionRequestUpdatedEvent'}
        - {$ref: '#/components/schemas/ApprovalCreatedEvent'}
        - {$ref: '#/components/schemas/ApprovalUpdatedEvent'}
        - {$ref: '#/components/schemas/InboxCreatedEvent'}
        - {$ref: '#/components/schemas/InboxUpdatedEvent'}
        - {$ref: '#/components/schemas/NotificationCreatedEvent'}
        - {$ref: '#/components/schemas/AuthEventCreatedEvent'}
        - {$ref: '#/components/schemas/AssistUpdatedEvent'}
        - {$ref: '#/components/schemas/AssistMessageEvent'}
        - {$ref: '#/components/schemas/AssistNavigateEvent'}
        - {$ref: '#/components/schemas/AssistStartDraftEvent'}
        - {$ref: '#/components/schemas/UpdateStatusEvent'}
        - {$ref: '#/components/schemas/UpdateInstallEvent'}
        - {$ref: '#/components/schemas/RuntimeAdapterEvent'}
      discriminator:
        propertyName: type
        mapping:
          stream.ready: '#/components/schemas/StreamReadyEvent'
          stream.resync: '#/components/schemas/StreamResyncEvent'
          status.changed: '#/components/schemas/StatusChangedEvent'
          killswitch.changed: '#/components/schemas/KillSwitchChangedEvent'
          sensor.changed: '#/components/schemas/SensorChangedEvent'
          config.changed: '#/components/schemas/ConfigChangedEvent'
          sensor_run.created: '#/components/schemas/SensorRunCreatedEvent'
          sensor_run.updated: '#/components/schemas/SensorRunUpdatedEvent'
          event.created: '#/components/schemas/EventCreatedEvent'
          flow_run.created: '#/components/schemas/FlowRunCreatedEvent'
          flow_run.updated: '#/components/schemas/FlowRunUpdatedEvent'
          node_run.created: '#/components/schemas/NodeRunCreatedEvent'
          node_run.updated: '#/components/schemas/NodeRunUpdatedEvent'
          agent_run.created: '#/components/schemas/AgentRunCreatedEvent'
          agent_run.updated: '#/components/schemas/AgentRunUpdatedEvent'
          agent_event.appended: '#/components/schemas/AgentEventAppendedEvent'
          sandbox_session.created: '#/components/schemas/SandboxSessionCreatedEvent'
          sandbox_session.updated: '#/components/schemas/SandboxSessionUpdatedEvent'
          sandbox_log.appended: '#/components/schemas/SandboxLogAppendedEvent'
          permission_request.created: '#/components/schemas/PermissionRequestCreatedEvent'
          permission_request.updated: '#/components/schemas/PermissionRequestUpdatedEvent'
          approval.created: '#/components/schemas/ApprovalCreatedEvent'
          approval.updated: '#/components/schemas/ApprovalUpdatedEvent'
          inbox.created: '#/components/schemas/InboxCreatedEvent'
          inbox.updated: '#/components/schemas/InboxUpdatedEvent'
          notification.created: '#/components/schemas/NotificationCreatedEvent'
          auth_event.created: '#/components/schemas/AuthEventCreatedEvent'
          assist.updated: '#/components/schemas/AssistUpdatedEvent'
          assist.message: '#/components/schemas/AssistMessageEvent'
          assist.navigate: '#/components/schemas/AssistNavigateEvent'
          assist.start_draft: '#/components/schemas/AssistStartDraftEvent'
          update.status: '#/components/schemas/UpdateStatusEvent'
          update.install: '#/components/schemas/UpdateInstallEvent'
          runtime.adapter: '#/components/schemas/RuntimeAdapterEvent'
    StreamReady:
      type: object
      required: [server_time, version, last_event_id]
      properties:
        server_time: {$ref: '#/components/schemas/Timestamp'}
        version: {type: string}
        last_event_id: {type: string, description: Id of the newest buffered message; empty when none.}
    StreamResync:
      type: object
      required: [reason]
      properties:
        reason: {type: string, description: 'For example `buffer_overrun` or `daemon_restarted`.'}
    ConfigChange:
      type: object
      description: A file under the home dir changed on disk or through the API (hot reload).
      required: [kind, id, hash, deleted]
      properties:
        kind: {type: string, enum: [sensor, flow, prompt, settings, env, sensor_env, tool, tool_env, sandbox, sandbox_env]}
        id: {type: [string, 'null'], description: 'Sensor id, flow id, tool id, or prompt name; for `sensor_env` and `tool_env` the owner id; for `sandbox` and `sandbox_env` the backend name; null for settings and env.'}
        hash: {$ref: '#/components/schemas/NullableHash'}
        deleted: {type: boolean}
    SensorChange:
      type: object
      required: [id, status]
      properties:
        id: {$ref: '#/components/schemas/Slug'}
        status: {$ref: '#/components/schemas/SensorStatus'}
    StreamReadyEvent:
      description: First message on every connection. `data` is `StreamReady`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [stream.ready]}
            data: {$ref: '#/components/schemas/StreamReady'}
    StreamResyncEvent:
      description: The server could not replay everything after `Last-Event-ID`. Refetch displayed resources.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [stream.resync]}
            data: {$ref: '#/components/schemas/StreamResync'}
    StatusChangedEvent:
      description: Header counters changed. `data` is `Status`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [status.changed]}
            data: {$ref: '#/components/schemas/Status'}
    KillSwitchChangedEvent:
      description: The kill switch was engaged or released. `data` is `KillSwitch`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [killswitch.changed]}
            data: {$ref: '#/components/schemas/KillSwitch'}
    SensorChangedEvent:
      description: |
        A sensor's status changed: it was paused or resumed, or a poll recorded its outcome. `data` is
        `SensorChange`. Filterable with `sensor_id`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [sensor.changed]}
            data: {$ref: '#/components/schemas/SensorChange'}
    ConfigChangedEvent:
      description: A sensor, flow, tool, prompt, settings, env, sensor env or tool env file changed. `data` is `ConfigChange`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [config.changed]}
            data: {$ref: '#/components/schemas/ConfigChange'}
    SensorRunCreatedEvent:
      description: A poll started. `data` is `SensorRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [sensor_run.created]}
            data: {$ref: '#/components/schemas/SensorRun'}
    SensorRunUpdatedEvent:
      description: A poll finished or its counts changed. `data` is `SensorRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [sensor_run.updated]}
            data: {$ref: '#/components/schemas/SensorRun'}
    EventCreatedEvent:
      description: A new event passed dedup. `data` is `EventSummary` with the flow runs created so far.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [event.created]}
            data: {$ref: '#/components/schemas/EventSummary'}
    FlowRunCreatedEvent:
      description: A flow run was queued. `data` is `FlowRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [flow_run.created]}
            data: {$ref: '#/components/schemas/FlowRun'}
    FlowRunUpdatedEvent:
      description: A flow run changed status. `data` is `FlowRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [flow_run.updated]}
            data: {$ref: '#/components/schemas/FlowRun'}
    NodeRunCreatedEvent:
      description: A node run was queued or started. `data` is `NodeRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [node_run.created]}
            data: {$ref: '#/components/schemas/NodeRun'}
    NodeRunUpdatedEvent:
      description: A node run changed status or finished. `data` is `NodeRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [node_run.updated]}
            data: {$ref: '#/components/schemas/NodeRun'}
    AgentRunCreatedEvent:
      description: An agent run was queued. `data` is `AgentRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [agent_run.created]}
            data: {$ref: '#/components/schemas/AgentRun'}
    AgentRunUpdatedEvent:
      description: An agent run changed status or phase. `data` is `AgentRun`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [agent_run.updated]}
            data: {$ref: '#/components/schemas/AgentRun'}
    AgentEventAppendedEvent:
      description: A transcript event was appended. `data` is `AgentEvent`; the stream filter `agent_run_id` applies.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [agent_event.appended]}
            data: {$ref: '#/components/schemas/AgentEvent'}
    PermissionRequestCreatedEvent:
      description: The agent asked for permission. `data` is `PermissionRequest`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [permission_request.created]}
            data: {$ref: '#/components/schemas/PermissionRequest'}
    PermissionRequestUpdatedEvent:
      description: A permission request was decided or expired. `data` is `PermissionRequest`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [permission_request.updated]}
            data: {$ref: '#/components/schemas/PermissionRequest'}
    ApprovalCreatedEvent:
      description: A proposal or tool call is waiting for a decision. `data` is `Approval`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [approval.created]}
            data: {$ref: '#/components/schemas/Approval'}
    ApprovalUpdatedEvent:
      description: An approval was decided or expired. `data` is `Approval`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [approval.updated]}
            data: {$ref: '#/components/schemas/Approval'}
    InboxCreatedEvent:
      description: A new inbox item. `data` is `InboxItem`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [inbox.created]}
            data: {$ref: '#/components/schemas/InboxItem'}
    InboxUpdatedEvent:
      description: An inbox item was read, starred, or archived. `data` is `InboxItem`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [inbox.updated]}
            data: {$ref: '#/components/schemas/InboxItem'}
    NotificationCreatedEvent:
      description: |
        The daemon raised a notification (an inbox note or an approval). `data` is `Notification`, fully rendered, with
        the `channel` it was routed to. A notification sink (header `X-Hal9001-Notifier: app`) shows it. Example:
        `{"type":"notification.created","id":"1788000000001","ts":"2026-11-09T12:00:00Z","data":{"id":"01J...","kind":"note",
        "flow_id":"triage","title":"triage","subtitle":"Deploy is failing","body":"Roll back now.","priority":"high","dry_run":false,
        "thread_id":"triage","url":"http://localhost:9001/inbox/01J...","item_id":"01J...","approval_id":"","approval_type":"",
        "editable":false,"created_at":"2026-11-09T12:00:00Z","channel":"app","status":"sent","error":""}}`
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [notification.created]}
            data: {$ref: '#/components/schemas/Notification'}
    AuthEventCreatedEvent:
      description: An authentication decision was recorded. `data` is `AuthEvent`. Delivered only to callers granted `admin`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [auth_event.created]}
            data: {$ref: '#/components/schemas/AuthEvent'}
    AssistUpdatedEvent:
      description: An assist session changed status, draft, or last run. `data` is `AssistSession`; the stream filter `assist_session_id` applies.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [assist.updated]}
            data: {$ref: '#/components/schemas/AssistSession'}
    AssistMessageEvent:
      description: A conversation message was added or a tool call message changed. `data` is `AssistStreamMessage`; the stream filter `assist_session_id` applies.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [assist.message]}
            data: {$ref: '#/components/schemas/AssistStreamMessage'}
    AssistNavigateEvent:
      description: |
        The assistant asked the UI to open a page (the `navigate_ui` tool). `data` is `AssistNavigate`; the stream filter
        `assist_session_id` applies. The path was checked against the app's routes. Clients navigate once per event and
        ignore events for sessions they do not show.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [assist.navigate]}
            data: {$ref: '#/components/schemas/AssistNavigate'}
    AssistNavigate:
      type: object
      required: [session_id, path, reason]
      properties:
        session_id: {$ref: '#/components/schemas/Ulid'}
        path: {type: string, description: 'In-app path with optional query, starting with `/`.'}
        reason: {type: [string, 'null']}
    AssistStartDraftEvent:
      description: |
        The assistant of a `general` session offered a draft session (the `start_draft` tool). `data` is `AssistStartDraft`;
        the stream filter `assist_session_id` applies. The client switches the chat to a new session on that target and sends
        `prompt` as its first message (the same as the user starting a draft from the editor).
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [assist.start_draft]}
            data: {$ref: '#/components/schemas/AssistStartDraft'}
    AssistStartDraft:
      type: object
      required: [session_id, kind, id, prompt]
      properties:
        session_id: {$ref: '#/components/schemas/Ulid'}
        kind: {type: string, enum: [sensor, flow, tool]}
        id: {oneOf: [{$ref: '#/components/schemas/Slug'}, {type: 'null'}], description: 'An existing sensor, flow or tool to edit (it exists); null starts a new one.'}
        prompt: {type: [string, 'null'], description: 'What the user wants, as the assistant understood it. Becomes the first message of the new session.'}
    UpdateStatusEvent:
      description: The updater state changed (check finished, install requested, started, progressed, failed, installer connected). `data` is `UpdateStatus`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [update.status]}
            data: {$ref: '#/components/schemas/UpdateStatus'}
    RuntimeAdapterEvent:
      description: |
        Progress of an adapter install started with `POST /api/runtimes/{name}/adapter`. `data` is
        `RuntimeAdapterProgress`. Clients refetch `GET /api/runtimes` on every event.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [runtime.adapter]}
            data: {$ref: '#/components/schemas/RuntimeAdapterProgress'}
    RuntimeAdapterProgress:
      type: object
      required: [name, phase, line, error]
      properties:
        name: {$ref: '#/components/schemas/Slug'}
        phase: {type: string, enum: [installing, done, failed]}
        line: {type: [string, 'null'], description: A line of npm's output (`installing`).}
        error: {type: [string, 'null'], description: Why the install failed (`failed`).}
    UpdateInstallEvent:
      description: |
        Order to install the available update: download `manifest.url`, verify it against the manifest's size, sha256 and
        Ed25519 `signature`, replace the app bundle and relaunch. Delivered only to the installer connection (header
        `X-Hal9001-Updater: app`, caller granted `admin`), never buffered for replay. `data` is `UpdateInstall`.
      allOf:
        - {$ref: '#/components/schemas/StreamEnvelope'}
        - type: object
          properties:
            type: {enum: [update.install]}
            data: {$ref: '#/components/schemas/UpdateInstall'}
