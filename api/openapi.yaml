        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Timeline of events with their flow runs
      description: |
        Events newest first, each with brief entries for the flow runs it fanned out to. `flow_id`, `status`,
        `decision`, and `kind` keep events that have at least one matching run. Test runs (`kind: test`) are hidden
        unless `kind=test` is requested.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: sensor_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: status, in: query, description: Flow run status., schema: {$ref: '#/components/schemas/FlowRunStatus'}}
        - {name: decision, in: query, description: Decision of any node run in the flow run., schema: {$ref: '#/components/schemas/NodeRunDecision'}}
        - {name: kind, in: query, description: 'Flow run kind. Default is `live`, `replay` and `continuation`.', schema: {$ref: '#/components/schemas/FlowRunKind'}}
        - {name: q, in: query, description: Case-insensitive substring search over the payload text., schema: {type: string, minLength: 1}}
        - {$ref: '#/components/parameters/Since'}
        - {$ref: '#/components/parameters/Until'}
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: injectEvent
      tags: [events]
      summary: Inject an event for a sensor without polling
      description: |
        The body is the item JSON, any JSON value. The item goes through the sensor's `key` template, dedup, and flow
        fan-out exactly like a polled item. 201 with the new event; 200 with `deduplicated: true` when the key was seen
        before (nothing is created). Injection is accepted while paused and the resulting runs stay `queued`. It is also accepted for a sensor that was
        paused individually (`POST /api/sensors/{id}/pause`); only the scheduler honours that pause.
      x-hal-service: admin
      x-hal-paused: queue
      parameters:
        - {name: sensor_id, in: query, required: true, schema: {$ref: '#/components/schemas/Slug'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JsonValue'}
      responses:
        '200':
          description: Item was already seen; nothing was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InjectResult'}
        '201':
          description: Event created and fanned out.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InjectResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/events/{id}:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event with its fan-out tree
      description: |
        The raw payload, dedup key, originating sensor run, and for each flow the event reached the flow run with its
        node runs as a tree (child = node run fed by its parent's output), which gives each branch's decision path.
      x-hal-service: api
      responses:
        '200':
          description: Event detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/events/{id}/replay:
    parameters:
      - {$ref: '#/components/parameters/EventId'}
    post:
      operationId: replayEvent
      tags: [events]
      summary: Replay an event into a flow
      description: |
        Runs the stored event through the current version of the flow. Creates a new FlowRun with `kind: replay` and
        `replay_of` set to the most recent earlier run of that event in that flow, or to null if there was none.
        Accepted while paused; the run stays `queued`.
      x-hal-service: admin
      x-hal-paused: queue
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplayRequest'}
      responses:
        '202':
          description: Replay queued.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows:
    get:
      operationId: listFlows
      tags: [flows]
      summary: List flows with health stats
      description: Every flow file under `flows/`, including ones that fail validation, with run statistics.
      x-hal-service: api
      responses:
        '200':
          description: All flows, ordered by id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createFlow
      tags: [flows]
      summary: Create a flow
      description: |
        Writes `flows/<id>.yaml`. Send either `yaml` or `flow`. 422 when validation reports errors (warnings do not
        block), 409 `already-exists` when the id is taken.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlowCreateRequest'}
      responses:
        '201':
          description: Created.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/validate:
    post:
      operationId: validateFlow
      tags: [flows]
      summary: Validate a flow without saving
      description: |
        Checks the graph (cycles, unknown nodes, undeclared ports, unreachable nodes), field values, templates, and
        references to sensors, prompts, and runtimes. Always 200 when the request itself is well formed; check `valid`
        and `diagnostics`. When the input is YAML the parsed `flow` is returned; when it is JSON the canonical `yaml`
        is returned.
      x-hal-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlowValidateRequest'}
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowValidation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    get:
      operationId: getFlow
      tags: [flows]
      summary: Get a flow
      description: |
        `yaml` is the file as on disk, `flow` its parsed form (null when the YAML does not parse), `hash` the file
        hash to send back as `expected_hash`.
      x-hal-service: api
      responses:
        '200':
          description: Flow definition.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateFlow
      tags: [flows]
      summary: Replace a flow
      description: |
        Send `expected_hash` and either `yaml` or `flow`. 409 `conflict` when the file changed since that hash, 422
        when validation reports errors. A version snapshot is recorded the first time a run uses the new content; runs
        already in progress keep the version they started with.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlowUpdateRequest'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteFlow
      tags: [flows]
      summary: Delete a flow
      description: Removes the file. Version snapshots and past runs stay until retention pruning.
      x-hal-service: admin
      parameters:
        - {$ref: '#/components/parameters/ExpectedHash'}
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/rename:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    post:
      operationId: renameFlow
      tags: [flows]
      summary: Rename a flow
      description: |
        Renames the file (the file name is the id), moves its env file, and rewrites references to it; run history keeps pointing at the old id.
        Recorded history (events, runs) keeps the ids it was recorded with. Emits `config.changed`. 409 `conflict` when
        `expected_hash` is stale or `new_id` already exists; 422 for an invalid `new_id`.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameRequest'}
      responses:
        '200':
          description: Renamed; the item under its new id.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/test-node:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    post:
      operationId: testFlowNode
      tags: [flows]
      summary: Run one node on a sample input
      description: |
        Executes a single node against a stored event, an upstream node run's output, or pasted JSON ("Run node on
        sample"). Recorded as a FlowRun with `kind: test`, which default timeline views hide. The node does not feed
        downstream nodes. `node` may carry an unsaved draft of the node to run instead of the saved one.

        Blocks up to `wait` (default 30s) for the node run to finish. 200 when it finished, 202 when it is still
        running (poll `GET /api/node-runs/{id}`). 423 `paused` while the kill switch is engaged.
      x-hal-service: admin
      x-hal-paused: reject
      parameters:
        - {$ref: '#/components/parameters/Wait'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestNodeRequest'}
      responses:
        '200':
          description: Node run finished.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestNodeResult'}
        '202':
          description: Node run still in progress when `wait` elapsed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestNodeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '423': {$ref: '#/components/responses/Paused'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/run:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    post:
      operationId: runFlow
      tags: [flows]
      summary: Run a flow now
      description: |
        Polls every sensor the flow subscribes to, in parallel, each as a normal manual sensor run, with this flow as
        the only target: new items become events with a live run of this flow only, and with `rerun_seen: true` items
        already seen are replayed into it (`kind: replay`). Other flows subscribed to those sensors get nothing. The
        saved version of the flow runs. Blocks until the polls have finished; the flow runs it created are returned
        and can be followed with `GET /api/flow-runs/{id}?wait=30s`.

        A flow with `enabled: false` can be run this way: running it is an explicit user action. 422 when the flow
        subscribes to no sensor. 409 `invalid-state` when the flow file has errors. A sensor that cannot be polled
        (missing, invalid, or already being polled) is reported in its entry with `error`; the others still run. 423
        `paused` while the kill switch is engaged.
      x-hal-service: admin
      x-hal-paused: reject
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlowRunNowRequest'}
      responses:
        '202':
          description: The polls finished; flow runs were created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowRunNowResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '423': {$ref: '#/components/responses/Paused'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/samples:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    get:
      operationId: listFlowNodeSamples
      tags: [flows]
      summary: Sample inputs for a node
      description: |
        Recent real inputs a node would receive, newest first, for the form editors and previews. For an entry node
        (no incoming edge) these are the payloads of recent events from the sensors the flow subscribes to. For a
        downstream node they are the payloads upstream nodes recently emitted into it, taken from this flow's stored
        node runs (stdout parsed as JSON or JSONL, routed by `_port` along the edges that lead to the node). Each
        sample says where it came from. The list is empty when nothing has run yet. Test runs are not sampled. A `node_id`
        that is not in the saved flow (a node still being drawn) has no incoming edges there, so it is sampled like an
        entry node.
      x-hal-service: api
      parameters:
        - name: node_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Slug'}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Samples, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowSamples'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/mcp/tools:
    get:
      operationId: listMcpTools
      tags: [mcp]
      summary: Tools of one agent run (hal MCP backend)
      description: |
        Backend of `hal9001 mcp`, the stdio MCP server hal injects into every agent session. Not for general use: it is
        authorized by the per-run capability token in `Authorization: Bearer <token>` instead of the auth stack. The token
        is random, stored hashed, scoped to one run's tool set, and revoked when the run ends; a missing, unknown or
        revoked token is 401.
      x-hal-service: api
      x-hal-public: true
      security: []
      responses:
        '200':
          description: The tools of the run the token belongs to.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpToolList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: The daemon has no tool hub (not expected in a normal daemon).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Error'}
  /api/mcp/ready:
    post:
      operationId: markMcpReady
      tags: [mcp]
      summary: The agent's MCP client is connected (hal MCP backend)
      description: |
        `hal9001 mcp` calls this once the agent's MCP client has initialized against it, so hal can hold the first prompt
        until the agent can see its tools (omp does not wait for its MCP servers). Authorized by the run capability token
        like the other `/api/mcp/` operations.
      x-hal-service: api
      x-hal-public: true
      security: []
      responses:
        '204': {description: Recorded.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503':
          description: The daemon has no tool hub (not expected in a normal daemon).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Error'}
  /api/mcp/call:
    post:
      operationId: callMcpTool
      tags: [mcp]
      summary: Call a tool of one agent run (hal MCP backend)
      description: |
        Runs one tool for the run the capability token belongs to (`Authorization: Bearer <token>`). A call that needs
        approval (for example a `gh_api` POST) creates a `tool_call` approval and blocks until it is decided or the
        run's approval timeout passes. A tool failure, a denial and an unknown tool are 200 with `is_error: true` and the
        reason in `text`, so the agent sees them as a tool error. Every call is recorded as a permission request of the
        agent run.
      x-hal-service: api
      x-hal-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpCallRequest'}
      responses:
        '200':
          description: The tool's result or error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpCallResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503':
          description: The daemon has no tool hub (not expected in a normal daemon).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Error'}
  /api/mcp/info:
    get:
      operationId: getMcpInfo
      tags: [mcp]
      summary: How to connect an MCP client to this daemon
      description: |
        The URLs, the stdio command, the auth hints and the tool list of hal's MCP server (docs/mcp.md), built from the
        running daemon (its real port and binary path). The Settings page renders its install instructions from it.
      x-hal-service: api
      responses:
        '200':
          description: The connection details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpInfo'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /mcp:
    post:
      operationId: serveMcp
      tags: [mcp]
      summary: Remote MCP server (Streamable HTTP)
      description: |
        hal's MCP server for clients that run on this Mac (Claude Code, Codex, omp, pi, ...), in the Streamable HTTP
        transport of the MCP specification (2025-06-18, stateless: no session id, JSON responses; GET and DELETE are
        405). The body is one JSON-RPC message; `tools/list` and `tools/call` serve the operator tools of
        `GET /api/mcp/info`. It needs the `api` auth service like the REST API; each tool then calls the REST API with
        the same credentials. A tool that needs another service (`flow_run`, `sensor_poll`, `flow_create`,
        `sensor_create`, `request_approval`, `send_note`: `admin`) is held to it before anybody is asked. `flow_run`,
        `sensor_poll`, `flow_create` and `sensor_create` wait for the user's approval in the Inbox, `request_approval`
        is an approval the agent asks for, and `send_note` posts an Inbox note. Loopback only, on top of the baseline: Host, Origin
        and the TCP peer must be loopback, and a request with proxy headers (`Forwarded`, `X-Forwarded-*`,
        `Tailscale-*`) is 403, even when the host is in `allowed_hosts`. Not the run-scoped backend of `hal9001 mcp
        --token` (`/api/mcp/tools`, `/api/mcp/call`).
      x-hal-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true, description: 'A JSON-RPC 2.0 request or notification.'}
      responses:
        '200':
          description: The JSON-RPC response.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '202': {description: 'A notification or response was accepted; no body.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503':
          description: The daemon has no operator tool set (not expected in a normal daemon).
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Error'}
  /api/transform/preview:
    post:
      operationId: previewTransform
      tags: [flows]
      summary: Run transform steps on a sample
      description: |
        Compiles `steps` to jq and runs them on `input` (one JSON value), step by step, so the editor can show the
        item count after each step. Compute only: nothing is stored and no flow is touched. Always 200 when the
        request is well formed; invalid steps come back as `decision: error` with `diagnostics` (paths like
        `steps[1].conditions[0].value`). A step that errors at run time (for example indexing a string) ends the run
        with `decision: error`. The whole preview times out after 10 seconds.
      x-hal-service: api
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransformPreviewRequest'}
      responses:
        '200':
          description: Preview result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TransformPreview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/transform/compile:
    post:
      operationId: compileTransform
      tags: [flows]
      summary: Compile transform steps to jq
      description: |
        Returns the jq program the engine would run for `steps` and one plain-language sentence per step. Used by
        "Convert to code node". 422 with diagnostics when the steps are invalid.
      x-hal-service: api
      requestBody:
        required: true
