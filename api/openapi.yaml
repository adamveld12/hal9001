        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateFlow
      tags: [flows]
      summary: Replace a flow
      description: |
        Send `expected_hash` and either `yaml` or `flow`. 409 `conflict` when the file changed since that hash, 422
        when validation reports errors. Saving a changed flow creates a new version snapshot; runs already in progress
        keep the version they started with.
      x-hal-service: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FlowUpdateRequest'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteFlow
      tags: [flows]
      summary: Delete a flow
      description: Removes the file. Version snapshots and past runs stay until retention pruning.
      x-hal-service: admin
      parameters:
        - {$ref: '#/components/parameters/ExpectedHash'}
      responses:
        '204': {description: Deleted.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/test-node:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    post:
      operationId: testFlowNode
      tags: [flows]
      summary: Run one node on a sample input
      description: |
        Executes a single node against a stored event, an upstream node run's output, or pasted JSON ("Run node on
        sample"). Recorded as a FlowRun with `kind: test`, which default timeline views hide. The node does not feed
        downstream nodes. `node` may carry an unsaved draft of the node to run instead of the saved one.

        Blocks up to `wait` (default 30s) for the node run to finish. 200 when it finished, 202 when it is still
        running (poll `GET /api/node-runs/{id}`). 423 `paused` while the kill switch is engaged.
      x-hal-service: admin
      x-hal-paused: reject
      parameters:
        - {$ref: '#/components/parameters/Wait'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TestNodeRequest'}
      responses:
        '200':
          description: Node run finished.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestNodeResult'}
        '202':
          description: Node run still in progress when `wait` elapsed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TestNodeResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '423': {$ref: '#/components/responses/Paused'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/versions:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
    get:
      operationId: listFlowVersions
      tags: [flows]
      summary: Snapshots of a flow
      description: Every distinct version that was saved or loaded, newest first. Works for deleted flows while their runs exist.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Versions without YAML bodies.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowVersionList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/flows/{id}/versions/{hash}:
    parameters:
      - {$ref: '#/components/parameters/FlowId'}
      - {$ref: '#/components/parameters/HashPath'}
    get:
      operationId: getFlowVersion
      tags: [flows]
      summary: Get one flow version
      description: The exact YAML a run used, as raw text and parsed JSON. `FlowRun.flow_hash` links here.
      x-hal-service: api
      responses:
        '200':
          description: Version snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/flow-runs:
    get:
      operationId: listFlowRuns
      tags: [runs]
      summary: List flow runs
      description: Newest first. `kind` defaults to live and replay; ask for `test` explicitly.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: flow_id, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: event_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/FlowRunStatus'}}
        - {name: kind, in: query, schema: {$ref: '#/components/schemas/FlowRunKind'}}
        - {name: replay_of, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {$ref: '#/components/parameters/Since'}
        - {$ref: '#/components/parameters/Until'}
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowRunList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/flow-runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/FlowRunId'}
    get:
      operationId: getFlowRun
      tags: [runs]
      summary: Get a flow run with its node runs
      description: |
        With `wait`, long-polls until the run reaches a terminal status (`succeeded`, `failed`, `killed`,
        `interrupted`) or `awaiting_approval`, or until the wait elapses. The current state is returned either way, so
        callers check `status` rather than relying on the HTTP status. Returns immediately when the run is already
        there.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Wait'}
      responses:
        '200':
          description: The run and every node run recorded so far.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FlowRunDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/node-runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/NodeRunId'}
    get:
      operationId: getNodeRun
      tags: [runs]
      summary: Get a node run
      description: Includes the agent runs behind an agent node, one per phase. `wait` behaves as on flow runs, for the node run's own statuses.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Wait'}
      responses:
        '200':
          description: The node run with stdin, stdout, stderr, and command snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeRunDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent-runs:
    get:
      operationId: listAgentRuns
      tags: [agents]
      summary: List agent runs
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AgentRunStatus'}}
        - {name: runtime, in: query, schema: {$ref: '#/components/schemas/Slug'}}
        - {name: flow_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: node_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
      responses:
        '200':
          description: One page, newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent-runs/{id}:
    parameters:
      - {$ref: '#/components/parameters/AgentRunId'}
    get:
      operationId: getAgentRun
      tags: [agents]
      summary: Get an agent run
      description: Agent info and capabilities, rendered prompt, argv, cwd, phase, result, and the approvals raised by this run.
      x-hal-service: api
      responses:
        '200':
          description: The agent run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentRunDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent-runs/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/AgentRunId'}
    get:
      operationId: listAgentEvents
      tags: [agents]
      summary: Transcript events of an agent run
      description: |
        `session/update` records in `seq` order. Page forward with `after_seq` (exclusive); `has_more` says whether
        another page follows. To tail a running run, load once, then follow `agent_event.appended` on the stream and
        refetch with `after_seq` after a `stream.resync`.
      x-hal-service: api
      parameters:
        - name: after_seq
          in: query
          description: Return only events with `seq` greater than this. Default 0 (from the start).
          schema: {type: integer, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 200}
        - name: kind
          in: query
          description: Comma-separated kinds to include.
          style: form
          explode: false
          schema:
            type: array
            items: {type: string}
      responses:
        '200':
          description: Events in ascending `seq`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentEventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent-runs/{id}/permission-requests:
    parameters:
      - {$ref: '#/components/parameters/AgentRunId'}
    get:
      operationId: listAgentPermissionRequests
      tags: [agents]
      summary: Permission requests of an agent run
      description: Every `session/request_permission` the agent sent, with who decided, the matched rule, and the reason. Ordered by request time.
      x-hal-service: api
      responses:
        '200':
          description: All permission requests of the run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionRequestList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/agent-runs/{id}/raw:
    parameters:
      - {$ref: '#/components/parameters/AgentRunId'}
    get:
      operationId: downloadAgentRunRaw
      tags: [agents]
      summary: Download the raw JSON-RPC traffic
      description: |
        Newline-delimited JSON, one frame per line, in wire order, as a download. Each line is
        `{"ts": <RFC 3339>, "dir": "in"|"out", "msg": <JSON-RPC message>}` where `dir` is relative to the harness.
        Secrets from the env file are redacted.
      x-hal-service: api
      responses:
        '200':
          description: NDJSON file.
          headers:
            Content-Disposition:
              description: '`attachment; filename="agent-run-<id>.jsonl"`'
              schema: {type: string}
          content:
            application/x-ndjson:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: Approval queue and history
      description: |
        Both types (`proposal`, `tool_call`). `status=pending` is the queue; `status=approved,denied,expired` is the
        history. `status` takes one or more comma-separated values; without it every status is listed. Newest first.
      x-hal-service: api
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          description: Comma-separated statuses to include.
          style: form
          explode: false
          schema:
            type: array
            items: {$ref: '#/components/schemas/ApprovalStatus'}
        - {name: type, in: query, schema: {$ref: '#/components/schemas/ApprovalType'}}
        - {name: agent_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
        - {name: flow_run_id, in: query, schema: {$ref: '#/components/schemas/Ulid'}}
      responses:
        '200':
          description: One page of approvals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /api/approvals/{id}:
    parameters:
      - {$ref: '#/components/parameters/ApprovalId'}
    get:
      operationId: getApproval
      tags: [approvals]
      summary: Get an approval
      description: Includes the originating event and run ids, the proposal markdown or the tool call, and for tool calls the time left before `approval_timeout`.
      x-hal-service: api
      responses:
        '200':
          description: The approval.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /api/approvals/{id}/approve:
    parameters:
      - {$ref: '#/components/parameters/ApprovalId'}
    post:
      operationId: approveApproval
      tags: [approvals]
      summary: Approve a proposal or allow a tool call
      description: |
        `proposal`: resumes the same session (or a new one, recorded as `resumed_via`) under the auto policy with
        "Approved. Execute the plan." plus the comment. `tool_call`: allows the pending call and the agent continues.
        409 `invalid-state` when the approval is no longer pending (decided, or expired after a restart or timeout).
        Accepted while paused; the resumed run starts when the kill switch is released.
      x-hal-service: approve
      x-hal-paused: queue
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApproveRequest'}
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Error'}
  /api/approvals/{id}/deny:
    parameters:
      - {$ref: '#/components/parameters/ApprovalId'}
    post:
      operationId: denyApproval
      tags: [approvals]
      summary: Deny a proposal or tool call
      description: |
        `proposal`: records the denial and routes the node to port `denied`.
        `tool_call`: rejects that call and the agent continues. With `cancel_run: true` the run is cancelled instead
        (`session/cancel`, status `denied`). `cancel_run` on a proposal is a 422. 409 `invalid-state` when the
        approval is no longer pending.
      x-hal-service: approve
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DenyRequest'}
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        default: {$ref: '#/components/responses/Error'}
  /api/inbox:
    get:
      operationId: listInbox
