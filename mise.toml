[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
gitleaks = "8.30.1"
node = "24.22.1"
pnpm = "11.28.8"
watchexec = "2.8.0"
uv = "0.13.7"
actionlint = "1.7.7"

[tasks.setup]
description = "Install git hooks and web dependencies"
run = [
  "lefthook install",
  "pnpm --dir web install --frozen-lockfile",
  "git config merge.keepours.driver true",
]

[tasks.check]
description = "Every check the hooks run, on the whole tree (static, race, sharded e2e and web in parallel)"
depends = ["check:static", "race", "e2e", "check:web"]

[tasks."check:static"]
description = "gitleaks, format, go.mod tidy, lint"
run = [
  "gitleaks git --redact --no-banner",
  "golangci-lint fmt --diff ./...",
  "go mod tidy -diff",
  "golangci-lint run ./...",
  "actionlint",
]

[tasks."check:web"]
description = "Web format, lint, typecheck, tests"
run = "pnpm --dir web check"

[tasks.race]
description = "Race detector on every package except e2e (e2e runs sharded: RACE=1 mise run e2e)"
env = { GORACE = "atexit_sleep_ms=0" }
run = "go test -race -count=1 $(go list ./... | grep -v '/e2e$')"

[tasks.dev]
description = "Hot-reload dev loop: open http://localhost:5173 (UI hot-reloads; the daemon restarts on Go/content changes)"
depends = ["dev:api", "dev:web"]

[tasks."dev:api"]
description = "Rebuild and restart the daemon on 127.0.0.1:9001 whenever Go code, the API contract or seed content changes"
run = "watchexec --restart --stop-signal SIGTERM --stop-timeout 10s --exts go,yaml,sql,md --watch cmd --watch internal --watch api --watch content -- 'go build -o bin/hal9001-dev ./cmd/hal9001 && HAL9001_UI_URL=http://localhost:5173 exec bin/hal9001-dev serve'"

[tasks."dev:web"]
description = "Vite dev server with hot module reload; proxies /api to the daemon"
run = "pnpm --dir web dev"

[tasks.build]
description = "Build the web UI and a hal9001 binary with the UI embedded (bin/hal9001)"
run = [
  "pnpm --dir web build",
  "go build -tags embedui -ldflags \"-X main.version=${HAL9001_RELEASE_VERSION:-$(git describe --always --dirty)}\" -o bin/hal9001 ./cmd/hal9001",
]

[tasks.e2e]
description = "API-driven e2e suite (real daemon, fake ACP agent) in E2E_SHARDS parallel shards (default 4); RACE=1 adds -race"
env = { GORACE = "atexit_sleep_ms=0" }
run = "scripts/e2e.sh"

[tasks.sandbox]
description = "Throwaway daemon on a free port with a fake agent runtime (--port, --script, --web-dir, --keep)"
run = "go run ./cmd/hal9001-sandbox"

[tasks.app]
description = "Build bin/HAL9001.app (release id) and bin/HAL9001 Dev.app (dev id), ad-hoc signed; no install by default (to install the dev copy run HAL9001_APP_INSTALL_DIR=~/Applications mise run app; also HAL9001_APP_DEV_HOME, HAL9001_APP_DEV_PORT: see scripts/build-app.sh)"
depends = ["build"]
run = "scripts/build-app.sh"

[tasks."app:run"]
description = "Run the macOS app from source, outside a bundle: menu and API client only, no service management (HAL9001_URL / HAL9001_UI_URL override the daemon and UI URLs)"
alias = "menubar"
run = "go run ./cmd/hal9001-app"

[tasks."build:all"]
description = "Build everything: hal9001 with embedded UI and the macOS app bundles"
depends = ["build", "app"]

[tasks.dmg]
description = "Build bin/HAL9001-<version>.dmg (drag-to-Applications installer) from bin/HAL9001.app; run `mise run app` first.  Layout is written by dmgbuild (uvx, pinned), no Finder needed; fails if dmgbuild fails"
run = "scripts/make-dmg.sh"

[tasks.release]
description = "Build the app bundles, then the DMG installer"
depends = ["app"]
run = "scripts/make-dmg.sh"

[tasks."dmg:check"]
description = "Mount the newest bin/HAL9001-*.dmg read-only and verify the app, Applications symlink, background and .DS_Store layout (background set, icon positions)"
run = "scripts/check-dmg.sh"

[tasks."update:keygen"]
description = "Generate the update-signing key pair: private key to ./update-signing-key.txt (gitignored), public key to internal/update/publickey.txt; prints next steps"
run = "go run ./cmd/hal9001-release keygen --private-out update-signing-key.txt"
