name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAL9001_RELEASE_VERSION: 0.1.${{ github.run_number }}
      HAL9001_RELEASE_BUILD: ${{ github.run_number }}
      HAL9001_APP_INSTALL_DIR: none
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Test
        run: mise exec -- go test -short ./...

      - name: Build app and DMG
        run: |
          mise run release
          mise run dmg:check

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp "bin/HAL9001-${HAL9001_RELEASE_VERSION}.dmg" dist/
          ditto -c -k --keepParent bin/HAL9001.app "dist/HAL9001-${HAL9001_RELEASE_VERSION}.app.zip"
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS)

      - name: Release notes
        run: |
          sha=$(git rev-parse HEAD)
          prev=$(git tag --list 'v0.1.*' --sort=-v:refname | head -n 1)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --pretty='- %s (%h)' -n 200 "$range"
            echo
            echo "Commit: $sha"
            echo
            echo "## Install"
            echo
            echo "Open the DMG and drag HAL9001 to Applications. The app is ad-hoc signed: open it once (macOS blocks it), then go to System Settings > Privacy & Security and click Open Anyway. On macOS 14 and earlier, right-click > Open also works."
          } > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: HAL9001-${{ env.HAL9001_RELEASE_VERSION }}
          path: dist/*

      - name: Update manifest
        id: manifest
        env:
          HAL9001_UPDATE_SIGNING_KEY: ${{ secrets.HAL9001_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$HAL9001_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::HAL9001_UPDATE_SIGNING_KEY is not set: publishing without a signed update manifest; installed apps will not see this build"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${HAL9001_RELEASE_VERSION}"
          zip="dist/HAL9001-${HAL9001_RELEASE_VERSION}.app.zip"
          mkdir -p manifests
          # Channel policy: main builds go to beta only. Stable is promoted by
          # pushing a stable/v0.1.N tag (.github/workflows/promote.yml).
          mise exec -- go run ./cmd/hal9001-release manifest \
            --channel beta \
            --version "$HAL9001_RELEASE_VERSION" \
            --build "$HAL9001_RELEASE_BUILD" \
            --commit "$GITHUB_SHA" \
            --zip "$zip" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$zip")" \
            --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
            --notes-file notes.md \
            --min-macos 13.0 \
            --key-env HAL9001_UPDATE_SIGNING_KEY \
            --out manifests/beta.json
          cp manifests/beta.json dist/update.json
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Releases are immutable once published (assets and tag are locked), so a rerun of this workflow (same run number,
      # same tag) can neither repair nor replace v0.1.N. If it is complete, reuse it; if not, fail.
      - name: Publish release
        run: |
          tag="v${HAL9001_RELEASE_VERSION}"
          assets=(dist/*.dmg dist/*.app.zip dist/SHA256SUMS)
          want=("HAL9001-${HAL9001_RELEASE_VERSION}.dmg" "HAL9001-${HAL9001_RELEASE_VERSION}.app.zip" SHA256SUMS)
          if [ "${{ steps.manifest.outputs.signed }}" = "true" ]; then
            assets+=(dist/update.json)
            want+=(update.json)
          fi
          if gh release view "$tag" --json assets -q '.assets[].name' > existing-assets.txt 2> release-view.err; then
            missing=""
            for a in "${want[@]}"; do
              grep -qxF "$a" existing-assets.txt || missing="$missing $a"
            done
            if [ -n "$missing" ]; then
              echo "::error::release $tag already exists but is missing:$missing. Immutable releases cannot be repaired (assets cannot be added and the tag cannot be reused); push a new commit to get the next build number."
              exit 1
            fi
            echo "release $tag already exists with all assets; not creating it again"
            if [ "${{ steps.manifest.outputs.signed }}" = "true" ]; then
              # This build's zip is not byte-identical to the published one, so publish the manifest that ships with the release.
              gh release download "$tag" --pattern update.json --dir existing-release --clobber
              cp existing-release/update.json manifests/beta.json
            fi
          elif grep -q 'release not found' release-view.err; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "HAL9001 ${HAL9001_RELEASE_VERSION}" \
              --notes-file notes.md \
              "${assets[@]}"
          else
            cat release-view.err
            echo "::error::could not look up release $tag"
            exit 1
          fi

      # The update feed lives on GitHub Pages (gh-pages branch), not in a release: immutable releases cannot be updated.
      # The push retries on its own when promote.yml pushes the other channel at the same time.
      - name: Publish beta manifest
        if: steps.manifest.outputs.signed == 'true'
        run: |
          scripts/publish-feed.sh manifests/beta.json "beta: ${HAL9001_RELEASE_VERSION}"
