name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAL9001_RELEASE_VERSION: 0.1.${{ github.run_number }}
      HAL9001_RELEASE_BUILD: ${{ github.run_number }}
      HAL9001_APP_INSTALL_DIR: none
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Test
        run: mise exec -- go test -short ./...

      - name: Build app and DMG
        run: |
          mise run release
          mise run dmg:check

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp "bin/HAL9001-${HAL9001_RELEASE_VERSION}.dmg" dist/
          ditto -c -k --keepParent bin/HAL9001.app "dist/HAL9001-${HAL9001_RELEASE_VERSION}.app.zip"
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS)

      - name: Release notes
        run: |
          sha=$(git rev-parse HEAD)
          prev=$(git tag --list 'v0.1.*' --sort=-v:refname | head -n 1)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "## Changes"
            echo
            git log --pretty='- %s (%h)' -n 200 "$range"
            echo
            echo "Commit: $sha"
            echo
            echo "## Install"
            echo
            echo "Open the DMG and drag HAL9001 to Applications. The app is ad-hoc signed: open it once (macOS blocks it), then go to System Settings > Privacy & Security and click Open Anyway. On macOS 14 and earlier, right-click > Open also works."
          } > notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: HAL9001-${{ env.HAL9001_RELEASE_VERSION }}
          path: dist/*

      - name: Update manifest
        id: manifest
        env:
          HAL9001_UPDATE_SIGNING_KEY: ${{ secrets.HAL9001_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$HAL9001_UPDATE_SIGNING_KEY" ]; then
            echo "::warning::HAL9001_UPDATE_SIGNING_KEY is not set: publishing without a signed update manifest; installed apps will not see this build"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="v${HAL9001_RELEASE_VERSION}"
          zip="dist/HAL9001-${HAL9001_RELEASE_VERSION}.app.zip"
          mkdir -p manifests
          # Channel policy: space-separated channels that every main build is published to.
          CHANNELS="stable beta"
          for channel in $CHANNELS; do
            mise exec -- go run ./cmd/hal9001-release manifest \
              --channel "$channel" \
              --version "$HAL9001_RELEASE_VERSION" \
              --build "$HAL9001_RELEASE_BUILD" \
              --commit "$GITHUB_SHA" \
              --zip "$zip" \
              --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$zip")" \
              --notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
              --notes-file notes.md \
              --min-macos 13.0 \
              --key-env HAL9001_UPDATE_SIGNING_KEY \
              --out "manifests/${channel}.json"
          done
          cp "manifests/${CHANNELS%% *}.json" dist/update.json
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: |
          assets=(dist/*.dmg dist/*.app.zip dist/SHA256SUMS)
          if [ "${{ steps.manifest.outputs.signed }}" = "true" ]; then
            assets+=(dist/update.json)
          fi
          gh release create "v${HAL9001_RELEASE_VERSION}" \
            --target "$GITHUB_SHA" \
            --title "HAL9001 ${HAL9001_RELEASE_VERSION}" \
            --notes-file notes.md \
            "${assets[@]}"

      - name: Publish channel manifests
        if: steps.manifest.outputs.signed == 'true'
        run: |
          if ! gh release view channels >/dev/null 2>&1; then
            gh release create channels \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Update channels" \
              --notes "Update manifests (stable.json, beta.json) read by the HAL9001 app updater. Managed by CI; do not edit."
          fi
          gh release upload channels manifests/*.json --clobber
