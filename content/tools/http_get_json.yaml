description: Fetch a URL with HTTP GET and return the JSON response body. Fails on a non-2xx status or a body that is not JSON.
params:
  url:
    type: string
    description: The http or https URL to fetch.
    required: true
lang: python
script: |
  import json, os, sys, urllib.request

  url = os.environ["ARG_URL"]
  if not url.startswith(("http://", "https://")):
      sys.exit("url must start with http:// or https://")
  req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "hal9001"})
  with urllib.request.urlopen(req, timeout=20) as resp:
      body = resp.read()
  json.dump(json.loads(body), sys.stdout)
approve: always
timeout: 30s
