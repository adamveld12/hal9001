# Linear changes on your assigned issues: skip closed issues, then a read-only agent writes an inbox note.
id: linear-triage
enabled: false
dry_run: true
subscribe: [linear-assigned]
max_concurrent: 2
nodes:
  - id: skip-closed
    type: command
    lang: jq
    script: 'select((.state_type // "") | IN("completed", "canceled") | not) | . + {_reason: "open item"}'
    ui: {x: 100, y: 120}

  - id: triage
    type: agent
    runtime: claude
    mode: readonly
    prompt: linear-triage
    timeout: 10m
    ui: {x: 340, y: 120}

edges:
  - {from: skip-closed, to: triage}
