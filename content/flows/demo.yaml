# Credential-free demo: demo-ticker -> drop noise -> route by severity -> inbox.
id: demo
enabled: true
dry_run: false
subscribe: [demo-ticker]
max_concurrent: 2
nodes:
  - id: drop-noise
    type: command
    lang: jq
    script: 'select(.severity != "noise") | . + {_reason: "not noise"}'
    ui: {x: 100, y: 120}

  - id: route
    type: command
    lang: jq
    ports: [urgent, normal]
    script: '. + {_port: (if .severity == "urgent" then "urgent" else "normal" end)}'
    ui: {x: 400, y: 120}

  - id: note-urgent
    type: inbox
    title: "Urgent: {{.input.title}}"
    priority: urgent
    summary_md: "{{.input.text}}\n\n{{.input.url}}"
    ui: {x: 700, y: 60}

  - id: note-normal
    type: inbox
    title: "{{.input.title}}"
    priority: normal
    summary_md: "{{.input.text}}\n\n{{.input.url}}"
    ui: {x: 700, y: 200}

edges:
  - {from: drop-noise, to: route}
  - {from: route, port: urgent, to: note-urgent}
  - {from: route, port: normal, to: note-normal}
