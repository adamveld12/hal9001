# Unread mail from the imap-mail sensor (Gmail over IMAP with an app password): skip automated senders, then a read-only agent writes an inbox note with a draft reply. Nothing is sent.
id: email-secretary
enabled: false
dry_run: true
subscribe: [imap-mail]
max_concurrent: 2
nodes:
  - id: skip-automated
    type: command
    lang: jq
    script: 'select((.from // "") | test("no-?reply|donotreply|notifications?@"; "i") | not) | . + {_reason: "human sender"}'
    ui: {x: 100, y: 120}

  - id: secretary
    type: agent
    runtime: claude
    mode: readonly
    prompt: email-secretary
    timeout: 10m
    ui: {x: 400, y: 120}

edges:
  - {from: skip-automated, to: secretary}
