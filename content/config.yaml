# hal9001 config. Hot-reloaded on change.

# Agent concurrency (global), command-node pool, and per-flow default live here;
# flows override max_concurrent individually.
max_agent_runs: 2
max_command_runs: 8

# Retention. Nightly prune removes runs, events, blobs and worktrees older than
# retention_days (except anything linked to a starred inbox item or a pending
# approval). Dedup keys are kept longer so old items do not re-fire.
retention_days: 30
dedup_retention_days: 180

# Items at or above this priority raise a macOS notification
# (low | normal | high | urgent).
notify_min_priority: normal

# How long a per-tool approval request waits before it is rejected and the run
# fails with approval_timeout.
approval_timeout: 1h

# Steered denials (a denial with additional steering text) one run or
# conversation takes before the next gated action is held for you and the agent
# is told to stop and wait. 1 to 100.
max_steers_per_run: 3

# Hostnames (besides localhost:9001 and 127.0.0.1:9001) the server accepts.
# "Share on your tailnet" (Settings > Auth, `hal9001 tailscale serve`) adds
# this Mac's Tailscale name (e.g. my-mac.my-tailnet.ts.net) here itself. Only edit
# this by hand for a setup hal9001 does not manage. The same action writes a
# `tailscale: {serve: true, https_port: 443}` section at the end of this file;
# while serve is true, hal9001 puts the mapping back at start if Tailscale lost it.
allowed_hosts: []

# Logins accepted by the tailscale-identity auth module. Empty = the login that
# owns this Mac.
allowed_logins: []

# ACP agent runtimes (docs/runtimes.md, docs/acp-lockdown.md). A runtime is an
# agent speaking ACP over stdio. For `kind: claude | codex | omp` with no
# `command`, hal9001 finds the agent itself:
#   - it looks for the claude, codex and omp CLIs on your PATH and checks that you
#     are signed in (`claude login`, `codex login`; for omp configure a provider
#     with `omp login <provider>`). Settings > Runtimes and `hal9001 runtimes status`
#     show what is missing and how to fix it.
#   - omp runs its built-in `omp acp`. Claude and Codex need an ACP adapter
#     (claude-agent-acp, codex-acp) that requires Node.js 22+; install it with the
#     "Install adapter" button in Settings > Runtimes or `hal9001 runtimes install
#     <name>`. hal9001 installs a pinned version with npm into <home>/data/adapters;
#     nothing is downloaded at run time.
# Set `command` (argv) to run any ACP agent yourself; hal9001 then uses it as
# written. `kind` still applies the lockdown below.
#
# Agents run LOCKED DOWN: no shell, file, web or sub-agent tools of their own; they
# act only through the MCP tools hal9001 injects (its `hal` server: gh, now, run
# context, sandbox and custom tools, assist draft tools). For a runtime hal9001
# recognizes (`kind: claude | codex | omp`, or detected from the command) it adds the
# lockdown itself: session options for Claude, spawn flags, an overlay file and env
# for omp, a generated CODEX_HOME and env for Codex, plus MCP call timeouts long
# enough for a human approval. Anything you set under `modes`, `ask`, `full`,
# `env`, `session_meta` is merged under those; the lockdown values win. A runtime
# of another kind runs as configured, and every permission request it makes is
# rejected unless it is one of hal9001's own tools or matches the node's
# `allow.tools`.
# `env` is added to the agent process; "{{data}}" stands for <home>/data. The
# engine creates the isolated CODEX_HOME / PI_CODING_AGENT_DIR directories and
# symlinks the existing login into them.
runtimes:
  claude: {kind: claude}
  codex: {kind: codex}
  omp: {kind: omp}

# Auth: PAM-style stacks per service (see REQUIREMENTS section 10.4).
# localhost-trust lets local requests in; tailscale-identity signs in tailnet
# devices that arrive through `tailscale serve`; webauthn and password are fallbacks.
auth:
  stacks:
    default:
      - {module: localhost-trust, control: sufficient}
      - {module: tailscale-identity, control: sufficient}
      - {module: webauthn, control: sufficient}
      - {module: password, control: sufficient}
  services: {ui: default, api: default, approve: default, admin: default}
