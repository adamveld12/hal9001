# Git hooks for hal9001. Install with `mise run setup`.
# Tools are pinned in mise.toml; every command runs through `mise exec` so hooks, agents, and manual runs use the same versions.

pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner

    go-fmt:
      glob: "*.go"
      run: mise exec -- golangci-lint fmt --diff {staged_files}

    go-mod-tidy:
      glob: "{go.mod,go.sum,*.go}"
      run: mise exec -- go mod tidy -diff

    golangci-lint:
      glob: "*.go"
      run: mise exec -- golangci-lint run ./...

    go-test:
      glob: "{*.go,go.mod,go.sum}"
      run: mise exec -- go test -short ./...

    api-types:
      glob: "{api/openapi.yaml,web/src/api/schema.d.ts}"
      run: |
        mise exec -- pnpm --dir web gen:api
        if ! git diff --quiet -- web/src/api/schema.d.ts; then
          echo "web/src/api/schema.d.ts is out of date with api/openapi.yaml."
          echo "Run: mise exec -- pnpm --dir web gen:api   and stage web/src/api/schema.d.ts"
          exit 1
        fi

    web-format:
      root: "web/"
      glob: "*.{ts,tsx,js,jsx,json,css,html,md}"
      run: mise exec -- pnpm exec prettier --check {staged_files}

    web-lint:
      root: "web/"
      glob: "*.{ts,tsx,js,jsx}"
      run: mise exec -- pnpm exec oxlint --deny-warnings {staged_files}

    web-typecheck:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: mise exec -- pnpm typecheck

    web-test:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: mise exec -- pnpm test

pre-push:
  parallel: true
  commands:
    race:
      run: mise run race
    e2e-race:
      run: RACE=1 mise run e2e
    web-check:
      root: "web/"
      run: mise exec -- pnpm check
